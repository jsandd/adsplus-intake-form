<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solve Builder — Beyond the Map's Edge</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" onerror="this.remove()">
<style>
:root{--g0:#0f1217;--g1:#161b22;--g2:#1d2430;--g3:#273040;--line:#2b3442;--ink:#e8ecf2;--ink2:#a6b0bd;--ink3:#727d8c;--gold:#e2b24d;--ok:#4cc48d;--warn:#ef955c;--bad:#f06b6b;--ai:#b7a3ff;--c2:#6fb3d8;font-size:14px}
*{box-sizing:border-box}body{margin:0;background:var(--g0);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
.top{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--g1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;letter-spacing:.04em;text-transform:uppercase}
.top .sub{font-size:11px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.score{display:flex;gap:14px;align-items:baseline;margin-left:auto}
.score b{font-size:22px}
.score small{color:var(--ink3)}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:6px 14px;background:var(--g2);border-bottom:1px solid var(--line);font-size:12px;align-items:center}
.bar .c{background:var(--g3);border-radius:4px;padding:3px 8px}
.bar .c b{color:var(--gold);font-weight:600;margin-right:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.bar .seed{border:1px solid var(--gold)}
.grow{flex:1}
.wrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:0;min-height:calc(100vh - 100px)}
.poem{border-right:1px solid var(--line);background:var(--g1);padding:10px}
.pl{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;align-items:start}
.pl:hover{background:var(--g2)}.pl.sel{background:var(--g3);border-color:var(--gold)}
.pl .ref{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--gold)}
.pl .t{font-size:13.5px}
.pl .cm{font-size:12px;color:var(--ink2);margin-top:3px}
.pl .cm b{color:var(--ink)}
.stz{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:10px 8px 4px}
.tag{display:inline-block;font-size:10px;letter-spacing:.04em;padding:1px 6px;border-radius:3px;background:var(--g3);color:var(--ink2);vertical-align:middle;white-space:nowrap}
.tag.literal{background:#2f4a3a;color:#9be3b8}.tag.feature_class{background:#2f3f4a;color:#9fd0ea}.tag.direction{background:#463a2b;color:#f3c58a}.tag.wordplay{background:#4a2f46;color:#e9a3dc}.tag.naming{background:#2b3f46;color:#8fd6d6}.tag.numeric{background:#3a3a2b;color:#e6e08a}.tag.personal{background:#3a2f4a;color:#c9b1ff}.tag.structural{background:#333;color:#bbb}
.tier{font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid;white-space:nowrap}
.tier.confirmed{color:var(--ok);border-color:var(--ok)}.tier.reported{color:var(--c2);border-color:var(--c2)}.tier.circulating{color:var(--warn);border-color:var(--warn)}.tier.fan{color:#d9a0ff;border-color:#d9a0ff}.tier.unverified{color:var(--ink3);border-color:var(--ink3)}
.main{padding:12px 16px;min-width:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--ink2);font-size:13px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.panel{background:var(--g1);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.ph{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.pb{padding:10px 12px}
.btn{background:var(--g2);border:1px solid var(--line);border-radius:5px;padding:5px 10px;font-size:12.5px}
.btn:hover{background:var(--g3)}.btn.gold{background:var(--gold);color:#1a1508;border-color:var(--gold);font-weight:600}.btn.ai{border-color:var(--ai);color:var(--ai)}.btn.bad{color:var(--bad)}.btn.sm{padding:2px 7px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--g0);border:1px solid var(--line);border-radius:5px;padding:5px 8px;color:var(--ink);width:100%}
textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.sug{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.sug:first-child{border-top:0}
.sug.viol{background:rgba(240,107,107,.08)}
.sug .t{font-weight:600}
.sug .r{font-size:12.5px;color:var(--ink2);margin-top:2px}
.sug .m{font-size:11px;color:var(--ink3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sug .flag{color:var(--bad);font-size:11px}
.sug .sup{color:var(--ok)}.sug .con{color:var(--bad)}
.sug .acts{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.sug .acts select{width:auto;padding:2px 4px;font-size:11px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--g2);border-radius:100px;padding:2px 9px;font-size:11.5px}
.chip.on{border-color:var(--gold);color:var(--gold)}
.conf{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.conf.hard{border-left:3px solid var(--bad)}.conf.soft{border-left:3px solid var(--warn)}.conf.ov{opacity:.6}
.big{font-size:26px;font-weight:700;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--ink3);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
td.diff{background:rgba(226,178,77,.12)}
#map{height:520px;border-radius:8px;background:var(--g2)}
.react{border:1px solid var(--ai);background:rgba(183,163,255,.08)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--g0);padding:8px 14px;border-radius:100px;z-index:50}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40}
.modal .box{background:var(--g1);border:1px solid var(--line);border-radius:10px;padding:16px;width:min(760px,95vw);max-height:90vh;overflow:auto}
.hint{color:var(--ink3);font-size:12px}
.gap{border:1px dashed var(--warn);color:var(--warn);padding:6px 10px;border-radius:6px;font-size:12.5px}
.ai-out{white-space:pre-wrap;font-size:13px;line-height:1.5;border-left:2px solid var(--ai);padding-left:10px}
.stat{background:var(--g2);border-radius:6px;padding:8px 10px}
.stat .k{display:block}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}.poem{border-right:0;border-bottom:1px solid var(--line)}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div><h1>Solve Builder</h1><div class="sub">Beyond the Map's Edge</div></div>
  <select id="solveSel" style="width:auto;max-width:320px"></select>
  <button class="btn" id="newSolve">New solve</button>
  <button class="btn" id="forkBtn" title="Fork this solve at the selected line">Fork</button>
  <button class="btn" id="undoBtn">↶</button><button class="btn" id="redoBtn">↷</button>
  <button class="btn ai" id="devilBtn">Devil's advocate</button>
  <button class="btn ai" id="interviewBtn">Interview me</button>
  <div class="score" id="score"></div>
</header>
<div class="bar" id="bar"></div>
<div class="wrap">
  <aside class="poem" id="poem"></aside>
  <main class="main">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" onerror="window.L=null"></script>
<script>
const S={ov:null,view:null,sid:null,ref:null,tab:'line',sugg:null,catFilter:'',saved:{},map:null,layer:null,reaction:null,field:{pos:null}};
const CATS={literal:'Literal place',feature_class:'Feature class',direction:'Direction / action',wordplay:'Wordplay',naming:'Naming & culture',numeric:'Numeric / cipher',personal:'Personal to Posey',structural:'Structural'};
const TABS=[['line','Line'],['map','Map'],['bearing','Bearing'],['cipher','Cipher'],['archive','Archive'],['layers','Layers'],['rules','Rules'],['solves','Solves'],['auto','Auto search'],['reverse','Reverse'],['feas','Feasibility'],['field','Field'],['data','Data']];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=s=>document.querySelector(s);
async function api(path,body,method){const r=await fetch('/api/'+path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok||j.error){toast(j.error||('error '+r.status));throw new Error(j.error||r.status)}return j}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function modal(html){$('#modal').innerHTML=html?`<div class="modal" onclick="if(event.target.classList.contains('modal'))modal('')"><div class="box">${html}</div></div>`:''}
const tierTag=t=>`<span class="tier ${t||'unverified'}" title="${esc(S.ov?.tiers?.[t]||'')}">${t||'unverified'}</span>`;
const catTag=c=>`<span class="tag ${c}">${CATS[c]||c}</span>`;

async function boot(){S.ov=await api('state');if(!S.ov.poem){return pastePoem()}if(!S.sid){const mine=S.ov.solves.find(s=>s.kind==='mine');S.sid=mine?mine.id:null}if(S.sid){S.view=await api('solve/'+S.sid)}renderAll()}
function pastePoem(){modal(`<h2 style="margin-top:0">Paste the poem</h2><p class="hint">Blank lines separate stanzas. Lines are referenced as S2L3 (stanza 2, line 3). You can load a different poem later from Data.</p><input type="text" id="pTitle" placeholder="Title" value="Beyond the Map's Edge"><textarea id="pRaw" style="min-height:300px;margin-top:8px;font-family:ui-monospace,monospace"></textarea><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn gold" onclick="savePoem()">Save poem</button></div>`)}
async function savePoem(){await api('poem',{title:$('#pTitle').value,raw:$('#pRaw').value});modal('');S.ov=null;boot()}

function renderAll(){renderHeader();renderBar();renderPoem();renderTabs();renderTab()}
function renderHeader(){const sel=$('#solveSel');sel.innerHTML=S.ov.solves.map(s=>`<option value="${s.id}" ${s.id===S.sid?'selected':''}>${s.kind==='reference'?'◇ ':''}${esc(s.name)} · ${s.score}</option>`).join('')||'<option>no solves yet</option>';const v=S.view;$('#score').innerHTML=v?`<span><b>${v.score.total}</b> <small>score</small></span><span><small>poem</small> ${v.score.poem}</span><span title="How much of the score the seed contributed"><small>seed</small> ${v.score.seed} <b style="font-size:14px;color:${v.score.seed_share>=40?'var(--bad)':'var(--ok)'}">${v.score.seed_share}%</b></span><span><small>−</small>${v.score.penalty}</span>`:''}
function renderBar(){const b=$('#bar');if(!S.view){b.innerHTML='<span class="hint">Create a solve to begin. Start poem-first, or seed a state, region, feature or endpoint — every seed is optional.</span>';return}const c=S.view.constraints,sd=S.view.seed;b.innerHTML=`<span class="c seed" title="Seed"><b>seed</b>${esc(c.seed||'none — poem first')}</span><span class="c"><b>states</b>${c.states.join(', ')||'any in play'} <span class="hint">· out: ${c.eliminated.join(', ')}</span></span><span class="c"><b>region</b>${esc(c.region||'—')}</span><span class="c"><b>point</b>${c.point?c.point[0].toFixed(4)+', '+c.point[1].toFixed(4)+' ('+c.point_ref+')':'—'}</span><span class="c"><b>bearing</b>${c.bearing!=null?c.bearing+'° ('+c.bearing_ref+')':'—'}</span><span class="c"><b>elev</b>${c.elev?c.elev.toLocaleString()+' ft':'—'}</span><span class="c"><b>land</b>${esc(c.owner||'unknown')}</span><span class="c"><b>route</b>${c.distance} mi · ${c.legs.length} legs</span><span class="grow"></span><button class="btn sm" onclick="seedDialog()">Edit seed</button>${S.view.solve.state.seed&&Object.keys(S.view.solve.state.seed).length?`<button class="btn sm" onclick="dropSeed()" title="Drop the seed and re-score unconstrained">Drop seed & rescore</button>`:''}<label class="hint"><input type="checkbox" ${S.view.solve.state.hard_filter?'checked':''} onchange="setOpt('hard_filter',this.checked)"> hard filter</label><label class="hint"><input type="checkbox" ${S.view.solve.state.hide_violations?'checked':''} onchange="setOpt('hide_violations',this.checked)"> hide violations</label>`}
function renderPoem(){const p=$('#poem');const lines=S.ov.poem.lines;let st=0,h='';const L=S.view?.solve.state.lines||{};for(const l of lines){if(l.stanza!==st){st=l.stanza;h+=`<div class="stz">Stanza ${st} · ${({1:'method',2:'approach',3:'construction',4:'site — boots on the ground',5:'warning'})[st]||''}</div>`}const c=L[l.ref];h+=`<div class="pl ${S.ref===l.ref?'sel':''}" onclick="selectLine('${l.ref}')"><span class="ref">${l.ref}${c?.locked?' 🔒':''}</span><span><div class="t">${esc(l.text)}</div>${c?`<div class="cm">${catTag(c.category)} <b>${esc(c.text)}</b> ${tierTag(c.tier)} · sure ${c.conf}${c.lat!=null?' · 📍':''}${c.note?' · 📝':''}</div>`:''}</span><span>${c?`<button class="btn sm" onclick="event.stopPropagation();uncommit('${l.ref}')" title="Remove">✕</button>`:''}</span></div>`}p.innerHTML=h+(S.view?.seed_suggest?`<div class="panel" style="margin-top:10px"><div class="pb"><div class="k">Seed suggestion</div><p style="margin:4px 0">${esc(S.view.seed_suggest.text)}</p>${S.view.seed_suggest.corridors.map(c=>`<div class="row" style="margin:3px 0"><span class="grow">${esc(c.name)} · ${c.share}% <span class="hint">${esc(c.examples.join(', '))}</span></span><button class="btn sm" onclick="seedRegion('${c.id}')">Seed it</button></div>`).join('')}<div class="hint">Or decline and keep working blind.</div></div></div>`:'')+(S.view?`<div class="panel" style="margin-top:10px"><div class="ph"><h3>Conflicts</h3><span class="hint">${S.view.contradictions.filter(x=>!x.overridden).length} open</span></div>${S.view.contradictions.map(x=>`<div class="conf ${x.severity} ${x.overridden?'ov':''}"><span>${esc(x.text)}${x.overridden?`<div class="hint">overridden: ${esc(x.note)}</div>`:''}</span><span>${x.overridden?`<button class="btn sm" onclick="override('${x.code}',true)">un-override</button>`:`<button class="btn sm" onclick="override('${x.code}')">override…</button>`}</span></div>`).join('')||'<div class="pb hint">No conflicts detected.</div>'}</div><div class="panel"><div class="ph"><h3>Weakest links</h3><span class="hint">load vs confidence</span></div><table>${S.view.weakest.slice(0,6).map(w=>`<tr><td>${w.ref}</td><td>${esc(w.text)}</td><td>load ${w.load}</td><td>sure ${w.conf}</td><td style="color:${w.gap>0.8?'var(--bad)':'var(--ink2)'}">gap ${w.gap}</td></tr>`).join('')||'<tr><td class="hint">Commit lines to see where the weight sits.</td></tr>'}</table></div>`:'')}
function renderTabs(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';renderTab()">${l}${k==='archive'&&S.ov.monitor_new?` <span class="tag">${S.ov.monitor_new} new</span>`:''}</button>`).join('')}
function renderTab(){renderTabs();const fn={line:viewLine,map:viewMap,bearing:viewBearing,cipher:viewCipher,archive:viewArchive,layers:viewLayers,rules:viewRules,solves:viewSolves,auto:viewAuto,reverse:viewReverse,feas:viewFeas,field:viewField,data:viewData}[S.tab];fn()}

// ---------------- solves
$('#solveSel').onchange=async e=>{S.sid=e.target.value;S.view=await api('solve/'+S.sid);S.sugg=null;renderAll()};
$('#newSolve').onclick=()=>newSolveDialog();
$('#forkBtn').onclick=async()=>{if(!S.view)return;const name=prompt('Name for the fork',S.view.solve.name+' — fork'+(S.ref?' at '+S.ref:''));if(name===null)return;const v=await api('solve/'+S.sid+'/fork',{ref:S.ref,name});S.ov=await api('state');S.sid=v.solve.id;S.view=v;renderAll();toast('Forked. The original is untouched.')};
$('#undoBtn').onclick=async()=>{if(!S.view)return;S.view=await api('solve/'+S.sid+'/undo',{});S.sugg=null;renderAll()};
$('#redoBtn').onclick=async()=>{if(!S.view)return;S.view=await api('solve/'+S.sid+'/redo',{});S.sugg=null;renderAll()};
$('#devilBtn').onclick=()=>aiPanel('devil',"Devil's advocate");
$('#interviewBtn').onclick=async()=>{if(!S.view)return;modal('<div class="hint">Interviewing…</div>');const r=await api('ai/interview',{solve_id:S.sid});if(r.unavailable||r.error)return modal(`<p>${esc(r.unavailable||r.error)}</p>`);modal(`<h3 style="margin-top:0">Questions for you</h3>${(r.questions||[]).map(q=>`<div class="panel"><div class="pb"><b>${esc(q.question)}</b><div class="hint">${esc(q.ref)} · ${esc(q.why)}</div></div></div>`).join('')}`)};
async function aiPanel(fn,title){if(!S.view)return;modal(`<h3 style="margin-top:0">${title}</h3><div class="hint">Thinking… (this can take a minute)</div>`);const r=await api('ai/'+fn,{solve_id:S.sid});modal(`<h3 style="margin-top:0">${title}</h3>${r.unavailable||r.error?`<p class="gap">${esc(r.unavailable||r.error)}</p>`:`<div class="ai-out">${esc(r.text)}</div>`}<div class="hint" style="margin-top:8px">Generated analysis — not a source. Anything it asserts about Posey should be checked against the archive.</div>`)}
function newSolveDialog(){const regs=S.ov.regions.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');const states=Object.entries(S.ov.states).filter(([k])=>!S.ov.eliminated.includes(k)).map(([k,n])=>`<label style="margin-right:8px"><input type="checkbox" value="${k}" class="seedSt"> ${k}</label>`).join('');modal(`<h2 style="margin-top:0">New solve</h2><input type="text" id="nsName" placeholder="Name" value="Solve ${S.ov.solves.filter(s=>s.kind==='mine').length+1}"><p class="hint">How do you want to start? Every seed is optional and can be added or removed later without losing work. A seed ranks suggestions; it does not delete them unless you turn on the hard filter.</p><div class="panel"><div class="pb"><div class="k">Poem first (default)</div><div class="hint">Nothing assumed about where. Suggestions span every state still in play.</div></div></div><div class="panel"><div class="pb"><div class="k">Seed states</div>${states}</div></div><div class="panel"><div class="pb"><div class="k">Seed a region</div><select id="nsRegion"><option value="">—</option>${regs}</select></div></div><div class="panel"><div class="pb"><div class="k">Seed a single feature (pin it to a line)</div><div class="row"><input type="text" id="nsFeat" placeholder="Name"><input type="text" id="nsFeatLL" placeholder="lat, lon" style="width:180px"><select id="nsFeatRef" style="width:110px"><option value="">line…</option>${S.ov.poem.lines.map(l=>`<option>${l.ref}</option>`).join('')}</select></div></div></div><div class="panel"><div class="pb"><div class="k">Seed an endpoint (work backward)</div><div class="row"><input type="text" id="nsEnd" placeholder="Where you think the treasure is"><input type="text" id="nsEndLL" placeholder="lat, lon" style="width:180px"></div></div></div><div class="row" style="justify-content:flex-end"><button class="btn gold" onclick="createSolve()">Create</button></div>`)}
function parseLL(s){const m=/(-?\d{1,2}\.\d+)[,\s]+(-?\d{2,3}\.\d+)/.exec(s||'');return m?[+m[1],+m[2]]:null}
async function createSolve(){const seed={};const sts=[...document.querySelectorAll('.seedSt:checked')].map(c=>c.value);if(sts.length)seed.states=sts;if($('#nsRegion').value)seed.region=$('#nsRegion').value;const fl=parseLL($('#nsFeatLL').value);if(fl)seed.feature={name:$('#nsFeat').value,lat:fl[0],lon:fl[1],ref:$('#nsFeatRef').value};const el=parseLL($('#nsEndLL').value);if(el)seed.endpoint={name:$('#nsEnd').value,lat:el[0],lon:el[1]};const v=await api('solve/new',{name:$('#nsName').value,seed});if(seed.feature&&seed.feature.ref){await api('solve/'+v.solve.id+'/commit',{ref:seed.feature.ref,candidate:{text:seed.feature.name,category:'literal',lat:seed.feature.lat,lon:seed.feature.lon,tier:'unverified',rationale:'seeded by you'},conf:2})}modal('');S.ov=await api('state');S.sid=v.solve.id;S.view=await api('solve/'+S.sid);S.ref=null;S.sugg=null;renderAll()}
function seedDialog(){const sd=S.view.solve.state.seed||{};const regs=S.ov.regions.map(r=>`<option value="${r.id}" ${sd.region===r.id?'selected':''}>${esc(r.name)}</option>`).join('');const states=Object.keys(S.ov.states).filter(k=>!S.ov.eliminated.includes(k)).map(k=>`<label style="margin-right:8px"><input type="checkbox" value="${k}" class="seedSt" ${(sd.states||[]).includes(k)?'checked':''}> ${k}</label>`).join('');modal(`<h2 style="margin-top:0">Seed</h2><p class="hint">Changing the seed re-ranks suggestions and re-scores; your committed lines stay.</p><div class="panel"><div class="pb"><div class="k">States</div>${states}</div></div><div class="panel"><div class="pb"><div class="k">Region</div><select id="nsRegion"><option value="">—</option>${regs}</select></div></div><div class="panel"><div class="pb"><div class="k">Feature</div><div class="row"><input type="text" id="nsFeat" value="${esc(sd.feature?.name||'')}" placeholder="Name"><input type="text" id="nsFeatLL" value="${sd.feature?sd.feature.lat+', '+sd.feature.lon:''}" placeholder="lat, lon" style="width:180px"></div></div></div><div class="panel"><div class="pb"><div class="k">Endpoint</div><div class="row"><input type="text" id="nsEnd" value="${esc(sd.endpoint?.name||'')}" placeholder="Name"><input type="text" id="nsEndLL" value="${sd.endpoint?sd.endpoint.lat+', '+sd.endpoint.lon:''}" placeholder="lat, lon" style="width:180px"></div></div></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="dropSeed()">Drop seed</button><button class="btn gold" onclick="saveSeed()">Save</button></div>`)}
async function saveSeed(){const seed={};const sts=[...document.querySelectorAll('.seedSt:checked')].map(c=>c.value);if(sts.length)seed.states=sts;if($('#nsRegion').value)seed.region=$('#nsRegion').value;const fl=parseLL($('#nsFeatLL').value);if(fl)seed.feature={name:$('#nsFeat').value,lat:fl[0],lon:fl[1]};const el=parseLL($('#nsEndLL').value);if(el)seed.endpoint={name:$('#nsEnd').value,lat:el[0],lon:el[1]};S.view=await api('solve/'+S.sid+'/seed',{seed});modal('');S.sugg=null;renderAll()}
async function dropSeed(){const before=S.view.score.total;S.view=await api('solve/'+S.sid+'/seed',{seed:{}});modal('');S.sugg=null;renderAll();const sd=S.view.seed;toast(`Unconstrained: score ${before} → ${S.view.score.total}; rank ${sd.unconstrained_rank||'?'} of ${sd.of} of your solves.`)}
async function seedRegion(id){S.view=await api('solve/'+S.sid+'/seed',{seed:{...(S.view.solve.state.seed||{}),region:id}});S.sugg=null;renderAll()}
async function setOpt(k,v){S.view=await api('solve/'+S.sid+'/options',{[k]:v});if(S.ref)selectLine(S.ref);else renderAll()}
async function override(code,clear){let note='';if(!clear){note=prompt('Why are you overriding this conflict? (kept with the solve)');if(note===null)return}S.view=await api('solve/'+S.sid+'/override',{code,note,clear:!!clear});renderAll()}
async function uncommit(ref){S.view=await api('solve/'+S.sid+'/uncommit',{ref});S.sugg=null;renderAll()}

// ---------------- line panel
async function selectLine(ref){S.ref=ref;S.tab='line';S.sugg=null;renderPoem();renderTabs();$('#view').innerHTML='<div class="hint">Loading suggestions…</div>';if(!S.view){$('#view').innerHTML='<div class="gap">Create a solve first.</div>';return}S.sugg=await api('solve/'+S.sid+'/suggest?ref='+ref);viewLine()}
function viewLine(){const v=$('#view');if(!S.view){v.innerHTML='<div class="gap">Create a solve to start.</div>';return}if(!S.ref){v.innerHTML='<div class="panel"><div class="pb"><p>Click a line on the left. The panel shows every candidate interpretation, tagged by the kind of leap it asks you to make, ranked by the running constraints and your seed.</p><p class="hint">Tip: commit stanza 2 first if you have a place in mind; commit stanza 1 last — it is method, not geography.</p></div></div>';return}const g=S.sugg;if(!g){v.innerHTML='<div class="hint">Loading…</div>';return}const c=S.view.solve.state.lines[S.ref];const cats=Object.keys(CATS);const shown=g.suggestions.concat(S.saved[S.ref]||[]).filter(s=>!S.catFilter||s.category===S.catFilter);const counts={};for(const s of g.suggestions.concat(S.saved[S.ref]||[]))counts[s.category]=(counts[s.category]||0)+1;v.innerHTML=`<div class="panel"><div class="ph"><h3>${S.ref}</h3><span class="grow" style="font-size:15px">${esc(g.line.text)}</span>${c?`<span class="tag">committed</span>`:''}</div>
<div class="pb"><div class="row"><label class="hint">radius <input type="range" min="1" max="400" value="${g.radius}" style="width:140px" oninput="this.nextElementSibling.textContent=this.value" onchange="setRadius(this.value)"> <b>${Math.round(g.radius)}</b> mi</label><span class="hint">${g.constraints.point?'from '+g.constraints.point_ref:'no active point — radius applies once a line above is pinned'}</span><span class="grow"></span><span class="hint">${g.shown} shown of ${g.total}</span></div>
<div class="row" style="margin-top:6px"><input type="text" id="aiInstr" placeholder="Ask for more readings, e.g. 'assume I am in the Pioneer Mountains' or 'only readings that make S4L2 easier'" style="flex:1"><input type="number" id="aiN" value="15" style="width:70px"><button class="btn ai" onclick="moreReadings()" ${S.ov.ai.ok?'':'disabled title="'+esc(S.ov.ai.reason||'')+'"'}>Generate readings</button></div>
${c?`<div class="panel" style="margin-top:8px"><div class="pb"><div class="k">Your commit</div><div class="row"><span class="grow">${catTag(c.category)} <b>${esc(c.text)}</b> ${tierTag(c.tier)}</span><label class="hint">sure <select onchange="updCommit({conf:+this.value})" style="width:auto">${[0,1,2,3].map(n=>`<option ${c.conf==n?'selected':''}>${n}</option>`).join('')}</select></label><label class="hint"><input type="checkbox" ${c.locked?'checked':''} onchange="updCommit({locked:this.checked})"> lock</label><label class="hint" title="Does this reading need you physically present?"><input type="checkbox" ${c.field?'checked':''} onchange="updCommit({field:this.checked})"> needs field</label><label class="hint" title="Does this reading imply something man-made?"><input type="checkbox" ${c.manmade?'checked':''} onchange="updCommit({manmade:this.checked})"> man-made</label></div><textarea placeholder="Notes, evidence, links…" onchange="updCommit({note:this.value})" style="margin-top:6px;min-height:50px">${esc(c.note||'')}</textarea></div></div>`:''}
${g.statements.length?`<div class="panel" style="margin-top:8px"><div class="ph"><h3>Posey on this line</h3><span class="hint">${g.statements.length} statements</span></div>${g.statements.slice(0,8).map(s=>`<div class="sug"><span><div style="font-size:13px">${s.stance==='contradicts'?'<span class="con">✕</span>':'<span class="sup">→</span>'} ${esc(s.text)}</div><div class="m">${tierTag(s.tier)} ${s.kind==='declined'?'<span class="tag" style="color:var(--warn)">declined / punted</span>':''} ${esc(s.date||'')} ${esc(s.venue||'')}</div></span></div>`).join('')}</div>`:'<div class="gap" style="margin-top:8px">No Posey statement is matched to this line in your archive. That is a gap, not evidence.</div>'}
${g.ideas.length?`<div class="row" style="margin-top:8px"><span class="k">name ideas</span>${g.ideas.map(i=>`<span class="chip">${esc(i)} · ${g.idea_counts[i]||0}</span>`).join('')}</div>`:''}
</div></div>
<div class="row" style="margin:6px 0"><span class="chips"><span class="chip ${!S.catFilter?'on':''}" onclick="S.catFilter='';viewLine()">All</span>${cats.map(k=>`<span class="chip ${S.catFilter===k?'on':''}" onclick="S.catFilter='${k}';viewLine()">${CATS[k]} ${counts[k]||0}</span>`).join('')}</span></div>
<div class="panel">${shown.map(s=>sugHTML(s)).join('')||'<div class="pb hint">Nothing survives the current filters. Widen the radius or turn off the hard filter.</div>'}</div>`}
function sugHTML(s){const dist=[];if(s.dist_active!=null)dist.push(`${s.dist_active} mi from ${S.sugg.constraints.point_ref}`);if(s.dist_next!=null)dist.push(`${s.dist_next} mi to ${S.sugg.constraints.next_ref}`);if(s.dist_seed!=null)dist.push(`${s.dist_seed} mi from seed`);const viol=s.hard_violation||s.eliminated;return `<div class="sug ${viol?'viol':''}" data-id="${esc(s.id)}"><span><div class="t">${catTag(s.category)} ${esc(s.text)} ${tierTag(s.tier)} ${s.seed_match?'<span class="tag" style="color:var(--gold)">seed</span>':''} ${s.gnis===false&&s.lat!=null?'<span class="tag" title="Not yet checked against USGS GNIS">unverified in GNIS</span>':''}${s.origin==='ai'?'<span class="tag" style="color:var(--ai)">AI</span>':''}</div><div class="r">${esc(s.rationale||'')}${s.rarity?` <b style="color:var(--gold)">Rarity: ${esc(s.rarity)}</b>`:''}</div><div class="m">${s.lat!=null?`<span class="mono">${(+s.lat).toFixed(4)}, ${(+s.lon).toFixed(4)}</span>`:''}${s.elev?`<span>${s.elev.toLocaleString()} ft</span>`:''}${s.state?`<span>${s.state}</span>`:''}${s.owner?`<span>${esc(s.owner)}</span>`:''}${s.car?`<span>car: ${esc(s.car)}</span>`:''}${dist.map(d=>`<span>${d}</span>`).join('')}${s.support?.length?`<span class="sup">${s.support.length} supporting</span>`:''}${s.contradict?.length?`<span class="con">${s.contradict.length} against</span>`:''}${(s.rules||[]).map(r=>`<span class="flag" title="${esc(r.why)}">${r.kind==='hard'?'⛔':'⚠'} ${esc(r.text)}</span>`).join('')}${s.eliminated?'<span class="flag">⛔ eliminated state</span>':''}${s.source?`<span title="${esc(s.source)}">${esc(String(s.source).slice(0,60))}</span>`:''}${s.count!=null?`<button class="btn sm" onclick='expandClass(${JSON.stringify(s.members||[])})'>list ${s.count}</button>`:''}</div></span><span class="acts"><span class="hint">score ${s.score}</span><select id="conf_${esc(s.id)}" title="How sure are you?"><option value="1">sure 1</option><option value="2" ${s.conf===2?'selected':''}>sure 2</option><option value="3" ${s.conf===3?'selected':''}>sure 3</option></select><button class="btn sm gold" onclick='commit(${JSON.stringify(s).replace(/'/g,'&#39;')})'>Commit</button>${s.lat!=null?`<button class="btn sm" onclick="showOnMap(${s.lat},${s.lon},'${esc(s.text)}')">map</button>`:''}</span></div>`}
function expandClass(members){modal(`<h3 style="margin-top:0">Members</h3>${members.map(m=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="grow">${esc(m.name)}</span><span class="mono">${m.lat}, ${m.lon}</span><button class="btn sm" onclick="modal('');commit({id:'${m.id}',text:'${esc(m.name)}',category:'literal',lat:${m.lat},lon:${m.lon},tier:'unverified',rationale:'chosen from the feature-class list'})">Commit</button></div>`).join('')}<p class="hint">Run Data → fetch-data for the complete GNIS list of this class.</p>`)}
async function setRadius(v){await api('solve/'+S.sid+'/radius',{ref:S.ref,radius:+v});selectLine(S.ref)}
async function updCommit(patch){S.view=await api('solve/'+S.sid+'/update',{ref:S.ref,...patch});renderPoem();renderHeader()}
async function commit(s){const sel=document.getElementById('conf_'+s.id);const conf=sel?+sel.value:(s.conf||1);const cand={...s};delete cand.support;delete cand.contradict;delete cand.members;const r=await api('solve/'+S.sid+'/commit',{ref:S.ref,candidate:cand,conf});S.view=r.view;S.reaction=r.reaction;S.ov=await api('state');renderAll();showReaction(r.reaction)}
function showReaction(r){const el=document.createElement('div');el.className='panel react';el.innerHTML=`<div class="ph"><h3>What just changed</h3><span class="grow"></span><button class="btn sm ai" id="explainBtn" ${S.ov.ai.ok?'':'disabled'}>Explain (AI)</button><button class="btn sm" onclick="this.closest('.panel').remove()">✕</button></div><div class="pb"><p style="margin:0 0 6px">${esc(r.summary)}</p>${r.changes.map(c=>`<div class="hint">${c.direction==='down'?'▼':'▲'} ${esc(c.text)}</div>`).join('')}${r.new_conflicts.map(c=>`<div style="color:var(--warn)">⚠ ${esc(c.text)}</div>`).join('')}<div id="explainOut"></div></div>`;$('#view').prepend(el);el.querySelector('#explainBtn').onclick=async()=>{el.querySelector('#explainOut').innerHTML='<div class="hint">Thinking…</div>';const a=await api('ai/react',{solve_id:S.sid,reaction:r});el.querySelector('#explainOut').innerHTML=`<div class="ai-out" style="margin-top:8px">${esc(a.text||a.error||a.unavailable)}</div>`}}
async function moreReadings(){const instr=$('#aiInstr').value,n=$('#aiN').value;$('#view').insertAdjacentHTML('afterbegin','<div class="hint" id="genwait">Generating readings with the current solve state as context…</div>');try{S.sugg=await api('solve/'+S.sid+'/suggest?ref='+S.ref+'&ai=1&n='+n+'&instruction='+encodeURIComponent(instr))}finally{$('#genwait')?.remove()}viewLine();toast('AI readings are tagged AI and enter as unverified.')}

// ---------------- map
function viewMap(){const v=$('#view');if(!S.view){v.innerHTML='<div class="gap">Create a solve.</div>';return}const c=S.view.constraints;v.innerHTML=`<div class="panel"><div class="ph"><h3>Route</h3><span class="hint">${c.legs.length} legs · ${c.distance} mi</span><span class="grow"></span><label class="hint"><input type="checkbox" id="landTog" onchange="drawMap()"> land shading (PAD-US, needs fetched points)</label></div><div class="pb"><div id="map"></div>${window.L?'':'<div class="gap" style="margin-top:8px">Leaflet did not load (offline?). Showing a plain plot; pins and legs still work.</div>'}</div></div><div class="grid2"><div class="panel"><div class="ph"><h3>Legs</h3></div><table><tr><th>from</th><th>to</th><th>mi</th><th>bearing</th></tr>${c.legs.map(l=>`<tr><td>${l.from}</td><td>${l.to}</td><td>${l.mi}</td><td>${l.bearing}°</td></tr>`).join('')||'<tr><td class="hint" colspan=4>Pin two lines to see legs.</td></tr>'}</table></div><div class="panel"><div class="ph"><h3>Elevation profile</h3></div><div class="pb" id="elevProf"></div></div></div>`;drawMap()}
function pins(){const L=S.view.solve.state.lines;return S.ov.poem.lines.filter(l=>L[l.ref]&&L[l.ref].lat!=null).map(l=>({ref:l.ref,...L[l.ref]}))}
async function drawMap(){const P=pins();const el=$('#map');if(!el)return;if(window.L){if(S.map){S.map.remove();S.map=null}S.map=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap'}).addTo(S.map);L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,opacity:.55,attribution:'USGS Topo'}).addTo(S.map);const pts=P.map(p=>[p.lat,p.lon]);if(pts.length){L.polyline(pts,{color:'#e2b24d',weight:3,dashArray:'6 4'}).addTo(S.map);P.forEach((p,i)=>{L.circleMarker([p.lat,p.lon],{radius:7,color:'#111',fillColor:p.category==='literal'?'#4cc48d':'#6fb3d8',fillOpacity:.9}).addTo(S.map).bindPopup(`<b>${p.ref}</b> ${esc(p.text)}<br>${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}${p.elev?'<br>'+p.elev+' ft':''}`);L.circle([p.lat,p.lon],{radius:1609,color:'#4cc48d',weight:1,fill:false,dashArray:'3 3'}).addTo(S.map)});S.map.fitBounds(pts,{padding:[40,40],maxZoom:12})}else S.map.setView([44,-110],5);if($('#landTog')?.checked){for(const p of P){try{const r=await api(`point?lat=${p.lat}&lon=${p.lon}`);const own=r.land?.owner||'unknown';L.circle([p.lat,p.lon],{radius:2500,color:/private|not in PAD/i.test(own)?'#f06b6b':'#4cc48d',fillOpacity:.15,weight:1}).addTo(S.map).bindTooltip(own)}catch(e){}}}S.map.on('click',e=>{const t=`${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;navigator.clipboard?.writeText(t);toast('Copied '+t)})}else{el.innerHTML=plainPlot(P)}const ep=$('#elevProf');if(ep){const withE=P.filter(p=>p.elev);ep.innerHTML=withE.length>1?`<svg viewBox="0 0 400 120" style="width:100%"><polyline fill="none" stroke="#e2b24d" stroke-width="2" points="${withE.map((p,i)=>`${i/(withE.length-1)*380+10},${110-(p.elev-Math.min(...withE.map(x=>x.elev)))/Math.max(1,(Math.max(...withE.map(x=>x.elev))-Math.min(...withE.map(x=>x.elev))))*100}`).join(' ')}"/>${withE.map((p,i)=>`<text x="${i/(withE.length-1)*380+10}" y="118" font-size="9" fill="#a6b0bd" text-anchor="middle">${p.ref} ${p.elev}</text>`).join('')}</svg>`:'<span class="hint">Elevation appears when two or more pinned lines carry an elevation (Layers → point lookup fills it from USGS).</span>'}}
function plainPlot(P){if(!P.length)return'<div class="pb hint">No pinned points yet.</div>';const la=P.map(p=>p.lat),lo=P.map(p=>p.lon);const pad=.2;const b=[Math.min(...la)-pad,Math.min(...lo)-pad,Math.max(...la)+pad,Math.max(...lo)+pad];const X=lon=>((lon-b[1])/(b[3]-b[1]||1))*760+20,Y=lat=>500-((lat-b[0])/(b[2]-b[0]||1))*460;return `<svg viewBox="0 0 800 520" style="width:100%;background:#1d2430"><polyline fill="none" stroke="#e2b24d" stroke-width="2" points="${P.map(p=>X(p.lon)+','+Y(p.lat)).join(' ')}"/>${P.map(p=>`<circle cx="${X(p.lon)}" cy="${Y(p.lat)}" r="6" fill="#4cc48d"/><text x="${X(p.lon)+9}" y="${Y(p.lat)+4}" fill="#e8ecf2" font-size="12">${p.ref} ${esc(p.text)}</text>`).join('')}</svg>`}
function showOnMap(lat,lon,name){S.tab='map';renderTab();setTimeout(()=>{if(S.map&&window.L){S.map.setView([lat,lon],12);L.marker([lat,lon]).addTo(S.map).bindPopup(esc(name)).openPopup()}},300)}

// ---------------- bearing workspace
function viewBearing(){const v=$('#view');if(!S.view){v.innerHTML='<div class="gap">Create a solve.</div>';return}const P=pins();v.innerHTML=`<div class="panel"><div class="ph"><h3>Bearing & distance</h3><span class="hint">project from any pinned point; back bearings included; snaps to named features</span></div><div class="pb"><div class="row"><select id="bFrom" style="width:auto"><option value="">from…</option>${P.map(p=>`<option value="${p.lat},${p.lon}">${p.ref} ${esc(p.text)}</option>`).join('')}</select><input type="text" id="bLL" placeholder="or lat, lon" style="width:180px"><input type="number" id="bBrg" placeholder="bearing °" style="width:110px" value="${S.view.constraints.bearing??20}"><input type="number" id="bMi" placeholder="miles" style="width:100px" value="1"><button class="btn gold" onclick="project()">Project</button></div><div id="bOut" style="margin-top:10px"></div></div></div>`}
async function project(){const from=parseLL($('#bLL').value)||($('#bFrom').value?$('#bFrom').value.split(',').map(Number):null);if(!from)return toast('Pick a start point');const r=await api('project',{lat:from[0],lon:from[1],bearing:+$('#bBrg').value,mi:+$('#bMi').value});const block=(title,pt,near)=>`<div class="panel"><div class="ph"><h3>${title}</h3><span class="mono">${pt[0]}, ${pt[1]}</span><span class="grow"></span><button class="btn sm" onclick="showOnMap(${pt[0]},${pt[1]},'${title}')">map</button></div><table><tr><th>nearest named feature</th><th>type</th><th>mi</th><th></th></tr>${near.inventory.slice(0,5).map(f=>`<tr><td>${esc(f.name)}</td><td>${f.ftype}</td><td>${f.dist_mi}</td><td><select id="save_${f.id}" style="width:auto;padding:1px 3px">${S.ov.poem.lines.map(l=>`<option ${l.ref===S.ref?'selected':''}>${l.ref}</option>`).join('')}</select> <button class="btn sm" onclick="saveCand('${f.id}',${JSON.stringify({text:f.name,lat:f.lat,lon:f.lon,elev:f.elev,ftype:f.ftype,owner:f.owner,tier:f.tier,category:'literal',rationale:'landed by projecting '+r.bearing+'° for '+r.mi+' mi'}).replace(/"/g,'&quot;')})">save as candidate</button></td></tr>`).join('')}${near.gnis.map(g=>`<tr><td>${esc(g.name)} <span class="tier reported">GNIS</span></td><td>${g.fclass}</td><td>${g.dist_mi}</td><td><select id="save_g${g.feature_id}" style="width:auto;padding:1px 3px">${S.ov.poem.lines.map(l=>`<option ${l.ref===S.ref?'selected':''}>${l.ref}</option>`).join('')}</select> <button class="btn sm" onclick="saveCand('g${g.feature_id}',${JSON.stringify({text:g.name,lat:g.lat,lon:g.lon,elev:g.elev,ftype:g.fclass,tier:'reported',gnis:true,category:'literal',rationale:'GNIS feature landed by projecting '+r.bearing+'°'}).replace(/"/g,'&quot;')})">save</button></td></tr>`).join('')}${!near.gnis.length?'<tr><td colspan=4 class="hint">No GNIS cache for this area — run Data → fetch-data to snap to every named feature.</td></tr>':''}</table></div>`;$('#bOut').innerHTML=`<div class="grid2">${block(`${r.bearing}° · ${r.mi} mi`,r.dest,r.near)}${block(`back bearing ${r.back_bearing}° · ${r.mi} mi`,r.back_dest,r.near_back)}</div>`}
function saveCand(id,cand){const sel=document.getElementById('save_'+id);const ref=sel?sel.value:S.ref;if(!ref)return toast('Pick a line');(S.saved[ref]=S.saved[ref]||[]).push({id:'saved_'+id,score:0,...cand});toast(`Saved as a candidate for ${ref}. Open that line to commit it.`)}

// ---------------- cipher scratchpad
async function viewCipher(){const v=$('#view');const items=await api('scratch');const poemWords=S.ov.poem.lines.flatMap(l=>l.text.split(/\s+/));v.innerHTML=`<div class="grid2"><div class="panel"><div class="ph"><h3>Number & cipher scratchpad</h3></div><div class="pb"><textarea id="scText" placeholder="Page numbers, the missing page, letter sums, coordinate fragments, dates…"></textarea><div class="row" style="margin-top:6px"><input type="text" id="scTags" placeholder="tags (comma separated), e.g. S3L3, 42, page-90"><button class="btn gold" onclick="saveScratch()">Save</button></div><div style="margin-top:10px"><div class="k">Quick tools</div><div class="row"><input type="text" id="qWord" placeholder="word or phrase" style="width:220px"><button class="btn sm" onclick="quick()">Letter sum / positions</button><input type="number" id="qN" placeholder="word #" style="width:90px"><button class="btn sm" onclick="wordN()">Word N of poem</button></div><div id="qOut" class="mono" style="margin-top:6px"></div></div></div></div><div class="panel"><div class="ph"><h3>Saved results</h3><span class="hint">${items.length}</span></div>${items.map(i=>`<div class="sug"><span><div>${esc(i.text)}</div><div class="m">${(i.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')} ${esc(i.result||'')}</div></span><span class="acts"><select id="pull_${i.id}" style="width:auto">${S.ov.poem.lines.map(l=>`<option ${l.ref===S.ref?'selected':''}>${l.ref}</option>`).join('')}</select><button class="btn sm" onclick="pullScratch('${i.id}',${JSON.stringify(i.text).replace(/"/g,'&quot;')})">pull into line</button><button class="btn sm bad" onclick="api('scratch',{delete:'${i.id}'}).then(viewCipher)">✕</button></span></div>`).join('')||'<div class="pb hint">Nothing saved yet.</div>'}</div></div><div class="panel"><div class="ph"><h3>Poem numbers</h3></div><div class="pb mono">${poemWords.length} words · ${S.ov.poem.lines.length} lines · word 42 = “${esc(poemWords[41]||'')}” · letters ${S.ov.poem.lines.map(l=>l.text.replace(/[^A-Za-z]/g,'').length).join(' / ')}</div></div>`}
async function saveScratch(){await api('scratch',{text:$('#scText').value,tags:$('#scTags').value.split(',').map(s=>s.trim()).filter(Boolean),result:$('#qOut').textContent});viewCipher()}
function quick(){const w=$('#qWord').value;const letters=w.replace(/[^A-Za-z]/g,'').toLowerCase();const sum=[...letters].reduce((a,c)=>a+c.charCodeAt(0)-96,0);$('#qOut').textContent=`${letters.length} letters · A1Z26 sum ${sum} · positions ${[...letters].map(c=>c.charCodeAt(0)-96).join(' ')} · reversed ${[...w].reverse().join('')}`}
function wordN(){const n=+$('#qN').value;const ws=S.ov.poem.lines.flatMap(l=>l.text.split(/\s+/).map(w=>({w,ref:l.ref})));const x=ws[n-1];$('#qOut').textContent=x?`word ${n} = “${x.w}” in ${x.ref}`:'out of range'}
function pullScratch(id,text){const sel=document.getElementById('pull_'+id);const ref=sel.value;(S.saved[ref]=S.saved[ref]||[]).push({id:'scratch_'+id,category:'numeric',text:text.slice(0,120),rationale:'from the cipher scratchpad',tier:'unverified',conf:1,score:0});toast('Added to '+ref+' as a numeric candidate.')}

).join('')}</select><button class="btn sm" onclick="acceptItem('${i.id}','${i.tier}')">accept</button><button class="btn sm" onclick="api('monitor/dismiss',{id:'${i.id}'}).then(()=>viewArchive())">dismiss</button></span></div>`).join('')}</div><div class="panel"><div class="ph"><h3>Rumours & field reports</h3></div><div class="pb"><input type="search" placeholder="search rumours" onchange="rumorSearch(this.value)"><div id="rumOut" style="margin-top:8px"></div></div></div></div></div>`}

// ---------------- layers (dossiers, landmark inventory, name patterns)
async function viewLayers(){const v=$('#view');const c=S.view?.constraints;const regs=S.ov.regions;v.innerHTML=`<div class="grid2"><div class="panel"><div class="ph"><h3>Region dossier</h3><select id="dosSel" style="width:auto" onchange="loadDossier(this.value)"><option value="">${c?.point?'for the active point':'choose…'}</option>${regs.map(r=>`<option value="${r.id}">${esc(r.name)} · ${r.status}</option>`).join('')}</select></div><div class="pb" id="dosOut"><span class="hint">Loading…</span></div></div><div><div class="panel"><div class="ph"><h3>Landmark inventory</h3></div><div class="pb"><div class="row"><select id="invType" style="width:auto"><option value="">any type</option>${['arch','waterfall','hotspring','spring','rock','cirque','pair','pass','gate','bend','confluence','face','pool','hole','peak','lake','river','site'].map(t=>`<option>${t}</option>`).join('')}</select><select id="invIdea" style="width:auto"><option value="">any name idea</option>${['bear','north star / polaris','wisdom','hole','bride / wedding','gold','needle','crown','three','twenty','silence','shadow','light','two / pair','time','face'].map(t=>`<option>${t}</option>`).join('')}</select><select id="invState" style="width:auto"><option value="">any state</option>${Object.keys(S.ov.states).map(s=>`<option>${s}</option>`).join('')}</select><input type="number" id="invR" value="${c?.point?60:400}" style="width:80px" title="miles from active point"><button class="btn gold" onclick="inventory()">Query</button></div><div class="hint" style="margin-top:4px">Built-in inventory first; GNIS rows appear once fetched (Data). ${Object.keys(S.ov.gnis).length?'GNIS loaded: '+Object.entries(S.ov.gnis).map(([k,n])=>k+' '+n.toLocaleString()).join(', '):'No GNIS downloaded yet — feature-class queries are limited to the built-in list.'}</div><div id="invOut" style="margin-top:8px"></div></div></div><div class="panel"><div class="ph"><h3>Point lookup</h3><span class="hint">elevation · land owner · roads · historical topo</span></div><div class="pb"><div class="row"><input type="text" id="ptLL" placeholder="lat, lon" value="${c?.point?c.point[0]+', '+c.point[1]:''}"><button class="btn" onclick="pointLookup()">Look up</button></div><div id="ptOut" style="margin-top:8px"></div></div></div></div></div>`;if(c?.point)loadDossier('',c.point);else $('#dosOut').innerHTML='<span class="hint">Pin a point or choose a region.</span>'}
async function loadDossier(id,pt){const r=await api(id?'dossier?id='+id:`dossier?lat=${pt[0]}&lon=${pt[1]}`);const o=$('#dosOut');if(r.gap){o.innerHTML=`<div class="gap">${esc(r.text)}</div>`;return}const d=r.dossier;o.innerHTML=`<h3 style="margin:0 0 6px">${esc(r.name)} <span class="tag">${r.status}</span> <span class="tag">${r.states}</span></h3>${[['Terrain',d.terrain],['History',d.history],['Ownership & access',d.ownership],['Why the community favours or dismisses it',d.community],['Elimination',d.elimination],['Known searchers',d.searchers]].map(([k,t])=>`<div style="margin-bottom:6px"><span class="k">${k}</span><div style="font-size:13px">${esc(t)}</div></div>`).join('')}<div class="k">Indigenous & historical names</div><ul style="font-size:13px;margin:4px 0">${(d.indigenous||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="k">Trails & routes</div><ul style="font-size:13px;margin:4px 0">${(d.trails||[]).map(t=>`<li>${esc(t)}</li>`).join('')}${r.history.map(h=>`<li><b>${esc(h.name)}</b> — ${esc(h.text)} <span class="hint">(${esc(h.source)})</span></li>`).join('')}</ul><div class="k">Season & access</div><ul style="font-size:13px;margin:4px 0">${r.season.map(t=>`<li>${esc(t)}</li>`).join('')||'<li class="hint">no season notes</li>'}</ul><div class="k">Features inside (${r.features.length})</div><div class="chips" style="margin:4px 0">${r.features.map(f=>`<span class="chip" title="${esc(f.notes)}" onclick="showOnMap(${f.lat},${f.lon},'${esc(f.name)}')">${esc(f.name)}${f.gnis_verified===1?' ✓':f.gnis_verified===-1?' ✗':''}</span>`).join('')}</div><div class="k">Rumours touching this region (${r.rumors.length})</div>${r.rumors.slice(0,6).map(x=>`<div style="font-size:12.5px;margin:3px 0">${tierTag(x.tier)} ${esc(x.text.slice(0,200))}</div>`).join('')}<div class="hint" style="margin-top:8px">Dossier text is built-in general knowledge (Claude); ✓ = name verified in GNIS, ✗ = not found in GNIS — treat as a gap.</div>`}
async function inventory(){const c=S.view?.constraints;const q=new URLSearchParams();if($('#invType').value)q.set('ftype',$('#invType').value);if($('#invIdea').value)q.set('idea',$('#invIdea').value);if($('#invState').value)q.set('state',$('#invState').value);if(c?.point){q.set('lat',c.point[0]);q.set('lon',c.point[1]);q.set('radius',$('#invR').value)}const r=await api('features?'+q);$('#invOut').innerHTML=`<table><tr><th>name</th><th>type</th><th>state</th><th>owner</th><th>car</th><th>mi</th><th></th></tr>${r.features.slice(0,60).map(f=>`<tr><td>${esc(f.name)} ${f.gnis_verified===1?'<span class="tier reported">GNIS ✓</span>':f.gnis_verified===-1?'<span class="tier unverified">not in GNIS</span>':tierTag(f.tier)}${f.aliases?.length?`<div class="hint">${esc(f.aliases.join(' · '))}</div>`:''}</td><td>${f.ftype}</td><td>${f.state}</td><td>${esc(f.owner||'')}</td><td>${esc(f.car||'')}</td><td>${f.dist_mi??''}</td><td><button class="btn sm" onclick="showOnMap(${f.lat},${f.lon},'${esc(f.name)}')">map</button></td></tr>`).join('')}${r.gnis.slice(0,60).map(g=>`<tr><td>${esc(g.name)} <span class="tier reported">GNIS</span></td><td>${g.fclass}</td><td>${g.state}</td><td colspan=2 class="hint">${esc(g.county)} · ${esc(g.map_name)}</td><td>${g.dist_mi??''}</td><td><button class="btn sm" onclick="showOnMap(${g.lat},${g.lon},'${esc(g.name)}')">map</button></td></tr>`).join('')}</table>${!r.features.length&&!r.gnis.length?'<div class="gap">Nothing matches — a real gap if GNIS is loaded, a coverage gap if it is not.</div>':''}`}
async function pointLookup(){const ll=parseLL($('#ptLL').value);if(!ll)return;$('#ptOut').innerHTML='<span class="hint">Looking up (uses internet unless cached)…</span>';const r=await api(`point?lat=${ll[0]}&lon=${ll[1]}`);$('#ptOut').innerHTML=`<div class="grid2"><div class="stat"><span class="k">Elevation</span>${r.elevation.feet?r.elevation.feet.toLocaleString()+' ft':'<span class="gap">unavailable: '+esc(r.elevation.error||'')+'</span>'}</div><div class="stat"><span class="k">Land</span>${esc(r.land.owner||'')} ${r.land.public_access?'· access: '+esc(r.land.public_access):''} ${r.land.error?'<div class="gap">'+esc(r.land.error)+'</div>':''}</div><div class="stat"><span class="k">Roads (OSM)</span>${esc(r.osm.car)} ${r.osm.error?'<div class="gap">'+esc(r.osm.error)+'</div>':''}<div class="hint">${(r.osm.roads||[]).slice(0,6).map(x=>esc((x.name||x.highway)+(x.surface?' · '+x.surface:'')+(x.tracktype?' · '+x.tracktype:''))).join(' / ')}</div></div><div class="stat"><span class="k">Historical topo</span><a href="${r.topoview}" target="_blank">open TopoView here</a><div class="hint">MVUM: ${Object.entries(r.mvum).map(([k,u])=>`<a href="${u}" target="_blank">${esc(k)}</a>`).join(' · ')}</div></div></div><div style="margin-top:8px"><span class="k">GNIS within 2 mi</span> ${r.gnis_nearby.length?r.gnis_nearby.map(g=>`<span class="chip">${esc(g.name)} (${g.fclass}, ${g.dist_mi})</span>`).join(' '):'<span class="hint">no GNIS cache for this state yet</span>'}</div>`}

async function viewRules(){const rs=await api('rules');const row=r=>`<tr data-id="${r.id}"><td><input type="checkbox" ${r.enabled?'checked':''} class="rEn"></td><td><input type="text" value="${esc(r.text)}" class="rTx"></td><td><select class="rKind" style="width:auto"><option ${r.kind==='hard'?'selected':''}>hard</option><option ${r.kind==='soft'?'selected':''}>soft</option></select></td><td><input type="text" value="${esc(r.code||'')}" class="rCode mono" title="how the engine checks it"></td><td><input type="text" value="${esc(r.source||'')}" class="rSrc"></td><td><button class="btn sm bad" onclick="this.closest('tr').remove()">✕</button></td></tr>`;$('#view').innerHTML=`<div class="panel"><div class="ph"><h3>Rules engine</h3><span class="hint">hard = red flag on candidates; soft = warning. Edit freely — more statements arrive every month.</span><span class="grow"></span><button class="btn sm" onclick="addRuleRow()">Add</button><button class="btn gold sm" onclick="saveRules()">Save & re-score</button></div><table id="rulesT"><tr><th>on</th><th>statement</th><th>kind</th><th>check code</th><th>source</th><th></th></tr>${rs.map(row).join('')}</table><div class="pb hint">Check codes: <span class="mono">flag:private,fee</span> (candidate flags) · <span class="mono">check:states:CO,OR</span> · <span class="mono">check:walk:S2L2:S2L3:3</span> (miles) · <span class="mono">check:fenn:75</span> · <span class="mono">check:map</span> · <span class="mono">check:none</span> (display only).</div></div>`}
function addRuleRow(){$('#rulesT').insertAdjacentHTML('beforeend',`<tr data-id=""><td><input type="checkbox" checked class="rEn"></td><td><input type="text" class="rTx" placeholder="What Posey said"></td><td><select class="rKind" style="width:auto"><option>soft</option><option>hard</option></select></td><td><input type="text" class="rCode mono" value="check:none"></td><td><input type="text" class="rSrc" placeholder="date · venue"></td><td></td></tr>`)}
async function saveRules(){const before=await api('rules');const rows=[...document.querySelectorAll('#rulesT tr[data-id]')];const rules=rows.map(tr=>({id:tr.dataset.id||undefined,enabled:tr.querySelector('.rEn').checked,text:tr.querySelector('.rTx').value,kind:tr.querySelector('.rKind').value,code:tr.querySelector('.rCode').value,source:tr.querySelector('.rSrc').value})).filter(r=>r.text);const keep=new Set(rows.map(t=>t.dataset.id).filter(Boolean));await api('rules',{rules,delete:before.filter(r=>!keep.has(r.id)).map(r=>r.id)});toast('Rules saved; all solves re-scored.');S.ov=await api('state');if(S.sid)S.view=await api('solve/'+S.sid);renderAll()}

function viewSolves(){const mine=S.ov.solves.filter(s=>s.kind!=='reference'),refs=S.ov.solves.filter(s=>s.kind==='reference');const row=s=>`<tr><td>${s.kind==='reference'?'◇ ':''}${esc(s.name)}${s.parent_id?` <span class="hint">fork${s.fork_ref?' at '+s.fork_ref:''}</span>`:''}</td><td>${s.lines}</td><td><b>${s.score}</b></td><td style="color:${s.seed_share>=40?'var(--bad)':'var(--ink2)'}">${s.seed_share}%</td><td>${esc(s.seed||'—')}</td><td>${esc(s.source||'')}</td><td class="row"><button class="btn sm" onclick="openSolve('${s.id}')">open</button><button class="btn sm" onclick="compare('${s.id}')">compare</button>${s.kind!=='reference'?`<button class="btn sm" onclick="renameSolve('${s.id}')">rename</button><button class="btn sm bad" onclick="delSolve('${s.id}')">delete</button>`:`<button class="btn sm ai" onclick="disagree('${s.id}')" ${S.ov.ai.ok?'':'disabled'}>explain disagreement</button>`}</td></tr>`;$('#view').innerHTML=`<div class="panel"><div class="ph"><h3>Your solves</h3><span class="grow"></span><button class="btn gold sm" onclick="newSolveDialog()">New</button></div><table><tr><th>name</th><th>lines</th><th>score</th><th>seed share</th><th>seed</th><th></th><th></th></tr>${mine.map(row).join('')||'<tr><td class="hint" colspan=7>None yet.</td></tr>'}</table></div><div class="panel"><div class="ph"><h3>Community theory library</h3><span class="hint">read-only reference solves — compare yours against them</span></div><table><tr><th>name</th><th>lines</th><th>score</th><th>seed share</th><th>seed</th><th>source</th><th></th></tr>${refs.map(row).join('')}</table></div><div class="panel"><div class="ph"><h3>Blind spots</h3><span class="hint">which interpretation types you keep choosing</span></div><div class="pb"><div class="chips">${S.ov.blind_spots.counts.map(c=>`<span class="chip ${c.share<8?'':'on'}">${c.label} ${c.count} (${c.share}%)</span>`).join('')}</div>${S.ov.blind_spots.underused.length?`<div class="gap" style="margin-top:8px">Under-used: ${S.ov.blind_spots.underused.map(u=>u.label).join(', ')}. Filter the next line panel to those and force yourself through them.</div>`:''}</div></div><div id="cmpOut"></div>`}
async function openSolve(id){S.sid=id;S.view=await api('solve/'+id);S.sugg=null;S.ref=null;renderAll()}
async function renameSolve(id){const n=prompt('New name');if(!n)return;await api('solve/'+id+'/rename',{name:n});S.ov=await api('state');renderAll();viewSolves()}
async function delSolve(id){if(!confirm('Delete this solve?'))return;await api('solve/'+id+'/delete',{});S.ov=await api('state');if(S.sid===id){S.sid=null;S.view=null}boot()}
async function compare(other){if(!S.sid)return toast('Open one of your solves first');const r=await api('solve/'+S.sid+'/compare/'+other);$('#cmpOut').innerHTML=`<div class="panel"><div class="ph"><h3>Compare</h3><span class="hint">${esc(r.a.name)} (${r.a.score.total}) vs ${esc(r.b.name)} (${r.b.score.total}) · first fork at <b>${r.fork_at||'—'}</b></span></div><table><tr><th>line</th><th>${esc(r.a.name)}</th><th>${esc(r.b.name)}</th></tr>${r.lines.map(l=>`<tr><td>${l.ref} <span class="hint">${esc(l.text)}</span></td><td class="${l.differs?'diff':''}">${l.a?catTag(l.a.category)+' '+esc(l.a.text)+' <span class="hint">sure '+l.a.conf+'</span>':'—'}</td><td class="${l.differs?'diff':''}">${l.b?catTag(l.b.category)+' '+esc(l.b.text)+' <span class="hint">sure '+l.b.conf+'</span>':'—'}</td></tr>`).join('')}</table></div>`;$('#cmpOut').scrollIntoView()}
async function disagree(other){if(!S.sid)return;modal('<div class="hint">Finding the fork…</div>');const r=await api('ai/disagree',{solve_id:S.sid,other_id:other});modal(`<h3 style="margin-top:0">Where you diverge</h3>${r.text?`<div class="ai-out">${esc(r.text)}</div>`:`<p class="gap">${esc(r.error||r.unavailable)}</p>`}`)}

// ---------------- auto search
function viewAuto(){$('#view').innerHTML=`<div class="panel"><div class="ph"><h3>Automatic solve search</h3><span class="hint">beam search over literal readings of stanzas 2–4, scored on poem fit, compactness and the rules</span><span class="grow"></span><label class="hint"><input type="checkbox" id="autoAI" ${S.ov.ai.ok?'':'disabled'}> AI re-rank</label><button class="btn gold" onclick="runAuto()">Run</button></div><div class="pb" id="autoOut"><span class="hint">Uses the current solve's seed and committed lines as fixed points. With no GNIS downloaded it can only combine the built-in inventory — run fetch-data for the full search space.</span></div></div>`}
async function runAuto(){if(!S.sid)return toast('Open a solve');$('#autoOut').innerHTML='<span class="hint">Searching…</span>';const r=await api('solve/'+S.sid+'/auto',{ai:$('#autoAI').checked});const ranks={};(r.ai?.ranked||[]).forEach((x,i)=>ranks[x.index]={pos:i+1,...x});$('#autoOut').innerHTML=r.results.map((x,i)=>`<div class="panel"><div class="ph"><h3>#${i+1}${ranks[i]?` · AI rank ${ranks[i].pos}`:''}</h3><span class="hint">${esc(x.region)} · ${x.placed} lines · score ${x.score}</span><span class="grow"></span><button class="btn sm gold" onclick='adopt(${JSON.stringify(x.lines).replace(/'/g,"&#39;")},"${esc(x.region)}")'>Open as a solve</button></div><div class="pb" style="font-size:12.5px">${Object.entries(x.lines).map(([ref,c])=>`<div><b>${ref}</b> ${esc(c.text)} <span class="hint">sure ${c.conf}</span></div>`).join('')}${ranks[i]?`<div class="ai-out" style="margin-top:6px">${esc(ranks[i].verdict)} · strongest ${esc(ranks[i].strongest_line)} · weakest ${esc(ranks[i].weakest_line)}</div>`:''}</div></div>`).join('')||'<div class="gap">No complete paths found with the current inventory.</div>'}
async function adopt(lines,region){const v=await api('solve/new',{name:'Auto: '+region+' '+new Date().toLocaleTimeString(),adopt:lines});S.ov=await api('state');S.sid=v.solve.id;S.view=await api('solve/'+S.sid);S.tab='line';S.ref=null;renderAll()}

// ---------------- reverse
function viewReverse(){$('#view').innerHTML=`<div class="panel"><div class="ph"><h3>Reverse mode</h3><span class="hint">name an endpoint; the tool works the poem backward and flags every stretch</span></div><div class="pb"><div class="row"><input type="text" id="rvName" placeholder="Candidate endpoint name" style="width:260px"><input type="text" id="rvLL" placeholder="lat, lon" style="width:180px"><label class="hint"><input type="checkbox" id="rvAI" ${S.ov.ai.ok?'':'disabled'}> AI narrative</label><button class="btn gold" onclick="runReverse()">Work backward</button></div><div id="rvOut" style="margin-top:10px"></div></div></div>`}
async function runReverse(){const ll=parseLL($('#rvLL').value);if(!ll)return toast('Enter lat, lon');$('#rvOut').innerHTML='<span class="hint">Working backward…</span>';const r=await api('solve/'+S.sid+'/reverse',{lat:ll[0],lon:ll[1],name:$('#rvName').value,ai:$('#rvAI').checked});$('#rvOut').innerHTML=`<p><b>${esc(r.verdict)}</b></p><table><tr><th>line</th><th>would have to mean</th><th>mi</th><th>verdict</th><th>alternatives</th></tr>${r.lines.map(l=>`<tr><td>${l.ref}<div class="hint">${esc(l.text)}</div></td><td>${esc(l.would_have_to_mean)}<div class="hint">${esc(l.why)}</div></td><td>${l.distance_mi??''}</td><td style="color:${l.stretch?'var(--bad)':'var(--ok)'}">${l.stretch?'stretch':'fits'}</td><td class="hint">${esc(l.alternatives.join(' · '))}</td></tr>`).join('')}</table>${r.ai?`<div class="ai-out" style="margin-top:10px">${esc(r.ai.text||r.ai.error||r.ai.unavailable)}</div>`:''}`}

// ---------------- feasibility
async function viewFeas(){$('#view').innerHTML='<div class="hint">Checking every region against every constraint…</div>';const rows=await api('feasibility');$('#view').innerHTML=`<div class="panel"><div class="ph"><h3>Whole-poem feasibility</h3><span class="hint">which regions can support a complete valid solve at all</span><span class="grow"></span><button class="btn sm ai" onclick="feasAI()" ${S.ov.ai.ok?'':'disabled'}>Narrate (AI)</button></div><table><tr><th>region</th><th>features</th><th>surge</th><th>hole</th><th>gates</th><th>granite</th><th>bear</th><th>bride</th><th>verdict</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.region)}</b></td><td>${r.usable}/${r.features}</td>${r.checks.map(c=>`<td title="${esc(c.have.join(', '))}" style="color:${c.ok?'var(--ok)':'var(--bad)'}">${c.ok?'✓':'✗'}</td>`).join('')}<td class="${r.thin?'hint':''}">${esc(r.verdict)}</td></tr>`).join('')}</table><div class="pb hint">Built-in inventory only. A ✗ in a thin region means "not catalogued", not "does not exist" — download GNIS to make this real.</div><div id="feasAI" class="pb"></div></div>`}
async function feasAI(){$('#feasAI').innerHTML='<span class="hint">Thinking…</span>';const r=await api('ai/feasibility',{});$('#feasAI').innerHTML=`<div class="ai-out">${esc(r.text||r.error||r.unavailable)}</div>`}

// ---------------- field mode
async function viewField(){const v=$('#view');if(!S.view){v.innerHTML='<div class="gap">Open a solve.</div>';return}const findings=await api('solve/'+S.sid+'/findings');v.innerHTML=`<div class="grid2"><div class="panel"><div class="ph"><h3>Field mode</h3><span class="grow"></span><button class="btn gold sm" onclick="locate()">Use my GPS</button><a class="btn sm" href="/api/solve/${S.sid}/field?raw=1" target="_blank">Printable checklist</a></div><div class="pb" id="gpsOut"><span class="hint">Press "Use my GPS" on your phone. You get distance and bearing to every pinned point, what you predicted there, and what confirms or kills the line you are standing on.</span></div></div><div class="panel"><div class="ph"><h3>Record what you found</h3></div><div class="pb"><div class="row"><select id="fdRef" style="width:auto">${S.ov.poem.lines.filter(l=>S.view.solve.state.lines[l.ref]).map(l=>`<option>${l.ref}</option>`).join('')}</select><select id="fdVerdict" style="width:auto"><option value="confirmed">confirmed</option><option value="killed">killed</option><option value="inconclusive">inconclusive</option></select></div><textarea id="fdText" placeholder="What is actually here" style="margin-top:6px"></textarea><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn gold" onclick="saveFinding()">Save → feeds the score</button></div></div>${findings.map(f=>`<div class="sug"><span><b>${f.ref}</b> <span class="tag" style="color:${f.verdict==='confirmed'?'var(--ok)':f.verdict==='killed'?'var(--bad)':'var(--warn)'}">${f.verdict}</span> ${esc(f.text)}<div class="m">${new Date(f.created*1000).toLocaleString()} ${f.lat?`<span class="mono">${(+f.lat).toFixed(4)}, ${(+f.lon).toFixed(4)}</span>`:''}</div></span></div>`).join('')}</div></div><div class="panel"><div class="ph"><h3>Stops in driving order</h3></div><table><tr><th>#</th><th>line</th><th>place</th><th>coords</th><th>drive</th><th>access</th></tr>${S.view.stops.map(s=>`<tr><td>${s.stop}</td><td>${s.ref}</td><td>${esc(s.name)}</td><td class="mono">${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</td><td>${s.drive_mi} mi · ${s.drive_min} min</td><td class="hint">${esc(s.access)} · car: ${esc(s.car)}</td></tr>`).join('')||'<tr><td class="hint" colspan=6>Pin points to build a route.</td></tr>'}</table></div>`}
function locate(){if(!navigator.geolocation)return toast('No GPS in this browser');navigator.geolocation.getCurrentPosition(p=>{S.field.pos=[p.coords.latitude,p.coords.longitude];const P=pins().map(x=>({...x,d:hav(S.field.pos,[x.lat,x.lon]),b:brg(S.field.pos,[x.lat,x.lon])})).sort((a,b)=>a.d-b.d);const near=P[0];$('#gpsOut').innerHTML=`<div class="mono">you: ${S.field.pos[0].toFixed(5)}, ${S.field.pos[1].toFixed(5)} (±${Math.round(p.coords.accuracy)} m)</div>${near?`<div class="panel" style="margin:8px 0"><div class="pb"><div class="k">Nearest pin · ${near.ref}</div><div class="big">${near.d<1?Math.round(near.d*5280)+' ft':near.d.toFixed(1)+' mi'} <span style="font-size:14px;color:var(--ink2)">at ${Math.round(near.b)}°</span></div><div><b>${esc(near.text)}</b></div><div style="margin-top:6px"><span class="k">You predicted</span><div>${esc(near.rationale||'—')}</div></div><div><span class="k">Confirms</span><div>${esc(near.confirm||'The feature is here, natural, on public land, reachable without gear.')}</div></div><div><span class="k">Kills</span><div>${esc(near.kill||'Not there, private/fee, needs gear, or a man-made structure.')}</div></div></div></div>`:''}<table><tr><th>line</th><th>place</th><th>distance</th><th>bearing</th></tr>${P.map(x=>`<tr><td>${x.ref}</td><td>${esc(x.text)}</td><td>${x.d.toFixed(2)} mi</td><td>${Math.round(x.b)}°</td></tr>`).join('')}</table>`},e=>toast('GPS failed: '+e.message),{enableHighAccuracy:true,timeout:15000})}
function hav(a,b){const R=3958.8,r=x=>x*Math.PI/180;const h=Math.sin(r(b[0]-a[0])/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(r(b[1]-a[1])/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function brg(a,b){const r=x=>x*Math.PI/180;const y=Math.sin(r(b[1]-a[1]))*Math.cos(r(b[0])),x=Math.cos(r(a[0]))*Math.sin(r(b[0]))-Math.sin(r(a[0]))*Math.cos(r(b[0]))*Math.cos(r(b[1]-a[1]));return (Math.atan2(y,x)*180/Math.PI+360)%360}
async function saveFinding(){await api('solve/'+S.sid+'/finding',{ref:$('#fdRef').value,verdict:$('#fdVerdict').value,text:$('#fdText').value,lat:S.field.pos?.[0],lon:S.field.pos?.[1]});S.view=await api('solve/'+S.sid);S.ov=await api('state');renderAll();toast('Recorded; the line’s confidence and the score updated.')}

// ---------------- data
async function viewData(){const [mapping,cat,hist]=await Promise.all([api('mapping'),api('catalog'),api('history')]);const li=S.ov.last_import;$('#view').innerHTML=`<div class="grid2"><div><div class="panel"><div class="ph"><h3>Your research database</h3></div><div class="pb"><p class="hint">Export from Field HQ (Data → Export JSON), then load it here. Nothing is read until mapping.json says where each table goes.</p><input type="file" id="impFile" accept=".json"><div class="row" style="margin-top:6px"><button class="btn gold" onclick="doImport()">Import through mapping</button></div>${li?`<div class="hint" style="margin-top:6px">Last import ${new Date(li.ts*1000).toLocaleString()}: ${li.report.statements} statements, ${li.report.rumors} rumours, ${li.report.book} book items, ${li.report.features} sites, ${li.report.reference_solves} reference solves${li.report.unmapped_fields?.length?'; unmapped fields kept raw: '+li.report.unmapped_fields.join(', '):''}</div>`:'<div class="gap" style="margin-top:6px">Not imported yet.</div>'}</div></div><div class="panel"><div class="ph"><h3>mapping.json</h3><span class="grow"></span><button class="btn sm gold" onclick="saveMapping()">Save</button></div><div class="pb"><textarea id="mapTxt" class="mono" style="min-height:280px">${esc(JSON.stringify(mapping,null,2))}</textarea></div></div><div class="panel"><div class="ph"><h3>Public data</h3></div><div class="pb"><div class="row"><input type="text" id="fetchSt" value="MT WY ID UT" style="width:200px"><button class="btn" onclick="fetchData()">Download GNIS for these states</button></div><div class="hint" style="margin-top:6px">GNIS = every officially named place with type and coordinates; the tool then verifies its built-in features against it. Elevation (USGS), land owner (PAD-US) and roads (OSM) are fetched per point from Layers and cached. ${Object.keys(S.ov.gnis).length?'Loaded: '+Object.entries(S.ov.gnis).map(([k,n])=>k+' '+n.toLocaleString()).join(', '):'Nothing downloaded yet.'}</div><pre id="fetchLog" class="mono" style="max-height:160px;overflow:auto;background:var(--g0);padding:8px;border-radius:6px"></pre></div></div><div class="panel"><div class="ph"><h3>Backups</h3></div><div class="pb row"><a class="btn" href="/api/export" download="solvebuilder-export.json">Export everything</a><button class="btn" onclick="api('rescore',{}).then(r=>toast(r.length+' solves changed'))">Re-score all</button><button class="btn" onclick="pastePoem()">Load a different poem</button></div></div></div><div><div class="panel"><div class="ph"><h3>Database catalog</h3></div><div class="pb" style="white-space:pre-wrap;font-size:12.5px;max-height:420px;overflow:auto">${esc(cat.text||'DATABASE-CATALOG.md not found')}</div></div><div class="panel"><div class="ph"><h3>History</h3><span class="hint">how your solves have moved</span></div><table>${hist.slice(0,40).map(h=>`<tr><td class="hint">${new Date(h.ts*1000).toLocaleString()}</td><td>${esc(h.event)}</td><td>${h.before!=null?h.before+' → ':''}${h.after??''}</td><td class="hint">${esc(String(h.detail||'').slice(0,80))}</td></tr>`).join('')}</table></div></div></div>`}
async function doImport(){const f=$('#impFile').files[0];if(!f)return toast('Choose the export file');const data=JSON.parse(await f.text());const r=await api('import',{export:data});toast(`Imported: ${r.statements} statements, ${r.rumors} rumours, ${r.features} sites, ${r.reference_solves} reference solves.`);S.ov=await api('state');renderAll();viewData()}
async function saveMapping(){try{await api('mapping',JSON.parse($('#mapTxt').value));toast('Mapping saved. Re-import to apply.')}catch(e){toast('Invalid JSON')}}
async function fetchData(){const states=$('#fetchSt').value.split(/[\s,]+/).filter(Boolean);const r=await api('fetch',{states});const log=$('#fetchLog');const poll=async()=>{const j=await api('job/'+r.job);log.textContent=j.log.join('\n');if(!j.done)setTimeout(poll,1500);else{toast('Done');S.ov=await api('state')}};poll()}

boot();
</script>
</body>
</html>
