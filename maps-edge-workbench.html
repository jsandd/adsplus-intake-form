<title>Field HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Azeret+Mono:wght@400;500;600&display=swap">

<style>
/* ================= tokens: dark-first console ================= */
:root{
  --g0:#0D1016; --g1:#141922; --g2:#1B212C; --g3:#242C39; --g4:#2E3745;
  --line:#2A3240; --line-2:#3B4553;
  --ink:#E9EDF2; --ink-2:#A5AFBD; --ink-3:#6E7889; --ink-4:#4B5463;
  --gold:#E4B34C; --gold-2:#F3CD7A; --gold-soft:rgba(228,179,76,.14); --gold-line:rgba(228,179,76,.45);
  --ok:#4CC58F; --ok-soft:rgba(76,197,143,.16);
  --warn:#F0955A; --warn-soft:rgba(240,149,90,.16);
  --bad:#F26D6D; --bad-soft:rgba(242,109,109,.16);
  --ai:#B7A3FF; --ai-soft:rgba(183,163,255,.14);
  --c1:#8C94A3; --c2:#6FB3D8; --c3:#E4B34C;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -18px rgba(0,0,0,.9);
  --f-d:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-b:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-m:"Azeret Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --top:56px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --g0:#F2F3F6; --g1:#FFFFFF; --g2:#F6F7FA; --g3:#EBEDF2; --g4:#DFE3EA;
    --line:#D9DEE6; --line-2:#C3CAD5;
    --ink:#171B22; --ink-2:#4A5361; --ink-3:#7A8493; --ink-4:#A9B1BD;
    --gold:#9A6E12; --gold-2:#7A5608; --gold-soft:rgba(154,110,18,.12); --gold-line:rgba(154,110,18,.45);
    --ok:#1F8F5F; --ok-soft:rgba(31,143,95,.13);
    --warn:#C2611F; --warn-soft:rgba(194,97,31,.13);
    --bad:#C23B3B; --bad-soft:rgba(194,59,59,.12);
    --ai:#6A4FD8; --ai-soft:rgba(106,79,216,.12);
    --c1:#8A93A2; --c2:#2E86B5; --c3:#9A6E12;
    --shadow:0 8px 24px -16px rgba(20,25,35,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --g0:#F2F3F6; --g1:#FFFFFF; --g2:#F6F7FA; --g3:#EBEDF2; --g4:#DFE3EA;
  --line:#D9DEE6; --line-2:#C3CAD5;
  --ink:#171B22; --ink-2:#4A5361; --ink-3:#7A8493; --ink-4:#A9B1BD;
  --gold:#9A6E12; --gold-2:#7A5608; --gold-soft:rgba(154,110,18,.12); --gold-line:rgba(154,110,18,.45);
  --ok:#1F8F5F; --ok-soft:rgba(31,143,95,.13);
  --warn:#C2611F; --warn-soft:rgba(194,97,31,.13);
  --bad:#C23B3B; --bad-soft:rgba(194,59,59,.12);
  --ai:#6A4FD8; --ai-soft:rgba(106,79,216,.12);
  --c1:#8A93A2; --c2:#2E86B5; --c3:#9A6E12;
  --shadow:0 8px 24px -16px rgba(20,25,35,.35);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--g0); color:var(--ink); font-family:var(--f-b); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:48px 48px; opacity:.18; mask-image:radial-gradient(ellipse at 50% 0%, #000 30%, transparent 80%);}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

.d{font-family:var(--f-d); font-weight:700; letter-spacing:.01em}
.mono{font-family:var(--f-m)}
.k{font-family:var(--f-m); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* ================= top bar ================= */
.top{position:sticky; top:0; z-index:20; height:var(--top); display:flex; align-items:center; gap:14px; padding:0 16px;
  background:color-mix(in srgb, var(--g1) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:10px; margin-right:6px}
.brand .mark{width:30px; height:30px; border-radius:50%; border:2px solid var(--gold); position:relative; flex:none}
.brand .mark::before{content:""; position:absolute; left:50%; top:3px; width:2px; height:9px; background:var(--gold); transform:translateX(-50%)}
.brand .mark::after{content:""; position:absolute; left:50%; top:50%; width:6px; height:6px; border-radius:50%; background:var(--gold); transform:translate(-50%,-50%)}
.brand h1{font-family:var(--f-d); font-weight:900; font-size:22px; letter-spacing:.04em; text-transform:uppercase; line-height:1}
.brand .sub{white-space:nowrap; font-family:var(--f-m); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold)}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none; border:0; border-bottom:2px solid transparent; padding:0 9px; font-size:13px; height:var(--top); cursor:pointer; color:var(--ink-2); font-weight:500; display:flex; align-items:center; gap:7px; white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink); border-bottom-color:var(--gold)}
.tabs .n{font-family:var(--f-m); font-size:10.5px; color:var(--ink-3); background:var(--g3); padding:1px 6px; border-radius:100px}
.tabs button[aria-current="page"] .n{color:var(--gold); background:var(--gold-soft)}
.top .grow{flex:1; min-width:4px}
@media (max-width:1400px){ .tabs .n{display:none} .brand .sub{display:none} }
.topbtn{background:var(--g2); border:1px solid var(--line); border-radius:var(--r); padding:6px 10px; cursor:pointer; color:var(--ink-2); display:inline-flex; gap:8px; align-items:center; font-size:12.5px; white-space:nowrap}
.topbtn:hover{border-color:var(--line-2); color:var(--ink)}
.topbtn kbd{font-family:var(--f-m); font-size:10px; border:1px solid var(--line-2); border-radius:3px; padding:0 4px; color:var(--ink-3)}
.topbtn.ai{border-color:var(--ai); color:var(--ai)}
.topbtn.ai.on{background:var(--ai-soft)}
.sync{display:flex; align-items:center; gap:6px; font-family:var(--f-m); font-size:10px; color:var(--ink-3); letter-spacing:.06em}
.sync i{width:7px; height:7px; border-radius:50%; background:var(--ink-4)}
.sync.ok i{background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft)} .sync.busy i{background:var(--warn)} .sync.off i{background:var(--bad)}

/* ================= stage ================= */
.stage{position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1fr) 0; transition:grid-template-columns .2s}
.stage.drawer-open{grid-template-columns:minmax(0,1fr) 400px}
main{min-width:0; padding:20px 20px 80px; max-width:1500px}
.drawer{position:sticky; top:var(--top); height:calc(100vh - var(--top)); border-left:1px solid var(--line); background:var(--g1); overflow:hidden; display:flex; flex-direction:column; min-width:0}
.stage:not(.drawer-open) .drawer{visibility:hidden}

.vh{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:14px}
.vh h2{font-family:var(--f-d); font-weight:900; font-size:34px; letter-spacing:.02em; text-transform:uppercase; line-height:.95}
.vh .lede{color:var(--ink-2); max-width:62ch; margin:0}
.vh .grow{flex:1}

/* ================= controls ================= */
.btn{background:var(--g2); border:1px solid var(--line-2); color:var(--ink); padding:6px 12px; border-radius:var(--r); cursor:pointer; font-weight:500; font-size:13px; display:inline-flex; align-items:center; gap:7px}
.btn:hover{background:var(--g3)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#1A1508; font-weight:600}
.btn.gold:hover{background:var(--gold-2)}
.btn.ai{border-color:var(--ai); color:var(--ai)} .btn.ai:hover{background:var(--ai-soft)}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2)} .btn.ghost:hover{background:var(--g3); color:var(--ink)}
.btn.bad{color:var(--bad)} .btn.bad:hover{background:var(--bad-soft)}
.btn.sm{padding:3px 8px; font-size:12px}
.btn:disabled{opacity:.45; cursor:not-allowed}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--g0); border:1px solid var(--line-2); color:var(--ink); padding:7px 9px; border-radius:var(--r); width:100%; font-size:13px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--gold)}
textarea{resize:vertical; line-height:1.5}
label.f{display:flex; flex-direction:column; gap:4px; min-width:0}
label.f>span{font-family:var(--f-m); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px} .three{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap} .grow{flex:1 1 auto}

.tag{display:inline-flex; align-items:center; gap:5px; padding:1px 7px; border-radius:3px; font-family:var(--f-m); font-size:10.5px; letter-spacing:.03em; white-space:nowrap; background:var(--g3); color:var(--ink-2)}
.tag.ok{background:var(--ok-soft); color:var(--ok)} .tag.bad{background:var(--bad-soft); color:var(--bad)} .tag.warn{background:var(--warn-soft); color:var(--warn)}
.tag.gold{background:var(--gold-soft); color:var(--gold)} .tag.ai{background:var(--ai-soft); color:var(--ai)}
.tag.c1{background:var(--g3); color:var(--c1)} .tag.c2{background:rgba(111,179,216,.15); color:var(--c2)} .tag.c3{background:var(--gold-soft); color:var(--c3)}

.panel{background:var(--g1); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow)}
.panel>.ph{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line)}
.panel>.ph h3{font-family:var(--f-d); font-size:18px; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.panel>.ph .k{margin-left:auto}
.panel>.pb{padding:12px 14px}
.hint{font-size:12px; color:var(--ink-3)}
.empty{padding:28px; text-align:center; color:var(--ink-3); border:1px dashed var(--line-2); border-radius:8px}

/* ================= HQ ================= */
.hq{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; align-items:start}
.hq .col{display:grid; gap:16px}
.tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px}
.tile{background:var(--g1); border:1px solid var(--line); border-radius:8px; padding:12px 14px; position:relative; overflow:hidden}
.tile .k{display:block; margin-bottom:4px}
.tile .v{font-family:var(--f-d); font-weight:900; font-size:40px; line-height:1; letter-spacing:.01em}
.tile .v small{font-size:16px; color:var(--ink-3); font-weight:700; margin-left:4px}
.tile .s{font-size:12px; color:var(--ink-2); margin-top:4px}
.tile.gold .v{color:var(--gold)}
.tile .spark{position:absolute; right:10px; bottom:10px; display:flex; gap:2px; align-items:flex-end; height:26px}
.tile .spark i{display:block; width:5px; background:var(--gold); opacity:.55; border-radius:1px}

.board{display:flex; flex-direction:column}
.brow{display:grid; grid-template-columns:34px minmax(0,1fr) 150px 64px; gap:12px; align-items:center; padding:9px 14px; border-top:1px solid var(--line); cursor:pointer; text-align:left; background:none; border-left:0; border-right:0; border-bottom:0; color:var(--ink); width:100%}
.brow:first-child{border-top:0}
.brow:hover{background:var(--g2)}
.brow.sel{background:var(--gold-soft)}
.brow .rank{font-family:var(--f-d); font-weight:900; font-size:22px; color:var(--ink-3); text-align:center}
.brow.top .rank{color:var(--gold)}
.brow .name{font-weight:600; font-size:13.5px; line-height:1.3}
.brow .where{font-family:var(--f-m); font-size:10.5px; color:var(--ink-3); margin-top:2px}
.brow .score{font-family:var(--f-d); font-weight:900; font-size:24px; text-align:right; line-height:1}
.brow.out{opacity:.55} .brow.out .score{color:var(--bad)}
.stack{display:flex; height:8px; border-radius:2px; overflow:hidden; background:var(--g3)}
.stack i{display:block; height:100%}
.stack .a{background:var(--gold)} .stack .b{background:var(--c2)} .stack .c{background:var(--ok)} .stack .e{background:var(--ai)}
.stacklbl{display:flex; gap:8px; font-family:var(--f-m); font-size:9px; color:var(--ink-3); margin-top:3px; letter-spacing:.04em}
.stacklbl b{font-weight:500} .stacklbl .a{color:var(--gold)} .stacklbl .b{color:var(--c2)} .stacklbl .c{color:var(--ok)} .stacklbl .e{color:var(--ai)}

.heat{display:grid; grid-template-columns:repeat(20,minmax(0,1fr)); gap:3px}
.heat button{aspect-ratio:1/1.4; border:0; border-radius:3px; cursor:pointer; background:var(--g3); position:relative; padding:0}
.heat button span{position:absolute; left:0; right:0; bottom:3px; font-family:var(--f-m); font-size:8px; color:var(--ink-3); text-align:center}
.heat button.h1{background:color-mix(in srgb, var(--gold) 25%, var(--g3))} .heat button.h2{background:color-mix(in srgb, var(--gold) 50%, var(--g3))} .heat button.h3{background:color-mix(in srgb, var(--gold) 75%, var(--g3))} .heat button.h4{background:var(--gold)}
.heat button.h3 span,.heat button.h4 span{color:#1A1508}
.heat button.sel{outline:2px solid var(--ink); outline-offset:1px}
.heat button.con::after{content:""; position:absolute; top:3px; right:3px; width:5px; height:5px; border-radius:50%; background:var(--bad)}
.heatlegend{display:flex; gap:14px; font-size:11.5px; color:var(--ink-3); margin-top:8px; flex-wrap:wrap}

.reads{display:flex; flex-direction:column}
.read{display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:10px; padding:8px 14px; border-top:1px solid var(--line); align-items:start}
.read:first-child{border-top:0}
.read .ln{font-family:var(--f-m); font-size:10.5px; color:var(--gold); padding-top:2px}
.read .poem{font-size:13px; color:var(--ink-2); font-style:italic}
.read .best{font-weight:600; font-size:13.5px}
.read .by{font-family:var(--f-m); font-size:10px; color:var(--ink-3)}
.read .agree{font-family:var(--f-m); font-size:10.5px; color:var(--ink-3); white-space:nowrap; text-align:right}
.read .agree b{color:var(--ink); font-weight:600}
.read.contested .agree{color:var(--bad)}

.queue{display:flex; flex-direction:column}
.q{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; padding:10px 14px; border-top:1px solid var(--line); align-items:center}
.q:first-child{border-top:0}
.q .pri{font-family:var(--f-d); font-weight:900; font-size:20px; width:26px; text-align:center}
.q .pri.p1{color:var(--bad)} .q .pri.p2{color:var(--warn)} .q .pri.p3{color:var(--c2)}
.q .t{font-size:13px} .q .m{font-family:var(--f-m); font-size:10.5px; color:var(--ink-3); margin-top:2px}

.feed{display:flex; flex-direction:column}
.fi{padding:9px 14px; border-top:1px solid var(--line); font-size:13px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px}
.fi:first-child{border-top:0}
.fi .dot{width:8px; height:8px; border-radius:50%; margin-top:6px; background:var(--ink-4)}
.fi .dot.statement{background:var(--gold)} .fi .dot.book,.fi .dot.map,.fi .dot.field,.fi .dot.math{background:var(--c2)} .fi .dot.objection{background:var(--bad)} .fi .dot.speculation,.fi .dot.community{background:var(--ai)}
.fi .m{font-family:var(--f-m); font-size:10px; color:var(--ink-3); margin-top:2px}

/* ================= solve room ================= */
.room{display:grid; grid-template-columns:300px minmax(0,1fr); gap:16px; align-items:start}
.roster{position:sticky; top:calc(var(--top) + 16px); max-height:calc(100vh - var(--top) - 32px); overflow:auto}
.roster .brow{grid-template-columns:28px minmax(0,1fr) 44px; padding:8px 12px}
.roster .brow .rank{font-size:17px} .roster .brow .score{font-size:18px}
.roster .brow .name{font-size:12.5px}
.roster .stack{display:none}
.roomhead{display:grid; grid-template-columns:120px minmax(0,1fr); gap:18px; align-items:center; padding:16px}
.ring{width:120px; height:120px; position:relative}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .c{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring .c b{font-family:var(--f-d); font-weight:900; font-size:38px; line-height:1}
.ring .c span{font-family:var(--f-m); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.roomhead h2{font-family:var(--f-d); font-weight:900; font-size:30px; text-transform:uppercase; letter-spacing:.02em; line-height:1}
.roomhead .meta{font-family:var(--f-m); font-size:11px; color:var(--ink-3); margin-top:6px}
.roomhead .acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.parts{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border-top:1px solid var(--line)}
.parts div{padding:10px 14px; border-left:1px solid var(--line)} .parts div:first-child{border-left:0}
.parts b{font-family:var(--f-d); font-weight:900; font-size:22px; display:block; line-height:1}
.parts b.neg{color:var(--bad)} .parts b.pos{color:var(--ok)}
.roomgrid{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr); gap:16px; margin-top:16px; align-items:start}
.route{display:flex; flex-direction:column}
.stz{padding:8px 14px; background:var(--g2); border-top:1px solid var(--line); display:flex; gap:10px; align-items:baseline}
.stz .k{color:var(--gold)}
.stz .mode{font-size:11.5px; color:var(--ink-3)}
.slot{display:grid; grid-template-columns:34px minmax(0,1fr) 70px 90px; gap:10px; padding:10px 14px; border-top:1px solid var(--line); align-items:start}
.slot .ln{font-family:var(--f-m); font-size:10.5px; color:var(--gold); padding-top:6px}
.slot .poem{font-size:13.5px; margin-bottom:6px; color:var(--ink)}
.slot .poem.hard::after{content:"HARD"; font-family:var(--f-m); font-size:8.5px; letter-spacing:.12em; color:var(--warn); margin-left:8px; vertical-align:middle}
.slot input,.slot select{padding:5px 8px; font-size:12.5px}
.slot .in{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px}
.slot .in input.coords{grid-column:1/-1; font-family:var(--f-m); font-size:11.5px}
.slot .ev{font-size:11px; color:var(--ink-3); margin-top:4px}
.slot .ev b{color:var(--ok); font-weight:600} .slot .ev i{color:var(--bad); font-style:normal}
.vbtn{border:1px solid var(--line-2); background:var(--g0); border-radius:var(--r); height:30px; cursor:pointer; font-family:var(--f-m); font-size:11px; color:var(--ink-3); width:100%}
.vbtn.fit{background:var(--ok-soft); color:var(--ok); border-color:var(--ok)} .vbtn.fail{background:var(--bad-soft); color:var(--bad); border-color:var(--bad)}
.gates{display:flex; flex-wrap:wrap; gap:5px; padding:12px 14px}
.gate{border:1px solid var(--line-2); background:var(--g0); color:var(--ink-2); border-radius:3px; cursor:pointer; font-family:var(--f-m); font-size:10.5px; padding:3px 8px; display:inline-flex; gap:6px; align-items:center; text-align:left}
.gate.pass{background:var(--ok-soft); color:var(--ok); border-color:transparent} .gate.fail{background:var(--bad-soft); color:var(--bad); border-color:var(--bad)}
.kv{padding:12px 14px; border-top:1px solid var(--line); font-size:13px}
.kv .k{display:block; margin-bottom:4px}
.kv.kill .k{color:var(--bad)} .kv.test .k{color:var(--c2)}
.linked{display:flex; flex-direction:column}
.lk{padding:8px 14px; border-top:1px solid var(--line); font-size:12.5px; display:grid; grid-template-columns:3px minmax(0,1fr); gap:10px}
.lk i{background:var(--ok); border-radius:2px} .lk.contradicts i{background:var(--bad)} .lk.mention i{background:var(--c2)}
.lk .m{font-family:var(--f-m); font-size:10px; color:var(--ink-3); margin-top:2px}
.aiout{padding:12px 14px; border-top:1px solid var(--line); font-size:13px; line-height:1.55; white-space:pre-wrap}
.aiout:empty{display:none}
.cmp{overflow-x:auto}
.cmp table{border-collapse:collapse; width:100%; font-size:12.5px}
.cmp th,.cmp td{padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
.cmp th{font-family:var(--f-m); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); background:var(--g2); position:sticky; top:0}
.cmp td.c1{box-shadow:inset 3px 0 var(--c1)} .cmp td.c2{box-shadow:inset 3px 0 var(--c2)} .cmp td.c3{box-shadow:inset 3px 0 var(--c3)} .cmp td.vfail{background:var(--bad-soft)}

/* ================= evidence wall ================= */
.wall{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start}
.wallcv{position:relative; background:radial-gradient(ellipse at 50% 40%, var(--g2), var(--g1) 70%); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.wallcv canvas{display:block; width:100%; height:640px; cursor:grab}
.wallcv .legend{position:absolute; left:12px; bottom:10px; display:flex; gap:12px; font-family:var(--f-m); font-size:10px; color:var(--ink-3); background:color-mix(in srgb, var(--g1) 80%, transparent); padding:5px 8px; border-radius:4px}
.wallcv .legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px}
.wallcv .ctl{position:absolute; right:12px; top:10px; display:flex; gap:6px}
.wallside .brow{grid-template-columns:28px minmax(0,1fr) 44px}
.wallside .brow .rank{font-size:16px} .wallside .brow .score{font-size:18px}
.nodeinfo{padding:12px 14px; font-size:13px}
.nodeinfo h4{font-family:var(--f-d); font-size:18px; letter-spacing:.03em; text-transform:uppercase}

/* ================= line lab ================= */
.lab{display:grid; grid-template-columns:260px minmax(0,1fr); gap:16px; align-items:start}
.lablist{position:sticky; top:calc(var(--top) + 16px); max-height:calc(100vh - var(--top) - 32px); overflow:auto}
.lline{display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:8px; padding:8px 12px; border-top:1px solid var(--line); cursor:pointer; text-align:left; background:none; border-left:0; border-right:0; border-bottom:0; color:var(--ink); width:100%; align-items:center}
.lline:first-child{border-top:0} .lline:hover{background:var(--g2)} .lline.sel{background:var(--gold-soft)}
.lline .ln{font-family:var(--f-m); font-size:10px; color:var(--gold)} .lline .t{font-size:12.5px} .lline .n{font-family:var(--f-m); font-size:10px; color:var(--ink-3)}
.bigline{font-family:var(--f-d); font-weight:700; font-size:34px; line-height:1.1; padding:18px 16px 10px; letter-spacing:.01em}
.words{display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 16px}
.word{border:1px solid var(--line-2); background:var(--g0); border-radius:4px; padding:3px 9px; cursor:pointer; font-size:13px; display:inline-flex; gap:6px; align-items:center}
.word:hover{border-color:var(--gold)} .word.sel{background:var(--gold-soft); border-color:var(--gold)}
.word .n{font-family:var(--f-m); font-size:9.5px; color:var(--ink-3)}
.word.hit{border-color:var(--c2)}
.labgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-top:16px; align-items:start}
.rd{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; padding:9px 14px; border-top:1px solid var(--line); align-items:start}
.rd:first-child{border-top:0}
.rd .vote{display:flex; flex-direction:column; align-items:center; gap:0}
.rd .vote button{background:none; border:0; cursor:pointer; color:var(--ink-3); padding:0 6px; line-height:1; font-size:14px} .rd .vote button:hover{color:var(--gold)}
.rd .vote b{font-family:var(--f-d); font-size:16px; font-weight:900}
.rd .t{font-size:13px} .rd .m{font-family:var(--f-m); font-size:10px; color:var(--ink-3); margin-top:2px}
.rd.ai .t::before{content:"AI"; font-family:var(--f-m); font-size:9px; color:var(--ai); border:1px solid var(--ai); border-radius:3px; padding:0 4px; margin-right:6px; vertical-align:middle}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--line); border-radius:0 0 8px 8px; overflow:hidden}
.stats div{background:var(--g1); padding:10px 14px} .stats b{font-family:var(--f-d); font-weight:900; font-size:22px; display:block; line-height:1}

/* ================= gate ================= */
.gatewrap{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:16px; align-items:start}
.grow-table{overflow-x:auto}
.gm{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px}
.gm th,.gm td{padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
.gm thead th{font-family:var(--f-m); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); background:var(--g2); position:sticky; top:0; z-index:2; text-align:left; max-width:120px; line-height:1.3}
.gm th.st{position:sticky; left:0; background:var(--g1); z-index:1; min-width:280px; text-align:left; font-weight:500}
.gm thead th.st{z-index:3; background:var(--g2)}
.gm th.st .kills{font-family:var(--f-m); font-size:10px; color:var(--bad); margin-left:6px}
.gm th.st .src{display:block; font-family:var(--f-m); font-size:9.5px; color:var(--ink-3)}
.gm td.c{text-align:center; padding:3px}
.gm .cell{width:100%; min-width:44px; height:28px; border:1px solid var(--line); border-radius:3px; background:var(--g0); cursor:pointer; font-family:var(--f-m); font-size:11px; color:var(--ink-4)}
.gm .cell.pass{background:var(--ok-soft); color:var(--ok); border-color:transparent} .gm .cell.fail{background:var(--bad-soft); color:var(--bad); border-color:var(--bad)}
.deck{padding:16px}
.dcard{background:var(--g2); border:1px solid var(--line-2); border-radius:10px; padding:18px; min-height:230px; display:flex; flex-direction:column; gap:10px; position:relative}

.dcard .stmt{font-family:var(--f-d); font-weight:700; font-size:24px; line-height:1.15}
.dcard .ctx{font-size:12.5px; color:var(--ink-2)}
.dcard .who{font-weight:600}
.dacts{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px}
.dacts .btn{justify-content:center; padding:10px}
.dacts .btn kbd{font-family:var(--f-m); font-size:10px; opacity:.7}
.dprog{font-family:var(--f-m); font-size:10.5px; color:var(--ink-3); margin-top:8px; display:flex; justify-content:space-between}

/* ================= facts ================= */
.facts{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start}
.tiers{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:12px}
.tiers button{background:none; border:0; border-bottom:2px solid transparent; padding:8px 12px; cursor:pointer; color:var(--ink-2); font-weight:500; display:flex; gap:7px; align-items:center}
.tiers button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--gold)}
.tiers .n{font-family:var(--f-m); font-size:10.5px; color:var(--ink-3)}
.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-bottom:12px}
.filters label.f{width:150px} .filters label.f.wide{flex:1 1 220px; width:auto}
.fact{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; padding:12px 14px; border-top:1px solid var(--line); align-items:start}
.fact:first-child{border-top:0}
.fact .lk{padding:0; border:0; display:block}
.fact .link{font-family:var(--f-d); font-weight:900; font-size:22px; text-align:center; line-height:1; color:var(--ink-3)}
.fact .link.hot{color:var(--gold)} .fact .link small{display:block; font-family:var(--f-m); font-size:8.5px; letter-spacing:.1em; font-weight:400}
.fact p{margin:0 0 6px; font-size:13.5px}
.fact .acts{display:flex; gap:4px}
.lnk{display:inline-flex; gap:3px; padding:0 5px; border-radius:3px; font-family:var(--f-m); font-size:10px; background:var(--ok-soft); color:var(--ok); cursor:pointer; border:0}
.lnk.contradicts{background:var(--bad-soft); color:var(--bad)}
.ingest textarea{min-height:140px}

/* ================= map ================= */
.mapwrap{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start}
.sheet{padding:0; overflow:hidden}
.sheet svg{display:block; width:100%; height:auto; background:var(--g0)}
.tog{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:3px; cursor:pointer; border:1px solid var(--line-2); background:var(--g1); font-family:var(--f-m); font-size:10.5px; color:var(--ink-2)}
.tog.on{background:var(--gold-soft); color:var(--gold); border-color:transparent}
.st{stroke:var(--line-2); stroke-width:.5; cursor:pointer; vector-effect:non-scaling-stroke}
.st-open{fill:var(--g2)} .st-inplay{fill:color-mix(in srgb, var(--c2) 22%, var(--g2))} .st-hot{fill:color-mix(in srgb, var(--gold) 30%, var(--g2))} .st-active{fill:color-mix(in srgb, var(--gold) 55%, var(--g2))}
.st-fringe{fill:var(--g2); stroke-dasharray:2 1.6} .st-eliminated{fill:url(#hatch); stroke:var(--bad)} .st-offmap{fill:none; stroke:var(--line); stroke-dasharray:1 1.6; cursor:default}
.st.sel{stroke:var(--ink); stroke-width:1.2}
.sheet text{pointer-events:none}
.lbl{font-family:var(--f-d); font-weight:900; font-size:9px; fill:var(--ink); letter-spacing:.6px; text-anchor:middle; paint-order:stroke; stroke:var(--g0); stroke-width:1.2px}
.lbl2{font-family:var(--f-m); font-size:4.6px; fill:var(--ink-2); letter-spacing:.3px; text-transform:uppercase; text-anchor:middle}
.lbl.dim,.lbl2.dim{fill:var(--ink-3)} .lbl.warn,.lbl2.warn{fill:var(--bad)}
.grat{font-family:var(--f-m); font-size:4.4px; fill:var(--ink-3)}
.fenn{fill:none; stroke:var(--gold); stroke-width:.7; stroke-dasharray:2.4 1.6; opacity:.9}
.fennlbl{font-family:var(--f-m); font-size:5px; fill:var(--gold); letter-spacing:.4px}
.cutoff{stroke:var(--bad); stroke-width:.6; stroke-dasharray:1.6 1.2}
.ring2{fill:var(--c2); fill-opacity:.07; stroke:var(--c2); stroke-width:.45; stroke-dasharray:1.2 1}
.site{cursor:pointer} .site circle.dot{stroke:var(--g0); stroke-width:.8}
.site.live circle.dot{fill:var(--ok)} .site.out circle.dot{fill:var(--bad); fill-opacity:.55} .site.sel circle.dot{stroke:var(--gold); stroke-width:1.2}
.site text{font-family:var(--f-m); font-size:4.4px; fill:var(--ink); text-anchor:start; paint-order:stroke; stroke:var(--g0); stroke-width:1.1px}
.routeline{fill:none; stroke:var(--gold); stroke-width:.9; stroke-dasharray:2 1.2}
.local svg{background:var(--g0)}
.local .pin{fill:var(--gold); stroke:var(--g0); stroke-width:1}
.local .pin.s4{fill:var(--ok)}
.local .pl{font-family:var(--f-m); font-size:9px; fill:var(--ink); paint-order:stroke; stroke:var(--g0); stroke-width:2px}
.local .ray{stroke:var(--c2); stroke-width:1; stroke-dasharray:4 3}
.local .raylbl{font-family:var(--f-m); font-size:8.5px; fill:var(--c2)}
.local .mile{fill:var(--ok); fill-opacity:.06; stroke:var(--ok); stroke-width:1; stroke-dasharray:3 3}
.local .rt{fill:none; stroke:var(--gold); stroke-width:1.5; stroke-opacity:.8}
.local .gridl{stroke:var(--line); stroke-width:.6}
.local .gl{font-family:var(--f-m); font-size:8px; fill:var(--ink-3)}
.local .scale{stroke:var(--ink); stroke-width:2} .local .sl{font-family:var(--f-m); font-size:8.5px; fill:var(--ink-2)}
.legs{font-size:12.5px} .legs table{width:100%; border-collapse:collapse} .legs td{padding:4px 0; border-top:1px solid var(--line)} .legs td.n{font-family:var(--f-m); text-align:right; color:var(--ink-2)}
.sitelist{display:flex; flex-direction:column; gap:2px}
.srow{display:flex; gap:8px; align-items:center; width:100%; text-align:left; background:none; border:1px solid transparent; padding:5px 8px; border-radius:var(--r); cursor:pointer; font-size:12.5px; color:var(--ink)}
.srow:hover{background:var(--g2)} .srow.sel{border-color:var(--gold); background:var(--gold-soft)}
.srow .d{width:8px; height:8px; border-radius:50%; flex:none; background:var(--ok)} .srow.out .d{background:var(--bad); opacity:.55}
.srow .m{margin-left:auto; font-family:var(--f-m); font-size:10.5px; color:var(--ink-3); white-space:nowrap}

/* ================= ops ================= */
.ops{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; align-items:start}
.res{display:flex; flex-wrap:wrap; gap:6px}
.res a{display:inline-flex; gap:7px; align-items:center; padding:6px 11px; border:1px solid var(--line-2); border-radius:4px; text-decoration:none; color:var(--ink); font-size:12.5px; background:var(--g2)}
.res a:hover{border-color:var(--gold)} .res a .k{font-size:9.5px}
.tl{position:relative; padding-left:18px}
.tl::before{content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line-2)}

.tle .m{font-family:var(--f-m); font-size:10px; color:var(--gold)}

/* ================= AI drawer ================= */
.dh{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line)}
.dh h3{font-family:var(--f-d); font-size:20px; letter-spacing:.05em; text-transform:uppercase; color:var(--ai)}

.log{flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:12px}
.msg{max-width:100%; font-size:13.5px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word}

/* ================= palette / dialog / toast ================= */

.palbox input:focus{border-color:var(--line)}

.pr{display:grid; grid-template-columns:70px minmax(0,1fr); gap:12px; padding:9px 16px; cursor:pointer; align-items:center}
.pr:hover,.pr.act{background:var(--g2)}
.pr .k{text-align:right}
.pr .t{font-size:13.5px} .pr .s{font-family:var(--f-m); font-size:10.5px; color:var(--ink-3)}
dialog{border:1px solid var(--line-2); border-radius:10px; background:var(--g1); color:var(--ink); padding:0; max-width:680px; width:calc(100vw - 32px); box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dg-h{padding:16px 18px 0} .dg-h h2{font-family:var(--f-d); font-size:24px; letter-spacing:.04em; text-transform:uppercase}
.dg-b{padding:14px 18px; display:flex; flex-direction:column; gap:12px; max-height:64vh; overflow:auto}
.dg-f{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; background:var(--g2); border-radius:0 0 10px 10px}
.sugg{display:flex; gap:10px; align-items:flex-start; padding:9px; border:1px solid var(--line); border-radius:6px; background:var(--g2)}
.sugg .b{flex:1; min-width:0} .sugg .ln{font-size:13px} .sugg .why{font-size:11.5px; color:var(--ink-2)}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--g0); padding:9px 16px; border-radius:100px; font-size:13px; z-index:99; max-width:calc(100vw - 32px)}

@media (max-width:1180px){ .hq,.room,.wall,.lab,.gatewrap,.facts,.mapwrap,.ops,.roomgrid,.labgrid{grid-template-columns:1fr} .roster,.lablist{position:static; max-height:none} .stage.drawer-open{grid-template-columns:minmax(0,1fr) 340px} }
@media (max-width:820px){ .tiles{grid-template-columns:1fr 1fr} .parts{grid-template-columns:repeat(3,1fr)} .stage.drawer-open{grid-template-columns:0 1fr} .stage.drawer-open main{display:none} .slot{grid-template-columns:30px minmax(0,1fr)} .slot .vb,.slot .cf{grid-column:2} .brow{grid-template-columns:30px minmax(0,1fr) 56px} .brow .stack,.brow .stacklbl{display:none} .brand h1{display:none} }
/* Top 3 */
.tier{display:inline-block; font:600 10px/1 var(--f-m); letter-spacing:.06em; text-transform:uppercase; padding:4px 6px; border-radius:3px; border:1px solid var(--line-2); color:var(--ink-2); white-space:nowrap}
.tier.confirmed{color:var(--ok); border-color:var(--ok); background:var(--ok-soft)} .tier.reported{color:var(--gold); border-color:var(--gold-line); background:var(--gold-soft)} .tier.circulating{color:var(--c2); border-color:var(--c2)} .tier.fan{color:var(--ai); border-color:var(--ai)} .tier.unverified{color:var(--warn); border-color:var(--warn); background:var(--warn-soft)}
.t3intro{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px}

.t3head h2{font-family:var(--f-d); font-size:30px; line-height:1; margin:0 0 4px; letter-spacing:.01em} .t3head .meta{font:11px var(--f-m); color:var(--ink-3)} .t3head .verdict{margin:10px 0 0; color:var(--ink-2); max-width:70ch; font-size:14px}
.t3score{flex:0 0 auto; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:2px} .t3score b{font-family:var(--f-d); font-size:40px; line-height:1; color:var(--gold)} .t3score span{font:600 10px var(--f-m); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)} .t3score .g i{font-style:normal; color:var(--ink-2)} .t3score .g i.ok{color:var(--ok)} .t3score .g i.bad{color:var(--bad)}
.t3acts{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 16px}
.t3grid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px} .t3grid>div{display:grid; gap:16px; align-content:start}

/* ================= persistence ================= */
function setSync(cls, txt) { const s = document.getElementById("sync"); s.className = "sync " + cls; document.getElementById("syncTxt").textContent = txt; }
function queueWrite(path, body) {

function parseLines(raw, previous) {
  const pool = new Map(); (previous || []).forEach(l => { const k = norm(l.text); if (!pool.has(k)) pool.set(k, []); pool.get(k).push(l); });
  const out = []; let stanza = 1, blank = false;
  raw.split(/\r?\n/).forEach(r => { const text = r.trim(); if (!text) { if (out.length) blank = true; return; } if (blank) { stanza++; blank = false; }
    const k = norm(text), reuse = pool.get(k) && pool.get(k).length ? pool.get(k).shift() : null;
    out.push({ id:reuse ? reuse.id : uid("l"), stanza, text, hard:reuse ? !!reuse.hard : false, status:reuse ? (reuse.status || "unsolved") : "unsolved", kind:reuse ? (reuse.kind || "") : "", note:reuse ? (reuse.note || "") : "" }); });
  return out;
}

/* ================= ranking engine =================
   Everything on the board is ranked by linkage strength, not by entry order. */
function linksFor(lineId) { const out = []; state.intel.forEach(it => (it.links || []).forEach(k => { if (k.lineId === lineId) out.push({ it, link:k }); })); return out.sort((a, b) => (CONF_RANK[b.it.conf] || 0) - (CONF_RANK[a.it.conf] || 0)); }
function factWeight(it) { return (it.links || []).length * (1 + (CONF_RANK[it.conf] || 0)) + (it.kind === "statement" ? 2 : 0); }
function rankedFacts(list) { return (list || state.intel).slice().sort((a, b) => factWeight(b) - factWeight(a) || (b.created || 0) - (a.created || 0)); }

/* Place tokens a solve owns: its name + every chain place. Facts that mention them are its linkages. */
function solveTokens(c) {
  const set = new Set();
  const add = s => tokens(s).forEach(w => { if (w.length >= 4 && !LEXICON.has(w) && !/^\d+$/.test(w)) set.add(w); });
  add(shortName(c)); Object.values(c.chain || {}).forEach(s => add(s.place));
  ["montana","wyoming","idaho","utah","mexico","county","national","forest","state","river","creek","canyon","lake","mountain","mountains","spring","springs","park","rock","pass","hole","verify","reading","solve","solves","theory","cluster","front"].forEach(w => set.delete(stem(w)));
  return set;
}
const _mentionCache = new Map();
function mentions(c) {
  const key = c.id + "|" + state.intel.length + "|" + JSON.stringify(c.chain || {}).length + "|" + c.name;
  if (_mentionCache.has(key)) return _mentionCache.get(key);
  const toks = solveTokens(c); const out = [];

  const solveReads = ranked().filter(({ c }) => (c.chain || {})[sel.id] && ((c.chain || {})[sel.id].place || (c.chain || {})[sel.id].reading)).map(({ c, s }) => ({ c, s, sl:c.chain[sel.id] }));
  const wordFacts = selWord != null ? state.intel.filter(it => norm(it.text).split(" ").includes(norm(words[selWord].replace(/[^A-Za-z']/g, "")))) : [];
  const letters = sel.text.replace(/[^A-Za-z]/g, "").length, vowels = (sel.text.match(/[aeiouAEIOU]/g) || []).length;
  return `<div class="vh"><div><h2>Line lab</h2><p class="lede">One line at a time: every word, every fact that touches it, every reading anyone has put on it, ranked by support.</p></div><div class="grow"></div><button class="btn" data-act="edit-poem">Edit poem</button></div>
  <div class="lab"><div class="panel lablist"><div class="board">${list}</div></div><div>
    <div class="panel"><div class="ph"><h3>${L(idx)} · Stanza ${sel.stanza} · ${(STAGES[sel.stanza] || [""])[0]}</h3><span class="k">${esc(STATUS_LABEL[sel.status] || "unsolved")}${sel.hard ? " · HARD" : ""}</span></div>
      <div class="bigline">${esc(sel.text)}</div><div class="words">${wHTML}</div>
      <div class="stats"><div><span class="k">Words in poem</span><b>${before + 1}–${before + words.length}</b><span class="hint">of ${allWords.length}</span></div><div><span class="k">Letters</span><b>${letters}</b><span class="hint">${vowels} vowels · ${letters - vowels} consonants</span></div><div><span class="k">Rhyme</span><b>${esc(sel.text.replace(/[—–-]+$/, "").trim().split(/\s+/).pop().replace(/[^A-Za-z']/g, "").toLowerCase())}</b><span class="hint">couplet ${Math.floor(idx / 2) + 1}</span></div></div>

      <div class="pb" style="padding-top:0"><label class="f"><span>Working note</span><textarea rows="3" data-note="${sel.id}" placeholder="What does this line instruct?">${esc(sel.note || "")}</textarea></label></div>
      <div class="aiout" id="aiout-line"></div></div>
    ${selWord != null ? `<div class="panel" style="margin-top:16px"><div class="ph"><h3>“${esc(words[selWord])}”</h3><span class="k">${wordFacts.length} facts use this word</span></div><div class="feed">${wordFacts.slice(0, 8).map(it => `<div class="fi"><span class="dot ${it.kind}"></span><span>${esc(it.text.length > 200 ? it.text.slice(0, 198) + "…" : it.text)}<div class="m">${esc(KIND_LABEL[it.kind] || it.kind)} · ${esc(it.source || "")}</div></span></div>`).join("") || '<div class="pb hint">No fact uses this word.</div>'}</div></div>` : ""}
    <div class="labgrid"><div class="panel"><div class="ph"><h3>Readings</h3><span class="k">ranked by votes · solves first</span></div><div>${solveReads.map(({ c, s, sl }) => `<div class="rd"><span class="vote"><b>${sl.conf || "–"}</b></span><span><div class="t"><b>${esc(sl.place || "")}</b>${sl.reading ? " — " + esc(sl.reading) : ""}</div><div class="m">${esc(shortName(c))} · score ${s.score}${s.ruledOut ? " · ruled out" : ""}</div></span><button class="btn sm ghost" data-act="open-solve" data-id="${c.id}">open</button></div>`).join("")}${reads.map(r => `<div class="rd ${r.by === "ai" ? "ai" : ""}"><span class="vote"><button data-act="vote" data-id="${r.id}" data-d="1">▲</button><b>${r.votes || 0}</b><button data-act="vote" data-id="${r.id}" data-d="-1">▼</button></span><span><div class="t">${esc(r.text)}</div><div class="m">${r.why ? esc(r.why) + " · " : ""}${r.by === "ai" ? "analyst" : "you"}</div></span><button class="btn sm ghost bad" data-act="del-reading" data-id="${r.id}">✕</button></div>`).join("")}${!solveReads.length && !reads.length ? '<div class="pb hint">No readings yet.</div>' : ""}</div><div class="pb row"><input type="text" id="newReading" placeholder="Add a reading of this line…"><button class="btn sm" data-act="add-reading" data-id="${sel.id}">Add</button></div></div>
    <div class="panel"><div class="ph"><h3>Facts on this line</h3><span class="k">${ls.filter(x => x.link.stance !== "contradicts").length} for · ${ls.filter(x => x.link.stance === "contradicts").length} against</span></div><div class="linked">${ls.map(x => `<div class="lk ${x.link.stance}"><i></i><span>${esc(x.it.text)}${x.link.why ? `<div class="hint" style="font-style:italic">${esc(x.link.why)}</div>` : ""}<div class="m">${esc(KIND_LABEL[x.it.kind] || x.it.kind)} · ${esc(CONF_LABEL[x.it.conf] || "")} · ${esc(x.it.source || "")} · <button class="btn ghost sm" style="padding:0 4px" data-act="unlink" data-id="${x.it.id}" data-line="${sel.id}">unlink</button></div></span></div>`).join("") || '<div class="pb hint">Nothing matched yet.</div>'}</div></div></div>
  </div></div>`;
}


/* ================= The gate ================= */
function viewGate() {
  const gr = gateRank(); const rk = ranked().filter(r => state.gateShowOut || !r.s.ruledOut).slice(0, 14);
  const head = rk.map(({ c, s }) => `<th title="${esc(c.name)}">${esc(shortName(c).slice(0, 26))}<br><span style="color:${s.ruledOut ? "var(--bad)" : "var(--ok)"}">${s.ruledOut ? "OUT" : s.score}</span></th>`).join("");
  const rows = gr.map(({ g, kills, pass, unk }) => `<tr><th class="st">${esc(g[1])}<span class="kills">${kills ? "kills " + kills : ""}</span><span class="src">${esc(g[2])} · ${pass} pass · ${unk} open</span></th>${rk.map(({ c }) => { const v = (c.gates || {})[g[0]]; return `<td class="c"><button class="cell ${v || ""}" data-act="gate" data-id="${c.id}" data-gate="${g[0]}">${v === "pass" ? "✓" : v === "fail" ? "✕" : "·"}</button></td>`; }).join("")}</tr>`).join("");
  return `<div class="vh"><div><h2>The gate</h2><p class="lede">Posey's hard statements, ranked by how many solves they have killed. The judge deck deals you the open cells one at a time.</p></div><div class="grow"></div><button class="btn ${state.gateShowOut ? "gold" : ""}" data-act="gate-out">${state.gateShowOut ? "Hiding nothing" : "Show ruled-out"}</button><button class="btn gold" data-act="judge-solve" data-id="">Judge deck</button></div>
  <div class="gatewrap"><div class="panel grow-table"><table class="gm"><thead><tr><th class="st">Statement · ranked by kills</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="panel deck" id="deck">${deckHTML()}</div></div>`;
}
function buildDeck(solveId) {
  const q = []; const gr = gateRank(); const list = solveId ? [solveById(solveId)].filter(Boolean) : standing().slice(0, 8).map(r => r.c);
  list.forEach(c => { gr.forEach(({ g }) => { if (!(c.gates || {})[g[0]]) q.push({ type:"gate", c, g }); }); state.lines.forEach(l => { if (!(c.verdicts || {})[l.id] && (c.chain || {})[l.id] && ((c.chain || {})[l.id].place || (c.chain || {})[l.id].reading)) q.push({ type:"line", c, l }); }); });
  state.judge = { queue:q, i:0, done:0, solveId };
}
function deckHTML() {
  if (!state.judge.queue.length) buildDeck(state.judge.solveId);
  const j = state.judge, card = j.queue[j.i];
  if (!card) return `<div class="k" style="color:var(--gold)">Judge deck</div><div class="dcard"><div class="stmt">Nothing left to judge${j.solveId ? " for this solve" : " on the top solves"}.</div><div class="ctx">${j.done} judged this sitting.</div><div class="row"><button class="btn sm" data-act="deck-all">Deal all standing solves</button></div></div>`;
  const c = card.c, s = strength(c);
  const body = card.type === "gate" ? `<div class="k">Gate · ${esc(card.g[2])}</div><div class="stmt">${esc(card.g[1])}</div><div class="ctx">Does <span class="who">${esc(shortName(c))}</span> pass? ${esc((c.notes || "").slice(0, 220))}${(c.notes || "").length > 220 ? "…" : ""}</div>` : `<div class="k">Poem · ${lineNo(card.l.id)}${card.l.hard ? " · HARD" : ""}</div><div class="stmt">${esc(card.l.text)}</div><div class="ctx"><span class="who">${esc(shortName(c))}</span> reads it as <b>${esc(c.chain[card.l.id].place || "")}</b>${c.chain[card.l.id].reading ? " — " + esc(c.chain[card.l.id].reading) : ""}. Does it fit?</div>`;
  return `<div class="row"><span class="k" style="color:var(--gold)">Judge deck</span><span class="grow"></span><span class="tag">${esc(shortName(c))} · ${s.score}</span></div><div class="dcard" style="margin-top:10px">${body}<div class="dacts"><button class="btn" style="color:var(--ok)" data-act="deck" data-v="pass">${card.type === "gate" ? "Pass" : "Fits"} <kbd>1</kbd></button><button class="btn" style="color:var(--bad)" data-act="deck" data-v="fail">${card.type === "gate" ? "Fail" : "Fails"} <kbd>2</kbd></button><button class="btn ghost" data-act="deck" data-v="skip">Skip <kbd>3</kbd></button></div><div class="dprog"><span>${j.i + 1} / ${j.queue.length}</span><span>${j.done} judged</span></div></div>`;
}
function deckAnswer(v) {
  const j = state.judge, card = j.queue[j.i]; if (!card) return;
  if (v !== "skip") { const c = card.c; if (card.type === "gate") { c.gates = c.gates || {}; c.gates[card.g[0]] = v; } else { c.verdicts = c.verdicts || {}; c.verdicts[card.l.id] = v === "pass" ? "fit" : "fail"; } saveSolve(c); j.done++; _mentionCache.clear(); }
  j.i++; const d = document.getElementById("deck"); if (d && state.route === "gate") { d.innerHTML = deckHTML(); if (v !== "skip") { const cells = document.querySelectorAll(`.gm .cell[data-id="${card.c.id}"][data-gate="${card.type === "gate" ? card.g[0] : ""}"]`); cells.forEach(el => { el.className = "cell " + v; el.textContent = v === "pass" ? "✓" : "✕"; }); } } else render();
}

/* ================= Facts ================= */
function viewFacts() {
  const f = state.filter, q = norm(f.q), tier = TIERS.find(t => t[0] === f.tier);
  let rows = state.intel.filter(it => (!tier || tier[2](it)) && (!f.kind || it.kind === f.kind) && (!f.conf || it.conf === f.conf) && (f.line === "__none" ? !(it.links || []).length : (!f.line || (it.links || []).some(k => k.lineId === f.line))) && (!q || norm(it.text + " " + (it.source || "") + " " + (it.tags || []).join(" ")).includes(q)));
  rows = f.fmode === "rank" ? rankedFacts(rows) : f.fmode === "time" ? rows.slice().sort((a, b) => (whenKey(b.when) || whenKey(b.source) || "0").localeCompare(whenKey(a.when) || whenKey(a.source) || "0")) : rows.slice().sort((a, b) => (b.created || 0) - (a.created || 0));
  const counts = TIERS.map(t => state.intel.filter(t[2]).length);
  const maxW = Math.max(1, ...rows.slice(0, 5).map(factWeight));
  return `<div class="vh"><div><h2>Facts</h2><p class="lede">Kept apart on purpose: what Posey actually said, what the book and materials contain, and what anyone has theorised. Ranked by how much each one binds to the poem.</p></div><div class="grow"></div><button class="btn ai" data-act="ai-ingest" ${sampler ? "" : "disabled"}>AI ingest</button><button class="btn" data-act="bulk">Paste a batch</button><button class="btn gold" data-act="add-fact">Add fact</button></div>
  <div class="tiers">${TIERS.map((t, i) => `<button role="tab" aria-selected="${f.tier === t[0]}" data-act="tier" data-id="${t[0]}">${t[1]}<span class="n">${counts[i]}</span></button>`).join("")}<button role="tab" aria-selected="${f.tier === "all"}" data-act="tier" data-id="all">All<span class="n">${state.intel.length}</span></button><span class="grow"></span>${[["rank","By weight"],["time","Timeline"],["new","Newest"]].map(([k, l]) => `<button role="tab" aria-selected="${f.fmode === k}" data-act="fmode" data-id="${k}">${l}</button>`).join("")}</div>
  <div class="filters"><label class="f wide"><span>Search</span><input type="search" data-filter="q" value="${esc(f.q)}" placeholder="text, source or tag"></label><label class="f"><span>Kind</span><select data-filter="kind"><option value="">All</option>${KINDS.map(([v, l]) => `<option value="${v}" ${f.kind === v ? "selected" : ""}>${l}</option>`).join("")}</select></label><label class="f"><span>Confidence</span><select data-filter="conf"><option value="">Any</option>${CONF.map(([v, l]) => `<option value="${v}" ${f.conf === v ? "selected" : ""}>${l}</option>`).join("")}</select></label><label class="f wide"><span>On line</span><select data-filter="line"><option value="">Any</option><option value="__none" ${f.line === "__none" ? "selected" : ""}>Unmatched only</option>${state.lines.map((l, i) => `<option value="${l.id}" ${f.line === l.id ? "selected" : ""}>${L(i)} — ${esc(l.text.slice(0, 40))}</option>`).join("")}</select></label></div>
  <div class="facts"><div class="panel"><div class="ph"><h3>${rows.length} shown</h3><span class="k">${f.fmode === "rank" ? "weight = links × confidence" : f.fmode === "time" ? "dated first" : "newest first"}</span></div><div>${rows.slice(0, 120).map(it => factHTML(it, maxW)).join("") || '<div class="pb hint">Nothing matches.</div>'}</div>${rows.length > 120 ? `<div class="pb hint">${rows.length - 120} more — narrow the filter.</div>` : ""}</div>
  <div style="display:grid; gap:16px"><div class="panel"><div class="ph"><h3>Unmatched</h3></div><div class="pb"><div class="tile" style="padding:8px 12px"><div class="v">${state.intel.filter(i => !(i.links || []).length).length}</div><div class="s">facts not yet bound to a line. Match them and they start scoring.</div></div><div class="row" style="margin-top:8px"><button class="btn sm" data-act="filter-unmatched">Show unmatched</button></div></div></div>
  <div class="panel"><div class="ph"><h3>Sources</h3><span class="k">by weight</span></div><div class="feed">${sourceRank().slice(0, 10).map(s => `<div class="fi"><span class="dot statement"></span><span>${esc(s.source)}<div class="m">${s.n} facts · weight ${s.w}${s.when ? " · " + s.when : ""}</div></span></div>`).join("")}</div></div></div></div>`;
}
function sourceRank() { const g = new Map(); state.intel.forEach(it => { const k = (it.source || "Unsourced").trim(); if (!g.has(k)) g.set(k, { source:k, n:0, w:0, when:"" }); const x = g.get(k); x.n++; x.w += factWeight(it); const wk = whenKey(it.when) || whenKey(it.source); if (wk && (!x.when || wk < x.when)) x.when = wk; }); return [...g.values()].map(x => ({ ...x, when:x.when ? x.when.slice(0, 4) + (x.when.slice(4, 6) !== "00" ? "-" + x.when.slice(4, 6) : "") : "" })).sort((a, b) => b.w - a.w); }
function factHTML(it, maxW) {
  const w = factWeight(it); return `<div class="fact"><span class="link ${w >= maxW * .6 ? "hot" : ""}">${w}<small>weight</small></span><span><p>${esc(it.text)}</p><div class="row" style="gap:5px"><span class="tag ${it.kind === "statement" ? "gold" : ""}">${esc(KIND_LABEL[it.kind] || it.kind)}</span><span class="tag ${it.conf === "confirmed" ? "ok" : it.conf === "disputed" ? "bad" : ""}">${esc(CONF_LABEL[it.conf] || "")}</span>${it.source ? `<span class="tag">${esc(it.source)}${it.when ? " · " + esc(it.when) : ""}</span>` : ""}${(it.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join("")}${(it.links || []).map(k => `<button class="lnk ${k.stance}" data-act="lab-line" data-id="${k.lineId}" title="${esc(k.why || "")}">${k.stance === "contradicts" ? "✕" : "→"} ${lineNo(k.lineId)}</button>`).join("")}</div></span><span class="acts"><button class="btn sm" data-act="match" data-id="${it.id}">Match</button><button class="btn sm ghost" data-act="edit-fact" data-id="${it.id}">Edit</button><button class="btn sm ghost bad" data-act="del-fact" data-id="${it.id}">✕</button></span></div>`;

/* ================= Map ================= */
const STATE_STATUS = [["open","Open"],["inplay","In play"],["hot","Hot"],["active","Active — my solve"],["fringe","Fringe"],["eliminated","Eliminated"],["offmap","Off the map"]];
function viewMap() {
  const o = state.overlays, rk = ranked(), sel = solveById(state.sel.site) || solveById(state.sel.solve);
  const st = state.mapStates[state.sel.state] || { status:"open", note:"" }; const stName = (STATES.find(s => s[0] === state.sel.state) || ["", ""])[1];
  const sites = rk.map(({ c, s }) => ({ c, s, p:parseCoords(c.coords) })).filter(x => x.p);
  const hatch = `<defs><pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="var(--g2)"/><line x1="0" y1="0" x2="0" y2="3" stroke="var(--bad)" stroke-width=".8" opacity=".6"/></pattern></defs>`;
  const states = STATES.map(([id, name, pts, off]) => { const m = state.mapStates[id] || {}; const cls = off ? "st-offmap" : "st-" + (m.status || "open"); return `<path class="st ${cls} ${id === state.sel.state ? "sel" : ""}" d="${poly(pts)}" data-state="${id}"><title>${name}</title></path>`; }).join("");
  const labels = STATES.map(([id, name, pts, off]) => { const c = LABEL_AT[id] ? PX(LABEL_AT[id][0], LABEL_AT[id][1]) : centroid(pts); const m = state.mapStates[id] || {}; if (id === "AK") return `<text class="lbl dim" x="${c[0]}" y="${+c[1] + 3}">AK</text><text class="lbl2 dim" x="${c[0]}" y="${+c[1] + 9}">${esc((m.status && m.status !== "open") ? STATE_STATUS.find(s => s[0] === m.status)[1] : "inset")}</text>`; return `<text class="lbl ${off ? "dim" : ""}" x="${c[0]}" y="${+c[1] + 3}">${id}</text>${!off && o.labels && m.status && m.status !== "open" ? `<text class="lbl2 ${m.status === "eliminated" ? "warn" : ""}" x="${c[0]}" y="${+c[1] + 9}">${esc(STATE_STATUS.find(s => s[0] === m.status)[1])}</text>` : ""}`; }).join("");
  const grat = [35, 40, 45].map(la => `<line x1="0" x2="330" y1="${PX(la, 0)[1]}" y2="${PX(la, 0)[1]}" stroke="var(--line)" stroke-width=".3" stroke-dasharray="1 2"/><text class="grat" x="2" y="${+PX(la, 0)[1] - 1}">${la}°N</text>`).join("") + [-120, -110, -100].map(lo => `<line y1="0" y2="250" x1="${PX(0, lo)[0]}" x2="${PX(0, lo)[0]}" stroke="var(--line)" stroke-width=".3" stroke-dasharray="1 2"/><text class="grat" x="${+PX(0, lo)[0] + 1}" y="247">${-lo}°W</text>`).join("");
  const fenn = o.fenn ? `<path class="fenn" d="${poly(FENN_MAP)}"/><text class="fennlbl" x="${PX(49.4, -110)[0]}" y="${PX(49.4, -110)[1]}" text-anchor="middle">FENN 2013 MAP · MT WY CO NM</text>` : "";
  const cut = o.cutoff ? (() => { const lat = 35.69 - 75 / 69; const [x1, y] = PX(lat, -109.05), [x2] = PX(lat, -103); return `<line class="cutoff" x1="${x1}" x2="${x2}" y1="${y}" y2="${y}"/><text class="lbl2 warn" x="${(+x1 + +x2) / 2}" y="${+y - 2}">Santa Fe −75 mi</text>`; })() : "";
  const rings = o.rings ? FENN_SITES.map(([n, la, lo]) => { const [cx, cy] = PX(la, lo); return `<ellipse class="ring2" cx="${cx}" cy="${cy}" rx="${75 / 69 / Math.cos(rad(la)) * 10}" ry="${75 / 69 * 13}"/>`; }).join("") : "";
  const route = o.route && sel ? (() => { const pins = solvePins(sel); if (pins.length < 2) return ""; return `<polyline class="routeline" points="${pins.map(p => PX(p.p[0], p.p[1]).join(",")).join(" ")}"/>`; })() : "";
  const marks = sites.map(({ c, s, p }) => { const [x, y] = PX(p[0], p[1]); const isSel = sel && sel.id === c.id; return `<g class="site ${s.ruledOut ? "out" : "live"} ${isSel ? "sel" : ""}" data-site="${c.id}"><circle class="dot" cx="${x}" cy="${y}" r="${isSel ? 2.6 : 1.9}"/>${o.sitelabels || isSel ? `<text x="${+x + 3}" y="${+y - 2}">${esc(shortName(c).slice(0, 22))}</text>` : ""}<title>${esc(c.name)} · ${s.ruledOut ? "out" : "score " + s.score}</title></g>`; }).join("");
  const svg = `<svg viewBox="0 0 330 250" role="img" aria-label="Search-area map">${hatch}${grat}${states}${rings}${fenn}${cut}${labels}${route}${marks}</svg>`;
  const togs = [["fenn","Fenn map"],["cutoff","Santa Fe cutoff"],["rings","75-mi Fenn rings"],["route","Solve route"],["labels","State labels"],["sitelabels","Site labels"]].map(([k, l]) => `<button class="tog ${o[k] ? "on" : ""}" data-act="ov" data-id="${k}">${l}</button>`).join("");

function localSheet(c) {
  const pins = solvePins(c); if (!pins.length) return `<div class="panel"><div class="pb hint">${esc(shortName(c))} has no coordinates yet. Add “lat, lon” to a slot in the solve room and the local sheet draws itself.</div></div>`;
  const s3 = pins.find(p => p.l && p.l.stanza === 3) || pins[0], s4 = pins.find(p => p.l && p.l.stanza === 4) || pins[pins.length - 1];
  const rays = [20, 200].map(b => ({ b, end:destination(s3.p, b, 8) }));
  const all = pins.map(p => p.p).concat(rays.map(r => r.end));
  let lat0 = Math.min(...all.map(p => p[0])), lat1 = Math.max(...all.map(p => p[0])), lon0 = Math.min(...all.map(p => p[1])), lon1 = Math.max(...all.map(p => p[1]));
  const padLat = Math.max(.06, (lat1 - lat0) * .18), padLon = Math.max(.08, (lon1 - lon0) * .18); lat0 -= padLat; lat1 += padLat; lon0 -= padLon; lon1 += padLon;
  const W = 640, H = 420, cosl = Math.cos(rad((lat0 + lat1) / 2)); const sx = W / ((lon1 - lon0) * cosl), sy = H / (lat1 - lat0), sc = Math.min(sx, sy);
  const X = lo => ((lo - lon0) * cosl * sc + (W - (lon1 - lon0) * cosl * sc) / 2).toFixed(1), Y = la => (H - ((la - lat0) * sc) - (H - (lat1 - lat0) * sc) / 2).toFixed(1);
  const mileR = sc / 69; // 1 mile in px (degrees lat per mile = 1/69)
  const grid = []; const step = (lat1 - lat0) > .6 ? .25 : .1; for (let la = Math.ceil(lat0 / step) * step; la < lat1; la += step) grid.push(`<line class="gridl" x1="0" x2="${W}" y1="${Y(la)}" y2="${Y(la)}"/><text class="gl" x="4" y="${+Y(la) - 3}">${la.toFixed(2)}</text>`); for (let lo = Math.ceil(lon0 / step) * step; lo < lon1; lo += step) grid.push(`<line class="gridl" y1="0" y2="${H}" x1="${X(lo)}" x2="${X(lo)}"/><text class="gl" x="${+X(lo) + 3}" y="${H - 6}">${lo.toFixed(2)}</text>`);
  const rt = pins.length > 1 ? `<polyline class="rt" points="${pins.map(p => X(p.p[1]) + "," + Y(p.p[0])).join(" ")}"/>` : "";
  const rayHTML = rays.map(r => `<line class="ray" x1="${X(s3.p[1])}" y1="${Y(s3.p[0])}" x2="${X(r.end[1])}" y2="${Y(r.end[0])}"/><text class="raylbl" x="${+X(r.end[1]) + 4}" y="${+Y(r.end[0]) + 3}">${r.b}°</text>`).join("");
  const mile = `<circle class="mile" cx="${X(s4.p[1])}" cy="${Y(s4.p[0])}" r="${mileR.toFixed(1)}"/>`;
  const pinHTML = pins.map(p => `<circle class="pin ${p.l && p.l.stanza === 4 ? "s4" : ""}" cx="${X(p.p[1])}" cy="${Y(p.p[0])}" r="5"/><text class="pl" x="${+X(p.p[1]) + 8}" y="${+Y(p.p[0]) + 4}">${p.l ? lineNo(p.l.id) + " " : ""}${esc((p.s.place || "").slice(0, 28))}</text>`).join("");
  const scaleMi = mileR * 5 > 120 ? 1 : 5; const scale = `<line class="scale" x1="${W - 20 - mileR * scaleMi}" x2="${W - 20}" y1="${H - 18}" y2="${H - 18}"/><text class="sl" x="${W - 20}" y="${H - 24}" text-anchor="end">${scaleMi} mi</text>`;
  let legs = "", total = 0; for (let i = 1; i < pins.length; i++) { const d = haversine(pins[i - 1].p, pins[i].p); total += d; legs += `<tr><td>${pins[i - 1].l ? lineNo(pins[i - 1].l.id) : "•"} → ${pins[i].l ? lineNo(pins[i].l.id) : "•"} <span class="hint">${esc((pins[i - 1].s.place || "").slice(0, 18))} → ${esc((pins[i].s.place || "").slice(0, 18))}</span></td><td class="n">${d.toFixed(1)} mi · ${Math.round(bearing(pins[i - 1].p, pins[i].p))}°</td></tr>`; }
  const fennD = Math.min(...FENN_SITES.map(f => haversine(s4.p, [f[1], f[2]])));
  return `<div class="panel local"><div class="ph"><h3>Local sheet · ${esc(shortName(c))}</h3><span class="k">rays from ${s3.l ? lineNo(s3.l.id) : "anchor"} · mile circle on ${s4.l ? lineNo(s4.l.id) : "last pin"}</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block">${grid.join("")}${mile}${rt}${rayHTML}${pinHTML}${scale}</svg>
  <div class="pb legs"><table>${legs}<tr><td><b>Route total</b> · ${pins.length} pins</td><td class="n"><b>${total.toFixed(1)} mi</b></td></tr><tr><td>Nearest Fenn-search site to the last pin</td><td class="n" style="color:${fennD <= 75 ? "var(--ok)" : "var(--bad)"}">${fennD.toFixed(0)} mi ${fennD <= 75 ? "· inside 75" : "· outside 75"}</td></tr></table><div class="hint" style="margin-top:6px">“Not a great distance” and “within a mile of the car” are checked here, not argued. Coordinates are as typed in the slots — verify on a quad before you drive.</div></div></div>`;
}

function fieldPlan(c) {

  saveFile((shortName(c).replace(/[^A-Za-z0-9]+/g, "-").toLowerCase() || "solve") + "-field-plan.md", out);

function snapshot() { return { format:"maps-edge-workbench/3", exportedAt:new Date().toISOString(), poem:{ title:state.poemTitle, raw:state.poemRaw, lines:state.lines }, intel:state.intel, candidates:state.solves, readings:state.readings, mapStates:state.mapStates }; }
async function saveFile(filename, data) { if (!downloads) { try { await navigator.clipboard.writeText(data); toast("Downloads unavailable — copied to clipboard."); } catch (e) { toast("Downloads unavailable here."); } return; } try { await downloads.save({ filename, data }); toast("Saved " + filename); } catch (e) { if (e && e.code !== "declined") toast("Could not save: " + (e.message || e.code)); } }

function brief() {

/* ================= command palette ================= */
function palette(open) { const p = document.getElementById("pal"); p.hidden = !open; if (open) { const i = document.getElementById("palIn"); i.value = ""; palResults(""); i.focus(); } }
function palResults(q) {
  const n = norm(q); const res = [];
  state.solves.forEach(c => { if (!n || norm(c.name + " " + (c.region || "")).includes(n)) res.push({ k:"solve", t:c.name, s:(strength(c).ruledOut ? "ruled out" : "score " + strength(c).score), go:() => { state.sel.solve = c.id; state.route = "solves"; } }); });
  state.lines.forEach((l, i) => { if (!n || norm(l.text).includes(n)) res.push({ k:L(i), t:l.text, s:"poem line", go:() => { state.sel.line = l.id; state.route = "lab"; } }); });
  GATES.forEach(g => { if (n && norm(g[1]).includes(n)) res.push({ k:"gate", t:g[1], s:g[2], go:() => { state.route = "gate"; } }); });
  if (n) rankedFacts(state.intel.filter(it => norm(it.text + " " + (it.source || "")).includes(n))).slice(0, 12).forEach(it => res.push({ k:"fact", t:it.text.slice(0, 120), s:(KIND_LABEL[it.kind] || it.kind) + (it.source ? " · " + it.source : ""), go:() => { state.filter.q = q; state.filter.tier = "all"; state.route = "facts"; } }));
  VIEWS.forEach(([id, label]) => { if (n && norm(label).includes(n)) res.push({ k:"view", t:label, s:"", go:() => { state.route = id; } }); });
  const el = document.getElementById("palRes"); el.innerHTML = res.slice(0, 18).map((r, i) => `<div class="pr ${i === 0 ? "act" : ""}" data-i="${i}"><span class="k">${esc(r.k)}</span><span><div class="t">${esc(r.t)}</div>${r.s ? `<div class="s">${esc(r.s)}</div>` : ""}</span></div>`).join("") || '<div class="pr"><span class="k"></span><span class="s">No matches.</span></div>';
  el.querySelectorAll(".pr[data-i]").forEach(d => d.addEventListener("click", () => { res[+d.dataset.i].go(); palette(false); render(); }));
  el._res = res;
}

function wire() {
  const view = document.getElementById("view");
  view.querySelectorAll("[data-route]").forEach(b => b.addEventListener("click", () => { if (b.dataset.act) return; state.route = b.dataset.route; render(); }));
  view.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", ev => { const a = b.dataset.act, id = b.dataset.id; ev.stopPropagation();
    if (a === "clear-demo") { leaveDemo(); render(); }
    else if (a === "open-solve") { state.sel.solve = id; state.route = "solves"; render(); renderDrawerCtx(); }
    else if (a === "new-solve") solveDialog(null);
    else if (a === "edit-solve") solveDialog(solveById(id));
    else if (a === "del-solve") { const c = solveById(id); if (c && confirm("Delete " + c.name + "?")) { state.solves = state.solves.filter(x => x.id !== id); dropDoc("candidates/" + id); state.sel.solve = null; render(); } }
    else if (a === "verdict") { const c = solveById(id); if (!c) return; const v = c.verdicts[b.dataset.line]; c.verdicts[b.dataset.line] = v === "fit" ? "fail" : v === "fail" ? undefined : "fit"; if (!c.verdicts[b.dataset.line]) delete c.verdicts[b.dataset.line]; saveSolve(c); render(); }
    else if (a === "gate") { const c = solveById(id); if (!c) return; const v = c.gates[b.dataset.gate]; c.gates[b.dataset.gate] = v === "pass" ? "fail" : v === "fail" ? undefined : "pass"; if (!c.gates[b.dataset.gate]) delete c.gates[b.dataset.gate]; saveSolve(c); render(); }
    else if (a === "gate-out") { state.gateShowOut = !state.gateShowOut; render(); }
    else if (a === "judge-solve") { buildDeck(id || null); state.route = "gate"; render(); }
    else if (a === "deck") deckAnswer(b.dataset.v);
    else if (a === "deck-all") { buildDeck(null); render(); }
    else if (a === "compare-toggle") { const i = state.compare.indexOf(id); if (i >= 0) state.compare.splice(i, 1); else { if (state.compare.length >= 3) state.compare.shift(); state.compare.push(id); } render(); }
    else if (a === "compare-open") compareDialog();
    else if (a === "compare-top3") { state.compare = TOP3.solves.map(s => s.candidate).filter(id => solveById(id)); if (state.compare.length >= 2) compareDialog(); else toast("Top 3 candidates are not in the store yet."); }

    else if (a === "map-solve") { state.sel.site = id; state.sel.solve = id; state.route = "map"; render(); }
    else if (a === "ai-stress") aiStress(solveById(id), b);
    else if (a === "ai-fill") aiFill(solveById(id), b);
    else if (a === "ai-readings") aiReadings(lineById(id), b);
    else if (a === "ai-ingest") aiIngestDialog();

    else if (a === "lab-word") { state.sel.word = state.sel.word === +id ? null : +id; render(); }
    else if (a === "toggle-hard") { const l = lineById(id); l.hard = !l.hard; savePoem(); render(); }
    else if (a === "add-fact") factDialog(null);
    else if (a === "add-fact-for") factDialog(null, id);
    else if (a === "edit-fact") factDialog(state.intel.find(x => x.id === id));
    else if (a === "del-fact") { const it = state.intel.find(x => x.id === id); if (it && confirm("Delete this fact?")) { state.intel = state.intel.filter(x => x.id !== id); dropDoc("intel/" + id); _mentionCache.clear(); render(); } }
    else if (a === "match") matchDialog(state.intel.find(x => x.id === id));
    else if (a === "unlink") { const it = state.intel.find(x => x.id === id); if (it) { it.links = (it.links || []).filter(k => k.lineId !== b.dataset.line); saveIntel(it); render(); } }

    else if (a === "edit-poem") poemDialog();
    else if (a === "export") saveFile("maps-edge-export.json", JSON.stringify(snapshot(), null, 2));
    else if (a === "import") importDialog();
    else if (a === "brief") brief();
    else if (a === "wipe") { if (!confirm("Erase the poem, all facts, all solves, readings and the map? Export first.")) return; state.intel.forEach(i => dropDoc("intel/" + i.id)); state.solves.forEach(c => dropDoc("candidates/" + c.id)); state.readings.forEach(r => dropDoc("readings/" + r.id)); dropDoc("poem/doc"); dropDoc("map/states"); Object.assign(state, { poemTitle:"", poemRaw:"", lines:[], intel:[], solves:[], readings:[], mapStates:{}, usingDemo:false }); render(); toast("Erased."); }
    else if (a === "ai-clear") { state.chat = []; renderDrawer(); }
    else if (a === "ai-close") openDrawer(false);
  }));
  view.querySelectorAll("[data-filter]").forEach(el => el.addEventListener(el.tagName === "INPUT" ? "input" : "change", () => { state.filter[el.dataset.filter] = el.value; if (el.tagName === "INPUT") { const pos = el.selectionStart; render(); const n = document.querySelector('[data-filter="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } else render(); }));
  view.querySelectorAll("[data-status]").forEach(el => el.addEventListener("change", () => { const l = lineById(el.dataset.status); l.status = el.value; savePoem(); render(); }));
  view.querySelectorAll("[data-kind]").forEach(el => el.addEventListener("change", () => { const l = lineById(el.dataset.kind); l.kind = el.value; savePoem(); }));
  view.querySelectorAll("[data-note]").forEach(el => el.addEventListener("change", () => { const l = lineById(el.dataset.note); l.note = el.value; savePoem(); }));
  view.querySelectorAll("[data-mapstatus]").forEach(el => el.addEventListener("change", () => { const id = el.dataset.mapstatus; state.mapStates[id] = { ...(state.mapStates[id] || {}), status:el.value }; saveMap(); render(); }));
  view.querySelectorAll("[data-mapnote]").forEach(el => el.addEventListener("change", () => { const id = el.dataset.mapnote; state.mapStates[id] = { ...(state.mapStates[id] || {}), note:el.value }; saveMap(); }));
  view.querySelectorAll(".st[data-state]").forEach(el => el.addEventListener("click", () => { if (el.classList.contains("st-offmap")) return; state.sel.state = el.dataset.state; render(); }));
  view.querySelectorAll(".site[data-site]").forEach(el => el.addEventListener("click", () => { state.sel.site = el.dataset.site; state.sel.solve = el.dataset.site; render(); }));
  view.querySelectorAll(".slot [data-sf]").forEach(el => el.addEventListener("change", () => { const c = solveById(state.sel.solve); if (!c) return; const lineId = el.closest(".slot").dataset.slot; const s = c.chain[lineId] || {}; s[el.dataset.sf] = el.dataset.sf === "conf" ? +el.value : el.value.trim(); c.chain[lineId] = s; saveSolve(c); _mentionCache.clear(); }));
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-route]"); if (b) { state.route = b.dataset.route; render(); } });
document.getElementById("palBtn").addEventListener("click", () => palette(true));
document.getElementById("pal").addEventListener("click", e => { if (e.target.id === "pal") palette(false); });
document.getElementById("palIn").addEventListener("input", e => palResults(e.target.value));
document.getElementById("palIn").addEventListener("keydown", e => { const el = document.getElementById("palRes"); const rows = [...el.querySelectorAll(".pr[data-i]")]; let i = rows.findIndex(r => r.classList.contains("act")); if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); rows[i] && rows[i].classList.remove("act"); i = (i + (e.key === "ArrowDown" ? 1 : -1) + rows.length) % rows.length; rows[i] && rows[i].classList.add("act"); } else if (e.key === "Enter" && rows[i]) { el._res[+rows[i].dataset.i].go(); palette(false); render(); } else if (e.key === "Escape") palette(false); });
document.getElementById("aiBtn").addEventListener("click", () => openDrawer(!document.getElementById("stage").classList.contains("drawer-open")));
document.getElementById("drawer").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b) return; if (b.dataset.act === "ai-clear") { state.chat = []; renderDrawer(); } if (b.dataset.act === "ai-close") openDrawer(false); });
document.getElementById("themeBtn").addEventListener("click", () => { const r = document.documentElement; const cur = r.getAttribute("data-theme"); const next = cur === "light" ? "dark" : cur === "dark" ? "" : (matchMedia("(prefers-color-scheme: light)").matches ? "dark" : "light"); if (next) r.setAttribute("data-theme", next); else r.removeAttribute("data-theme"); try { localStorage.setItem("hq-theme", next); } catch (e) {} });
try { const t = localStorage.getItem("hq-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palette(document.getElementById("pal").hidden); return; }
  if (e.target.matches("input, textarea, select") || document.getElementById("dlg").open || !document.getElementById("pal").hidden) return;
  if (state.route === "gate" && ["1","2","3"].includes(e.key)) { deckAnswer(["pass","fail","skip"][+e.key - 1]); return; }
  const i = ["q","w","e","r","t","y","u","i"].indexOf(e.key.toLowerCase()); if (i >= 0 && !e.metaKey && !e.ctrlKey && !e.altKey) { state.route = VIEWS[i][0]; render(); }
});
/* ================= boot ================= */
loadDemoIfEmpty(); render(); renderDrawer();
if (window.claude && typeof window.claude.use === "function") connect(); else setSync("off", "local only — export to keep");

</script>
