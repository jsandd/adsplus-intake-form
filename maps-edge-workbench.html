<title>Map's Edge Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">

<style>
/* ============================== tokens ============================== */
:root{
  --ground:#EFF1EC; --surface:#FFFFFF; --surface-2:#E6EAE1; --surface-3:#DCE2D6;
  --ink:#1B241F; --ink-2:#4C5851; --ink-3:#7A867E;
  --rule:#CDD5C8; --rule-2:#B4BFAE;
  --contour:#9A6435; --contour-soft:#E4D3C1;
  --accent:#1F6F8B; --accent-ink:#FFFFFF; --accent-soft:#D9E8ED;
  --fit:#2E7D4F; --fit-soft:#D8EADF; --unk:#A97417; --unk-soft:#F2E6CC; --fail:#B0392C; --fail-soft:#F3DBD7;
  --shadow:0 1px 2px rgba(27,36,31,.07), 0 6px 18px -10px rgba(27,36,31,.22);
  --shadow-lift:0 2px 4px rgba(27,36,31,.09), 0 14px 34px -14px rgba(27,36,31,.32);
  --f-display:"Bitter",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:3px; --r-md:5px; --r-lg:8px; --rail:228px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131A18; --surface:#1B2320; --surface-2:#232D29; --surface-3:#2C3833;
    --ink:#DEE6E0; --ink-2:#A6B3AB; --ink-3:#7B887F; --rule:#2F3B36; --rule-2:#3F4D47;
    --contour:#C89463; --contour-soft:#3A2E24; --accent:#6BB8D6; --accent-ink:#0E1A1F; --accent-soft:#1D3138;
    --fit:#63BA86; --fit-soft:#1B2E23; --unk:#D7A73F; --unk-soft:#302716; --fail:#E2705F; --fail-soft:#331E1B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 14px 34px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#131A18; --surface:#1B2320; --surface-2:#232D29; --surface-3:#2C3833;
  --ink:#DEE6E0; --ink-2:#A6B3AB; --ink-3:#7B887F; --rule:#2F3B36; --rule-2:#3F4D47;
  --contour:#C89463; --contour-soft:#3A2E24; --accent:#6BB8D6; --accent-ink:#0E1A1F; --accent-soft:#1D3138;
  --fit:#63BA86; --fit-soft:#1B2E23; --unk:#D7A73F; --unk-soft:#302716; --fail:#E2705F; --fail-soft:#331E1B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 14px 34px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--f-ui); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ============================== shell ============================== */
.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}
.rail{background:var(--surface); border-right:1px solid var(--rule); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:auto}
.brand{padding:16px 18px 14px; border-bottom:1px solid var(--rule); position:relative; overflow:hidden}
.brand::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='120' viewBox='0 0 240 120'><g fill='none' stroke='%239A6435' stroke-width='1' opacity='.34'><path d='M-10 96 C 40 74, 92 108, 150 82 S 236 52, 260 66'/><path d='M-10 80 C 44 58, 96 92, 152 66 S 238 38, 262 50'/><path d='M-10 64 C 48 44, 100 76, 154 50 S 240 24, 264 34'/><path d='M-10 48 C 52 30, 104 60, 156 34 S 242 10, 266 18'/></g></svg>");
  background-position:right -30px bottom -18px; background-repeat:no-repeat;
}
.brand h1{font-size:17px; line-height:1.15; position:relative; z-index:1}
.brand .sub{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--contour); margin-top:6px; position:relative; z-index:1}
.nav{padding:10px; display:flex; flex-direction:column; gap:2px}
.nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:0; padding:8px 10px; border-radius:var(--r-md); cursor:pointer; color:var(--ink-2); font-weight:500}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft); color:var(--ink); font-weight:600}
.nav .k{font-family:var(--f-mono); font-size:10px; color:var(--ink-3); width:14px}
.nav button[aria-current="page"] .k{color:var(--accent)}
.nav .count{margin-left:auto; font-family:var(--f-mono); font-size:11px; color:var(--ink-3)}
.railstats{margin:auto 10px 10px; display:grid; gap:6px}
.railstat{padding:9px 12px; background:var(--surface-2); border-radius:var(--r-md); display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.railstat .lbl{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.railstat .big{font-family:var(--f-mono); font-size:18px; font-weight:600; font-variant-numeric:tabular-nums}
.syncline{padding:0 10px 12px; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); display:flex; align-items:center; gap:6px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex:none}
.dot.ok{background:var(--fit)} .dot.busy{background:var(--unk)} .dot.off{background:var(--fail)}

.main{min-width:0; padding:22px 26px 64px; max-width:1360px}
.viewhead{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:6px}
.viewhead h2{font-size:23px}
.eyebrow{font-family:var(--f-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--contour)}
.lede{color:var(--ink-2); max-width:66ch; margin:0 0 18px}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.spacer{flex:1 1 auto}
.hint{font-size:12px; color:var(--ink-3)}
.src{font-family:var(--f-mono); font-size:11px; color:var(--ink-3)}

/* ============================== controls ============================== */
.btn{background:var(--surface); border:1px solid var(--rule-2); color:var(--ink); padding:6px 12px; border-radius:var(--r-md); cursor:pointer; font-weight:500; font-size:13px; display:inline-flex; align-items:center; gap:7px; transition:background .12s, border-color .12s}
.btn:hover{background:var(--surface-2); border-color:var(--ink-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.08); background:var(--accent)}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.danger{color:var(--fail)} .btn.danger:hover{background:var(--fail-soft); border-color:var(--fail)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{padding:3px 8px; font-size:12px}
.tog{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:100px; cursor:pointer; border:1px solid var(--rule-2); background:var(--surface); font-family:var(--f-mono); font-size:10.5px; color:var(--ink-2)}
.tog.on{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.tog i{width:8px; height:8px; border-radius:2px; display:inline-block}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--surface); border:1px solid var(--rule-2); color:var(--ink); padding:6px 9px; border-radius:var(--r-md); width:100%; font-size:13px}
textarea{resize:vertical; line-height:1.55}
label.field{display:flex; flex-direction:column; gap:4px; min-width:0}
label.field > span{font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.chip{display:inline-flex; align-items:center; gap:5px; padding:1px 7px; border-radius:100px; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.04em; white-space:nowrap; background:var(--surface-2); color:var(--ink-2); border:1px solid transparent}
.chip.fit{background:var(--fit-soft); color:var(--fit)} .chip.fail{background:var(--fail-soft); color:var(--fail)}
.chip.unk{background:var(--unk-soft); color:var(--unk)} .chip.acc{background:var(--accent-soft); color:var(--accent)}
.chip.demo{background:var(--unk-soft); color:var(--unk); border-color:var(--unk)} .chip.hard{background:var(--contour-soft); color:var(--contour)}
.chip.c3{background:var(--fit-soft); color:var(--fit)} .chip.c2{background:var(--accent-soft); color:var(--accent)} .chip.c1{background:var(--unk-soft); color:var(--unk)}
.bars{display:inline-flex; gap:2px; align-items:flex-end; height:11px}
.bars i{width:3px; background:var(--rule-2); border-radius:1px}
.bars i:nth-child(1){height:5px} .bars i:nth-child(2){height:8px} .bars i:nth-child(3){height:11px}
.bars.c3 i{background:var(--fit)} .bars.c2 i:nth-child(-n+2){background:var(--accent)} .bars.c1 i:nth-child(1){background:var(--unk)} .bars.c0 i{background:var(--fail); opacity:.55}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg); box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.banner{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; margin-bottom:18px; background:var(--unk-soft); border:1px solid var(--unk); border-radius:var(--r-md)}
.banner .t{font-weight:700; font-family:var(--f-display)} .banner p{margin:3px 0 0; color:var(--ink-2); font-size:13px}
.banner .btn{flex:none; white-space:nowrap; background:var(--surface)}
.empty{padding:34px 22px; text-align:center; color:var(--ink-2); border:1px dashed var(--rule-2); border-radius:var(--r-lg)}
.empty h3{font-size:16px; margin-bottom:6px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px} .three{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.kindtag{font-family:var(--f-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); border:1px solid var(--rule); border-radius:3px; padding:0 4px}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--rule); margin-bottom:14px; flex-wrap:wrap}
.tab{background:none; border:0; border-bottom:2px solid transparent; padding:8px 12px; cursor:pointer; color:var(--ink-2); font-weight:500; margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
.tab .n{font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); margin-left:6px}

/* ============================== tables ============================== */
.tablewrap{overflow-x:auto; border:1px solid var(--rule); border-radius:var(--r-lg); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:8px 12px; text-align:left; border-bottom:1px solid var(--rule); vertical-align:top}
thead th{font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); background:var(--surface-2); position:sticky; top:0; z-index:2; font-weight:500; border-bottom:1px solid var(--rule-2)}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums; text-align:right}
.cellbtn{width:100%; min-width:56px; max-width:150px; height:30px; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface-2); cursor:pointer; font-family:var(--f-mono); font-size:11px; color:var(--ink-3)}
.cellbtn:hover{border-color:var(--ink-3)}
.cellbtn.pass,.cellbtn.fit{background:var(--fit-soft); color:var(--fit); border-color:var(--fit)}
.cellbtn.fail{background:var(--fail-soft); color:var(--fail); border-color:var(--fail)}
.meter{height:6px; background:var(--surface-3); border-radius:3px; overflow:hidden; min-width:80px}
.meter i{display:block; height:100%; background:var(--fit)} .meter.low i{background:var(--unk)} .meter.bad i{background:var(--fail)}
.strip{display:grid; grid-template-columns:repeat(20, minmax(0,1fr)); gap:2px}
.strip i{display:block; height:9px; border-radius:1px; background:var(--surface-3)}
.strip i.fit{background:var(--fit)} .strip i.fail{background:var(--fail)} .strip i.hard{outline:1px solid var(--contour); outline-offset:-1px}
.strip i.c1{background:var(--unk)} .strip i.c2{background:var(--accent)} .strip i.c3{background:var(--fit)}

/* ============================== command ============================== */
.tiles{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:18px}
.tile{padding:12px 14px}
.tile .lbl{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.tile .big{font-family:var(--f-mono); font-size:26px; font-weight:600; line-height:1.1; margin-top:4px; font-variant-numeric:tabular-nums}
.tile .foot{font-size:12px; color:var(--ink-2); margin-top:4px}
.cmdgrid{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr); gap:16px; align-items:start}
.bestrow{display:grid; grid-template-columns:40px minmax(0,1.1fr) minmax(0,1fr) auto; gap:10px; padding:8px 14px; border-top:1px solid var(--rule); align-items:baseline; cursor:pointer}
.bestrow:hover{background:var(--surface-2)}
.bestrow .n{font-family:var(--f-mono); font-size:10.5px; color:var(--contour)}
.bestrow .t{font-family:var(--f-display); font-size:14px; line-height:1.4}
.bestrow .place{font-size:13px}
.bestrow .place .who{display:block; font-family:var(--f-mono); font-size:10px; color:var(--ink-3); margin-top:1px}
.bestrow .agree{font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); white-space:nowrap}
.stanzahead{padding:8px 14px 3px; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); border-top:1px solid var(--rule); background:var(--surface-2)}
.stanzahead b{color:var(--contour); font-weight:500}
.list{display:flex; flex-direction:column}
.list .row{padding:9px 14px; border-top:1px solid var(--rule); font-size:13px; line-height:1.45}
.list .row:first-child{border-top:0}
.list .row .who{font-family:var(--f-mono); font-size:10px; color:var(--ink-3); display:block; margin-top:2px}
.list .row .rk{font-family:var(--f-mono); font-size:10px; color:var(--contour); margin-right:6px}
.sechead{display:flex; align-items:baseline; gap:10px; padding:12px 14px 8px}
.sechead h3{font-size:15px} .sechead .n{font-family:var(--f-mono); font-size:11px; color:var(--ink-3)}

/* ============================== solves ============================== */
.solvegrid{display:grid; grid-template-columns:300px minmax(0,1fr); gap:16px; align-items:start}
.solvelist{display:flex; flex-direction:column; gap:4px}
.solverow{display:grid; grid-template-columns:8px minmax(0,1fr) auto; gap:10px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--rule); padding:9px 12px; border-radius:var(--r-md); cursor:pointer}
.solverow:hover{border-color:var(--ink-3)} .solverow.sel{border-color:var(--accent); background:var(--accent-soft)}
.solverow.out{opacity:.65}
.solverow .d{width:8px; height:8px; border-radius:50%; background:var(--fit)} .solverow.out .d{background:var(--fail)}
.solverow .nm{font-size:13px; line-height:1.3} .solverow .rg{font-family:var(--f-mono); font-size:10px; color:var(--ink-3)}
.solverow .sc{font-family:var(--f-mono); font-size:11px; color:var(--ink-2); text-align:right; white-space:nowrap}
.solvehead{display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap}
.solvehead h3{font-size:19px}
.route{display:flex; flex-direction:column}
.stage{border-top:1px solid var(--rule)}
.stagehead{display:flex; gap:10px; align-items:baseline; padding:10px 14px 6px; background:var(--surface-2)}
.stagehead .eyebrow{color:var(--ink-3)} .stagehead .mode{margin-left:auto; font-family:var(--f-mono); font-size:10px; letter-spacing:.08em; color:var(--contour); text-transform:uppercase}
.slot{display:grid; grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 70px 64px 92px; gap:8px; padding:8px 14px; border-top:1px solid var(--rule); align-items:start}
.slot .n{font-family:var(--f-mono); font-size:10.5px; color:var(--contour); padding-top:6px}
.slot .poem{font-family:var(--f-display); font-size:13.5px; line-height:1.4; padding-top:4px}
.slot .poem .cnt{font-family:var(--f-mono); font-size:10px; color:var(--ink-3); margin-left:6px}
.slot input,.slot select{padding:4px 7px; font-size:12.5px}
.slot .sub{margin-top:4px}
.slot .vbtn{width:100%; height:28px; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface-2); cursor:pointer; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3)}
.slot .vbtn.fit{background:var(--fit-soft); color:var(--fit); border-color:var(--fit)} .slot .vbtn.fail{background:var(--fail-soft); color:var(--fail); border-color:var(--fail)}
.slot.hardline .n::after{content:" ●"; color:var(--contour)}
.slothead{display:grid; grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 70px 64px 92px; gap:8px; padding:6px 14px; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); border-top:1px solid var(--rule)}
.gates{display:flex; flex-wrap:wrap; gap:5px}
.gate{border:1px solid var(--rule-2); background:var(--surface-2); color:var(--ink-2); border-radius:100px; cursor:pointer; font-family:var(--f-mono); font-size:10.5px; padding:2px 8px; display:inline-flex; gap:5px; align-items:center}
.gate:hover{border-color:var(--ink-3)} .gate.pass{background:var(--fit-soft); color:var(--fit); border-color:transparent} .gate.fail{background:var(--fail-soft); color:var(--fail); border-color:var(--fail)}
.gate .m{font-weight:600}
.kv{font-size:13px; line-height:1.5}
.kv b{font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--contour); display:block; margin-bottom:2px; font-weight:500}
.cmp td{vertical-align:top} .cmp .pl{font-size:12.5px} .cmp .rd{font-size:11.5px; color:var(--ink-2); margin-top:2px}
.cmp td.c3{background:var(--fit-soft)} .cmp td.c2{background:var(--accent-soft)} .cmp td.c1{background:var(--unk-soft)} .cmp td.vfail{box-shadow:inset 3px 0 0 var(--fail)}

/* ============================== poem ============================== */
.split{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:20px; align-items:start}
.ledger{overflow:hidden}
.stanza{border-bottom:1px solid var(--rule)} .stanza:last-child{border-bottom:0}
.stanza-tag{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); padding:9px 16px 3px}
.pline{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:baseline; padding:9px 16px; width:100%; text-align:left; background:none; border:0; cursor:pointer; border-left:3px solid transparent}
.pline:hover{background:var(--surface-2)} .pline[aria-selected="true"]{background:var(--accent-soft); border-left-color:var(--accent)}
.pline .n{font-family:var(--f-mono); font-size:10.5px; color:var(--contour); letter-spacing:.03em; position:relative}
.pline .t{font-family:var(--f-display); font-size:15.5px; line-height:1.45}
.pline .meta{display:flex; gap:5px; align-items:center; align-self:center}
.pline.cpl-a .n::after,.pline.cpl-b .n::after{content:""; position:absolute; left:-9px; width:3px; background:var(--contour-soft); border-radius:2px}
.pline.cpl-a .n::after{top:6px; bottom:-14px} .pline.cpl-b .n::after{top:-14px; bottom:6px}
.rhyme{font-family:var(--f-mono); font-size:9.5px; color:var(--contour); letter-spacing:.06em; opacity:.85}
.covdots{display:inline-flex; gap:2px} .covdots i{width:5px; height:5px; border-radius:50%; background:var(--accent)} .covdots i.neg{background:var(--fail)}
.panel{position:sticky; top:22px; padding:16px; display:flex; flex-direction:column; gap:14px}
.panel h3{font-size:16px}

const writeTimers = new Map();

/* ================================================================ persistence */

const uid = p => p + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
function setSync(cls, txt) { const d = document.getElementById("syncDot"), t = document.getElementById("syncTxt"); if (d) d.className = "dot " + cls; if (t) t.textContent = txt; }
function queueWrite(path, body) {
  if (!db) { setSync("off", "Local only — not saved"); return; }
  clearTimeout(writeTimers.get(path));
  writeTimers.set(path, setTimeout(async () => {
    setSync("busy", "Saving…");
    try { await db.doc(path).set(body); setSync("ok", "Saved " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})); }
    catch (e) { setSync("off", e && e.code === "quota_exceeded" ? "Store full — export and prune" : "Save failed — export a backup"); }
  }, 350));
}
const savePoem  = () => queueWrite("poem/doc", { title:state.poemTitle, raw:state.poemRaw, lines:state.lines });
const saveIntel = it => queueWrite("intel/" + it.id, it);
const saveSolve = c  => queueWrite("candidates/" + c.id, c);
const saveMap   = () => queueWrite("map/states", { states:state.mapStates });
const dropDoc   = async path => { try { if (db) await db.doc(path).delete(); } catch (e) {} };

async function connect() {
  try { db = await claude.use("db"); } catch (e) { db = null; }
  try { downloads = await claude.use("downloads"); } catch (e) { downloads = null; }
  try { sampler = await claude.use("sample"); } catch (e) { sampler = null; }
  if (!db) { ready = true; setSync("off", "Local only — export to keep"); loadDemoIfEmpty(); render(); return; }
  setSync("busy", "Connecting…");
  db.doc("poem/doc").onSnapshot(snap => {
    if (snap.exists) { const d = snap.data() || {}; state.poemTitle = d.title || ""; state.poemRaw = d.raw || ""; state.lines = Array.isArray(d.lines) ? d.lines.map(l => ({...l})) : []; state.usingDemo = false; }
    afterLoad();
  }, () => setSync("off", "Sync stopped — export a backup"));
  db.doc("map/states").onSnapshot(snap => { if (snap.exists) { const d = snap.data() || {}; state.mapStates = d.states && typeof d.states === "object" ? d.states : {}; } if (ready && state.route === "map") render(); }, () => {});
  db.collection("intel").onSnapshot(snap => { const rows = snap.docs.map(d => ({ id:d.id, ...(d.data() || {}) })); if (rows.length) { state.intel = rows; state.usingDemo = false; } else if (!state.usingDemo) state.intel = []; afterLoad(); }, () => {});
  db.collection("candidates").onSnapshot(snap => { const rows = snap.docs.map(d => ({ id:d.id, ...(d.data() || {}) })); if (rows.length) { state.solves = rows.map(normSolve); state.usingDemo = false; } else if (!state.usingDemo) state.solves = []; afterLoad(); }, () => {});
  setTimeout(afterLoad, 2500);
}
function normSolve(c) { c.verdicts = c.verdicts || {}; c.gates = c.gates || {}; c.chain = c.chain || {}; return c; }
function afterLoad() {
  const empty = !state.lines.length && !state.intel.length && !state.solves.length;
  if (!ready) { ready = true; if (db) setSync("ok", "Synced"); }
  if (empty) loadDemoIfEmpty(); else state.usingDemo = state.usingDemo && empty;
  if (state.selectedSolve && !state.solves.some(c => c.id === state.selectedSolve)) state.selectedSolve = null;
  render();
}
function loadDemoIfEmpty() {
  if (state.lines.length || state.intel.length || state.solves.length) return;
  const d = demoData(); Object.assign(state, d); state.usingDemo = true; state.selectedLine = state.lines[0] ? state.lines[0].id : null;
}
function leaveDemo() { if (!state.usingDemo) return; state.usingDemo = false; state.poemTitle = ""; state.poemRaw = ""; state.lines = []; state.intel = []; state.solves = []; state.selectedLine = null; state.selectedSolve = null; }
const leaveDemoIfNeeded = () => { if (state.usingDemo) leaveDemo(); };

/* ================================================================ parsing */

const norm = s => (s || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const stem = w => w.replace(/(ing|ed|es|s)$/, "");
const tokens = s => norm(s).split(" ").filter(w => w.length > 2 && !STOP.has(w)).map(stem);
function parseLines(raw, previous) {
  const pool = new Map();
  (previous || []).forEach(l => { const k = norm(l.text); if (!pool.has(k)) pool.set(k, []); pool.get(k).push(l); });
  const out = []; let stanza = 1, blank = false;
  raw.split(/\r?\n/).forEach(rawLine => {
    const text = rawLine.trim(); if (!text) { if (out.length) blank = true; return; }
    if (blank) { stanza++; blank = false; }
    const k = norm(text); const reuse = pool.get(k) && pool.get(k).length ? pool.get(k).shift() : null;
    out.push({ id: reuse ? reuse.id : uid("l"), stanza, text, hard: reuse ? !!reuse.hard : false, status: reuse ? (reuse.status || "unsolved") : "unsolved", kind: reuse ? (reuse.kind || "") : "", note: reuse ? (reuse.note || "") : "" });
  });
  return out;
}
function rhymeWord(t) { const w = (t || "").replace(/[—–-]+$/, "").trim().split(/\s+/).pop() || ""; return w.replace(/[^A-Za-z']/g, "").toLowerCase(); }
function parseCoords(s) { const m = /(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/.exec(s || ""); if (!m) return null; const lat = +m[1], lon = +m[2]; if (lat < 25 || lat > 50 || lon > -90 || lon < -126) return null; return [lat, lon]; }
function whenKey(s) {
  if (!s) return "";
  const iso = /(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(s); if (iso) return iso[1] + iso[2] + (iso[3] || "00");
  const m = /(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})?,?\s*(\d{4})/i.exec(s);
  if (m) { const mo = "janfebmaraprmayjunjulaugsepoctnovdec".indexOf(m[1].slice(0,3).toLowerCase()) / 3 + 1; return m[3] + String(mo).padStart(2,"0") + String(m[2] || 0).padStart(2,"0"); }
  const y = /(20\d{2})/.exec(s); return y ? y[1] + "0000" : "";
}
function suggestLines(text, limit) {
  const t = tokens(text); if (!t.length || !state.lines.length) return [];
  const freq = new Map(); state.lines.forEach(l => new Set(tokens(l.text)).forEach(w => freq.set(w, (freq.get(w) || 0) + 1)));
  const N = state.lines.length, seen = new Set(t);
  return state.lines.map(l => { const lt = new Set(tokens(l.text)); let score = 0, hits = []; seen.forEach(w => { if (!lt.has(w)) return; score += (0.6 + Math.log(1 + N / (1 + (freq.get(w) || 0)))) * (LEXICON.has(w) ? 2.2 : 1); hits.push(w); }); return { line:l, score, hits }; })
    .filter(s => s.score > 0).sort((a, b) => b.score - a.score).slice(0, limit || 4);
}

/* ================================================================ derived */

const LN = id => { const i = state.lines.findIndex(l => l.id === id); return i < 0 ? "—" : "L" + String(i + 1).padStart(2, "0"); };
function linksFor(lineId) { const out = []; state.intel.forEach(it => (it.links || []).forEach(k => { if (k.lineId === lineId) out.push({ it, link:k }); })); return out.sort((a, b) => (CONF_RANK[b.it.conf] || 0) - (CONF_RANK[a.it.conf] || 0)); }
function coverage() {
  const total = state.lines.length; if (!total) return { total:0, covered:0, pct:0, contested:0 };
  let covered = 0, contested = 0;
  state.lines.forEach(l => { const ls = linksFor(l.id); if (ls.length) covered++; if (ls.some(x => x.link.stance === "supports") && ls.some(x => x.link.stance === "contradicts")) contested++; });
  return { total, covered, pct:Math.round(covered / total * 100), contested };
}
function scoreSolve(c) {
  const v = c.verdicts || {}, ch = c.chain || {}, g = c.gates || {};
  let fit = 0, fail = 0, hardFail = 0, chainPts = 0, filled = 0;
  state.lines.forEach(l => {
    if (v[l.id] === "fit") fit++; else if (v[l.id] === "fail") { fail++; if (l.hard) hardFail++; }
    const s = ch[l.id]; if (s && (s.place || s.reading)) { filled++; chainPts += Math.max(0, Math.min(3, +s.conf || 0)); }
  });
  const judged = fit + fail, unknown = state.lines.length - judged, pct = judged ? Math.round(fit / judged * 100) : 0;
  let gPass = 0, gFail = 0; GATES.forEach(([id]) => { if (g[id] === "pass") gPass++; else if (g[id] === "fail") gFail++; });
  const gUnk = GATES.length - gPass - gFail;
  /* Composite: how much of the poem is assigned and how confidently, how it verdicts, minus gate damage. */
  const composite = Math.round(chainPts * 2 + (judged ? pct * Math.min(1, judged / 10) * 0.5 : 0) + gPass * 1.5 - gFail * 15 - hardFail * 20);
  return { fit, fail, unknown, judged, pct, hardFail, gPass, gFail, gUnk, filled, chainPts, composite, ruledOut: hardFail > 0 || gFail > 0 };
}
const standing = () => state.solves.filter(c => !scoreSolve(c).ruledOut);
function ranked() { return state.solves.map(c => ({ c, s:scoreSolve(c) })).sort((a, b) => (a.s.ruledOut - b.s.ruledOut) || (b.s.composite - a.s.composite)); }
/* Best assignment per line across standing solves, plus how many standing solves assign anything. */
function bestAssignments() {
  const live = standing();
  return state.lines.map(l => {
    let best = null, agree = 0; const places = new Map();
    live.forEach(c => { const s = (c.chain || {})[l.id]; if (s && (s.place || s.reading)) { agree++; const k = norm(s.place || s.reading); places.set(k, (places.get(k) || 0) + 1); if (!best || (+s.conf || 0) > (+best.s.conf || 0)) best = { c, s }; } });
    const distinct = places.size;
    return { line:l, best, agree, distinct };
  });
}
function nextTests() {
  return ranked().filter(({ c, s }) => !s.ruledOut && c.test && c.test !== "—").slice(0, 8).map(({ c, s }) => ({ c, s }));
}
function statusCounts() { const out = { unsolved:0, thematic:0, partial:0, pinned:0, contested:0 }; state.lines.forEach(l => { out[l.status || "unsolved"] = (out[l.status || "unsolved"] || 0) + 1; }); return out; }

/* ================================================================ render */

const VIEWS = [
  ["command","Command",  () => ""],
  ["solves", "Solves",   () => standing().length + "/" + state.solves.length],
  ["poem",   "Poem",     () => state.lines.length],
  ["facts",  "Facts",    () => state.intel.length],
  ["gate",   "Gate",     () => GATES.length],
  ["map",    "Map",      () => Object.values(state.mapStates).filter(x => x && (x.status === "active" || x.status === "hot")).length || ""],
  ["data",   "Data",     () => ""],
];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));

function render() {
  document.getElementById("nav").innerHTML = VIEWS.map(([id, label, count], i) => `<button data-route="${id}" ${state.route === id ? 'aria-current="page"' : ""}><span class="k">${i + 1}</span><span>${label}</span><span class="count">${count() || ""}</span></button>`).join("");
  const posey = state.intel.filter(i => i.kind === "statement" && (i.conf === "confirmed" || i.conf === "likely")).length;

    <div class="railstat"><span class="lbl">Posey statements</span><span class="big">${posey}</span></div>
    <div class="railstat"><span class="lbl">Solves standing</span><span class="big">${standing().length}<span class="src">/${state.solves.length}</span></span></div>
    <div class="railstat"><span class="lbl">Lines placed ≥2</span><span class="big">${confident}<span class="src">/${state.lines.length}</span></span></div>`;
  const fn = { command:viewCommand, solves:viewSolves, poem:viewPoem, facts:viewFacts, gate:viewGate, map:viewMap, data:viewData }[state.route] || viewCommand;

}
function demoBanner() {
  if (!state.usingDemo) return "";
  return `<div class="banner"><div><div class="t">Worked example — none of this is from the real hunt</div><p>Placeholders so the pieces make sense. Paste the real poem or add your first fact and they clear themselves.</p></div><div class="spacer"></div><button class="btn sm" data-act="clear-demo">Clear examples</button></div>`;
}
const head = (n, title, right = "") => `<div class="viewhead"><div><div class="eyebrow">Section ${n}</div><h2>${title}</h2></div><div class="spacer"></div>${right}</div>`;

/* ---------------------------------------------------------------- command */

function viewCommand() {
  if (!state.lines.length) return head(1, "Command") + `<div class="empty"><h3>No poem yet</h3><p>Paste it once; everything else hangs off the lines.</p><button class="btn primary" data-act="edit-poem">Paste the poem</button></div>`;

  const confirmed = posey.filter(i => i.conf === "confirmed").length;
  const questions = state.intel.filter(i => i.kind === "question").slice(-6).reverse();
  const objections = state.intel.filter(i => i.kind === "objection").sort((a, b) => (b.created || 0) - (a.created || 0)).slice(0, 5);
  const latest = [...state.intel].sort((a, b) => (b.created || 0) - (a.created || 0)).slice(0, 6);

    </div>

/* ---------------------------------------------------------------- solves */

function viewSolves() {
  const rk = ranked();
  if (!rk.length) return head(2, "Solves", `<button class="btn primary" data-act="add-solve">New solve</button>`) + `<div class="empty"><h3>No solves yet</h3><p>A solve is a chain: each poem line assigned to a place, in order, checked against Posey's statements.</p></div>`;
  const sel = state.solves.find(c => c.id === state.selectedSolve) || rk[0].c; state.selectedSolve = sel.id;
  const list = rk.map(({ c, s }) => `<button class="solverow ${s.ruledOut ? "out" : ""} ${c.id === sel.id ? "sel" : ""}" data-solve="${c.id}"><span class="d"></span><span><div class="nm">${esc(c.name)}</div><div class="rg">${esc(c.region || "")}</div></span><span class="sc">${s.filled}/${state.lines.length} placed<br>${s.gFail ? s.gFail + " gate ✕" : s.gPass + " gate ✓"} · ${s.composite}</span></button>`).join("");

    <p class="lede">Each solve is a route through the poem. Fill the slots as you go — a place, your reading of it, how sure you are — and mark each line fit or fail. The gate row is Posey's hard statements; one failure rules the solve out whatever its poem score.</p>

function solveDetail(c) {
  const s = scoreSolve(c), g = c.gates || {}, ch = c.chain || {}, v = c.verdicts || {};

  let route = "", stanza = 0;
  state.lines.forEach((l, i) => {

function intelCard(it) {

function timelineHTML(rows) {

      <div class="toolbar" style="margin:10px 0 0"><button class="btn sm" data-act="open-solve" data-solve="${site.id}">Open solve</button></div></div>`; })() : `<div class="card"><div class="eyebrow">Solve</div><div class="hint" style="margin-top:6px">Click a marker or a site in the list.</div></div>`;

function snapshot() { return { format:"maps-edge-workbench/2", exportedAt:new Date().toISOString(), poem:{ title:state.poemTitle, raw:state.poemRaw, lines:state.lines }, intel:state.intel, candidates:state.solves, mapStates:state.mapStates }; }
async function doExport() {
  const json = JSON.stringify(snapshot(), null, 2), filename = "maps-edge-" + new Date().toISOString().slice(0, 10) + ".json";
  if (!downloads) { copy(json, "Downloads unavailable here — JSON is on your clipboard."); return; }
  try { await downloads.save({ filename, data:json }); toast("Saved " + filename); } catch (e) { if (e && e.code === "declined") return; copy(json, "Could not save — JSON is on your clipboard."); }
}
function doImport(file) {
  const r = new FileReader();
  r.onload = () => { let d; try { d = JSON.parse(String(r.result)); } catch (e) { toast("Not valid JSON."); return; } if (!d || !d.poem) { toast("Not a workbench export."); return; } leaveDemo();
    state.poemTitle = d.poem.title || ""; state.poemRaw = d.poem.raw || ""; state.lines = Array.isArray(d.poem.lines) ? d.poem.lines : parseLines(state.poemRaw, []); state.intel = Array.isArray(d.intel) ? d.intel : []; state.solves = (Array.isArray(d.candidates) ? d.candidates : []).map(normSolve); state.mapStates = d.mapStates && typeof d.mapStates === "object" ? d.mapStates : {};
    state.selectedLine = state.lines[0] ? state.lines[0].id : null; savePoem(); saveMap(); state.intel.forEach(saveIntel); state.solves.forEach(saveSolve); toast(`Imported ${state.lines.length} lines, ${state.intel.length} facts, ${state.solves.length} solves`); render(); };
  r.readAsText(file);
}
function brief() {
  const c = coverage(); let out = `# ${state.poemTitle || "Treasure solve board"}\n\n`;
  const ba = bestAssignments();
  out += `## Best current read\n\n` + ba.map((b, i) => `L${String(i+1).padStart(2,"0")} ${b.line.text}\n  → ${b.best ? `${b.best.s.place || b.best.s.reading} (${b.best.c.name}; sure ${b.best.s.conf || "—"})` : "unplaced"}${b.agree > 1 ? ` · ${b.agree} solves, ${b.distinct} distinct reads` : ""}`).join("\n") + "\n\n";
  out += `## Solves\n\n`;
  ranked().forEach(({ c, s }) => { out += `### ${c.name}${s.ruledOut ? " — RULED OUT" : ""}\n${[c.region, c.coords, c.elev].filter(Boolean).join(" · ")}\nPlaced ${s.filled}/${state.lines.length} · fit ${s.fit} · fail ${s.fail} · gate ${s.gPass}✓ ${s.gFail}✕ · score ${s.composite}\n`; if (c.notes) out += `${c.notes}\n`; const gf = GATES.filter(([id]) => (c.gates || {})[id] === "fail").map(([, t]) => t); if (gf.length) out += `Gate failures: ${gf.join("; ")}\n`; if (c.kill) out += `Would kill it: ${c.kill}\n`; if (c.test) out += `Cheapest test: ${c.test}\n`;
    state.lines.forEach((l, i) => { const sl = (c.chain || {})[l.id]; if (sl && (sl.place || sl.reading)) out += `- L${String(i+1).padStart(2,"0")}: ${sl.place || ""}${sl.reading ? " — " + sl.reading : ""} (sure ${sl.conf || "—"}${(c.verdicts||{})[l.id] ? ", " + c.verdicts[l.id] : ""})\n`; }); out += "\n"; });
  out += `## Poem, facts by line (${c.covered}/${c.total} lines covered)\n\n`;
  state.lines.forEach((l, i) => { out += `**L${String(i+1).padStart(2,"0")}${l.hard ? " (HARD)" : ""}** — ${l.text}  _${STATUS_LABEL[l.status] || "Unsolved"}_\n`; if (l.note) out += `- Note: ${l.note}\n`; linksFor(l.id).forEach(x => { out += `- ${x.link.stance === "contradicts" ? "AGAINST" : "SUPPORTS"} [${CONF_LABEL[x.it.conf] || "?"}] ${x.it.text}${x.it.source ? ` (${x.it.source}${x.it.when ? ", " + x.it.when : ""})` : ""}${x.link.why ? ` — ${x.link.why}` : ""}\n`; }); out += "\n"; });
  const un = state.intel.filter(i => !(i.links || []).length); if (un.length) out += `## Unmatched facts (${un.length})\n\n` + un.map(i => `- [${CONF_LABEL[i.conf] || "?"}] ${i.text}`).join("\n") + "\n\n";
  const mapRows = STATES.filter(x => !x[3]).map(([code, name]) => { const m = state.mapStates[code]; if (!m || !m.status || m.status === "open") return ""; return `- ${name}: ${MAP_STATUS_LABEL[m.status] || m.status}${m.note ? " — " + m.note : ""}`; }).filter(Boolean); if (mapRows.length) out += `## Search area\n\n${mapRows.join("\n")}\n`;
  copy(out, "Brief copied — paste it into a chat with Claude.");
}
function copy(text, msg) { const done = () => toast(msg || "Copied"); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); else fallbackCopy(text, done); }
function fallbackCopy(text, done) { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Copying is blocked — export instead."); } ta.remove(); }
let toastTimer = null;
function toast(msg) { const old = document.querySelector(".toast"); if (old) old.remove(); const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; el.setAttribute("role", "status"); document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3600); }

/* ================================================================ wiring */

function solveById(id) { return state.solves.find(x => x.id === id); }
function cycleVerdict(c, lineId) { c.verdicts = c.verdicts || {}; const cur = c.verdicts[lineId]; if (!cur) c.verdicts[lineId] = "fit"; else if (cur === "fit") c.verdicts[lineId] = "fail"; else delete c.verdicts[lineId]; }
function cycleGate(c, gid) { c.gates = c.gates || {}; const cur = c.gates[gid]; if (!cur) c.gates[gid] = "pass"; else if (cur === "pass") c.gates[gid] = "fail"; else delete c.gates[gid]; }

function wire() {
  const $$ = s => document.querySelectorAll(s);
  $$("[data-route]").forEach(b => b.addEventListener("click", () => { state.route = b.dataset.route; render(); }));
  $$(".pline").forEach(b => b.addEventListener("click", () => { state.selectedLine = b.dataset.line; render(); }));
  $$("[data-goline]").forEach(b => b.addEventListener("click", () => { state.selectedLine = b.dataset.goline; state.route = "poem"; render(); }));
  $$("[data-solve].solverow").forEach(b => b.addEventListener("click", () => { state.selectedSolve = b.dataset.solve; render(); }));
  $$("[data-tier]").forEach(b => b.addEventListener("click", () => { state.filter.tier = b.dataset.tier; render(); }));
  $$("[data-fmode]").forEach(b => b.addEventListener("click", () => { state.filter.mode = b.dataset.fmode; render(); }));
  $$("[data-filter]").forEach(el => { const k = el.dataset.filter, ev = el.tagName === "SELECT" ? "change" : "input"; el.addEventListener(ev, () => { state.filter[k] = el.value; render(); const again = document.querySelector(`[data-filter="${k}"]`); if (again && ev === "input") { again.focus(); again.setSelectionRange(again.value.length, again.value.length); } }); });
  $$("[data-ov]").forEach(b => b.addEventListener("click", () => { state.overlays[b.dataset.ov] = !state.overlays[b.dataset.ov]; render(); }));
  $$(".st[data-state]").forEach(el => { if (el.dataset.state) el.addEventListener("click", () => { state.selectedState = el.dataset.state; render(); }); });
  $$(".site[data-site]").forEach(g => g.addEventListener("click", () => { const c = solveById(g.dataset.site); state.selectedSite = g.dataset.site; if (c) { const code = (c.region || "").slice(0, 2).toUpperCase(); if (STATES.some(x => x[0] === code && !x[3])) state.selectedState = code; } render(); }));
  $$("[data-pick]").forEach(b => b.addEventListener("click", () => { state.selectedSite = b.dataset.pick; render(); }));

  /* slot inline edits: save on change, no re-render (keeps focus) */
  $$(".slot [data-sf]").forEach(el => el.addEventListener("change", () => {
    const c = solveById(state.selectedSolve); if (!c) return; leaveDemoIfNeeded();
    const lineId = el.closest(".slot").dataset.slot; c.chain = c.chain || {}; const s = c.chain[lineId] || {};
    s[el.dataset.sf] = el.dataset.sf === "conf" ? +el.value : el.value.trim(); c.chain[lineId] = s; saveSolve(c);
    /* refresh the rail counts and strip without rebuilding inputs */
    const strip = document.querySelector(".solvegrid .strip"); if (strip) { const v = c.verdicts || {}; strip.innerHTML = state.lines.map((l, k) => { const sl = c.chain[l.id]; const cls = v[l.id] === "fail" ? "fail" : (sl && sl.conf ? "c" + Math.min(3, +sl.conf) : (v[l.id] === "fit" ? "fit" : "")); return `<i class="${cls} ${l.hard ? "hard" : ""}"></i>`; }).join(""); }
  }));
  $$("[data-verdict]").forEach(b => b.addEventListener("click", () => { const c = solveById(state.selectedSolve); if (!c) return; leaveDemoIfNeeded(); cycleVerdict(c, b.dataset.verdict); saveSolve(c); render(); }));
  $$("[data-gate]").forEach(b => b.addEventListener("click", () => { const c = solveById(b.dataset.solve); if (!c) return; leaveDemoIfNeeded(); cycleGate(c, b.dataset.gate); saveSolve(c); render(); }));

  const stat = document.querySelector("[data-status]"); if (stat) stat.addEventListener("change", () => { const l = state.lines.find(x => x.id === stat.dataset.status); if (l) { leaveDemoIfNeeded(); l.status = stat.value; savePoem(); render(); } });
  const lk = document.querySelector("[data-lkind]"); if (lk) lk.addEventListener("change", () => { const l = state.lines.find(x => x.id === lk.dataset.lkind); if (l) { leaveDemoIfNeeded(); l.kind = lk.value; savePoem(); render(); } });
  const note = document.querySelector("[data-note]"); if (note) note.addEventListener("change", () => { const l = state.lines.find(x => x.id === note.dataset.note); if (l) { leaveDemoIfNeeded(); l.note = note.value.trim(); savePoem(); } });
  const ms = document.querySelector("[data-mapstatus]"); if (ms) ms.addEventListener("change", () => { leaveDemoIfNeeded(); state.mapStates[ms.dataset.mapstatus] = { ...(state.mapStates[ms.dataset.mapstatus] || {}), status:ms.value }; saveMap(); render(); });
  const mn = document.querySelector("[data-mapnote]"); if (mn) mn.addEventListener("change", () => { leaveDemoIfNeeded(); state.mapStates[mn.dataset.mapnote] = { ...(state.mapStates[mn.dataset.mapnote] || {}), note:mn.value.trim() }; saveMap(); });
  const file = document.getElementById("importFile"); if (file) file.addEventListener("change", () => { if (file.files && file.files[0]) doImport(file.files[0]); });

  $$("[data-act]").forEach(b => b.addEventListener("click", ev => {
    ev.preventDefault(); const a = b.dataset.act, id = b.dataset.intel, sid = b.dataset.solve, lid = b.dataset.line;
    if (a === "clear-demo") { leaveDemo(); render(); toast("Examples cleared."); }
    else if (a === "edit-poem") editPoemDialog();
    else if (a === "add-intel") intelDialog(null);
    else if (a === "add-intel-for") intelDialog(null, lid);
    else if (a === "edit-intel") intelDialog(state.intel.find(x => x.id === id));
    else if (a === "match") matchDialog(id);
    else if (a === "bulk") bulkDialog();
    else if (a === "del-intel") { const it = state.intel.find(x => x.id === id); if (it && confirm("Delete this fact?\n\n" + it.text.slice(0, 140))) { state.intel = state.intel.filter(x => x.id !== id); dropDoc("intel/" + id); render(); } }
    else if (a === "unlink") { const it = state.intel.find(x => x.id === id); if (it) { it.links = (it.links || []).filter(k => k.lineId !== lid); upsertIntel(it); render(); } }
    else if (a === "toggle-hard") { const l = state.lines.find(x => x.id === lid); if (l) { leaveDemoIfNeeded(); l.hard = !l.hard; savePoem(); render(); } }
    else if (a === "add-solve") solveDialog(null);
    else if (a === "edit-solve") solveDialog(solveById(sid));
    else if (a === "open-solve") { state.selectedSolve = sid; state.route = "solves"; render(); }
    else if (a === "del-solve") { const c = solveById(sid); if (c && confirm("Delete " + c.name + "?")) { state.solves = state.solves.filter(x => x.id !== sid); dropDoc("candidates/" + sid); state.selectedSolve = null; render(); } }
    else if (a === "cmp-add") { if (state.compare.includes(sid)) state.compare = state.compare.filter(x => x !== sid); else if (state.compare.length < 3) state.compare.push(sid); else toast("Compare holds three."); render(); }
    else if (a === "cmp-remove") { state.compare = state.compare.filter(x => x !== sid); render(); }
    else if (a === "cmp-toggle") { if (state.compare.length) state.compare = []; else if (state.selectedSolve) state.compare = [state.selectedSolve]; render(); }
    else if (a === "cmp-clear") { state.compare = []; render(); }
    else if (a === "gate-out") { state.gateShowOut = !state.gateShowOut; render(); }
    else if (a === "export") doExport();
    else if (a === "import") document.getElementById("importFile").click();
    else if (a === "brief") brief();
    else if (a === "wipe") { if (!confirm("Erase the poem, all facts, all solves and the map? Export first.")) return; state.intel.forEach(i => dropDoc("intel/" + i.id)); state.solves.forEach(c => dropDoc("candidates/" + c.id)); dropDoc("poem/doc"); dropDoc("map/states"); state.poemTitle = ""; state.poemRaw = ""; state.lines = []; state.intel = []; state.solves = []; state.mapStates = {}; state.usingDemo = false; state.selectedLine = null; state.selectedSolve = null; render(); toast("Erased."); }
  }));
}
document.addEventListener("keydown", e => { if (e.target.matches("input, textarea, select") || dlg.open) return; const i = ["1","2","3","4","5","6","7"].indexOf(e.key); if (i >= 0) { state.route = VIEWS[i][0]; render(); } });

/* ================================================================ boot */
loadDemoIfEmpty(); render();
if (window.claude && typeof window.claude.use === "function") connect(); else setSync("off", "Local only — export to keep your work");
</script>
