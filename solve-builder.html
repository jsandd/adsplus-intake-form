/* ---- archive ---- */
function viewArchive(q){const qq=(q||"").toLowerCase();let ss=[...S.statements].filter(s=>!qq||s.text.toLowerCase().includes(qq)||(s.venue||"").toLowerCase().includes(qq)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));$("#view").innerHTML=`<div class="grid2"><div class="panel"><div class="ph"><h3>Posey statement archive</h3><span class="hint">${ss.length}</span><span class="grow"></span><input type="search" placeholder="keyword" style="width:180px" value="${esc(q||"")}" onchange="viewArchive(this.value)"><button class="btn sm" onclick="addStatement()">Add</button></div>${ss.slice(0,80).map(s=>`<div class="sug"><span><div style="font-size:13px">${esc(s.text)}</div><div class="m">${tierTag(s.tier)} ${s.skind==="declined"?'<span class="tag" style="color:var(--warn)">declined / ambiguous</span>':""} ${esc(s.date||"undated")} · ${esc(s.venue||s.source||"")} ${s.origin==="manual"?'<span class="tag" style="color:var(--c2)">added here</span>':""} ${(s.links||[]).map(l=>`<span class="tag" style="cursor:pointer" onclick="selectLine('${l.ref}')">${l.stance==="contradicts"?"✕":"→"} ${l.ref}</span>`).join("")}</div></span></div>`).join("")||'<div class="pb"><div class="gap">The archive is empty.</div></div>'}</div><div><div class="panel"><div class="ph"><h3>Rumours & field reports</h3><span class="hint">${S.rumors.length} · every one carries its tier</span></div><div class="pb"><input type="search" placeholder="search rumours" onchange="rumorSearch(this.value)"><div id="rumOut" style="margin-top:8px"></div></div></div><div class="panel"><div class="ph"><h3>Book & media index</h3><span class="hint">${S.book.length}</span></div>${S.book.slice(0,20).map(b=>`<div class="sug"><span><div style="font-size:13px">${esc(b.text)}</div><div class="m">${tierTag(b.tier)} ${esc(b.source||"")} ${(b.links||[]).map(l=>`<span class="tag">${l.ref}</span>`).join("")}</div></span></div>`).join("")}</div><div class="panel"><div class="pb hint">Monitors for the forums, Mysterious Writings and treasure.quest need a real network connection and run only in the local edition. New statements you find go in with <b>Add</b> at the tier you can justify; every solve re-scores.</div></div></div></div>`;rumorSearch("")}

/* ---- layers ---- */
function viewLayers(){const v=view();const c=v?constraintState(v):null;$("#view").innerHTML=`<div class="grid2"><div class="panel"><div class="ph"><h3>Region dossier</h3><select id="dosSel" style="width:auto" onchange="loadDossier(this.value)"><option value="">${c?.point?"for the active point":"choose…"}</option>${S.regions.map(r=>`<option value="${r.id}">${esc(r.name)} · ${r.status}</option>`).join("")}</select></div><div class="pb" id="dosOut"></div></div><div><div class="panel"><div class="ph"><h3>Landmark inventory</h3></div><div class="pb"><div class="row"><select id="invType" style="width:auto"><option value="">any type</option>${["arch","waterfall","hotspring","spring","rock","cirque","pair","pass","gate","bend","confluence","face","pool","hole","peak","lake","river","site","historic","monument","town"].map(t=>`<option>${t}</option>`).join("")}</select><select id="invIdea" style="width:auto"><option value="">any name idea</option>${Object.keys(K.NAME_PATTERNS).map(t=>`<option>${t}</option>`).join("")}</select><select id="invState" style="width:auto"><option value="">any state</option>${Object.keys(K.STATE_NAMES).map(s=>`<option>${s}</option>`).join("")}</select><input type="number" id="invR" value="${c?.point?60:400}" style="width:80px" title="miles from active point"><button class="btn gold" onclick="inventory()">Query</button></div><div class="hint" style="margin-top:4px">${S.features.length} features: built-in (unverified until the local edition checks GNIS) plus ${S.features.filter(f=>f.origin==="db").length} sites from your Field HQ solves.</div><div id="invOut" style="margin-top:8px"></div></div></div><div class="panel"><div class="ph"><h3>Point lookup</h3></div><div class="pb hint">Elevation (USGS), land owner (PAD-US), roads (OpenStreetMap) and historical topo links need a real network and run in the local edition. Here, a point gives you its state, region dossier and nearest features: <input type="text" id="ptLL" placeholder="lat, lon" style="width:180px;display:inline-block"> <button class="btn sm" onclick="pointLookup()">Look up</button><div id="ptOut" style="margin-top:8px"></div></div></div></div></div>`;if(c?.point)loadDossier("",c.point);else $("#dosOut").innerHTML='<span class="hint">Pin a point or choose a region.</span>'}
function loadDossier(id,pt){const r=id?S.regions.find(x=>x.id===id):(pt?regionOf(...pt):null);const o=$("#dosOut");if(!r){o.innerHTML='<div class="gap">No dossier covers this point. That is a coverage gap, not a verdict.</div>';return}const d=r.dossier;const feats=S.features.filter(f=>inBox(f.lat,f.lon,r.bbox));const hist=K.HISTORY.filter(h=>h.regions.includes(r.id));const season=K.SEASON.filter(s=>s.match.some(m=>(r.name+" "+feats.map(f=>f.name).join(" ")).toLowerCase().includes(m.toLowerCase()))).map(s=>s.text);const rum=S.rumors.filter(x=>r.name.replace("&"," ").split(/\s+/).filter(k=>k.length>4).some(k=>x.text.toLowerCase().includes(k.toLowerCase()))).slice(0,8);
  o.innerHTML=`<h3 style="margin:0 0 6px">${esc(r.name)} <span class="tag">${r.status}</span> <span class="tag">${r.states}</span></h3>${[["Terrain",d.terrain],["History",d.history],["Ownership & access",d.ownership],["Why the community favours or dismisses it",d.community],["Elimination",d.elimination],["Known searchers",d.searchers]].map(([k,t])=>`<div style="margin-bottom:6px"><span class="k">${k}</span><div style="font-size:13px">${esc(t)}</div></div>`).join("")}<div class="k">Indigenous & historical names</div><ul style="font-size:13px;margin:4px 0">${(d.indigenous||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul><div class="k">Trails & routes</div><ul style="font-size:13px;margin:4px 0">${(d.trails||[]).map(t=>`<li>${esc(t)}</li>`).join("")}${hist.map(h=>`<li><b>${esc(h.name)}</b> — ${esc(h.text)} <span class="hint">(${esc(h.source)})</span></li>`).join("")}</ul><div class="k">Season & access</div><ul style="font-size:13px;margin:4px 0">${season.map(t=>`<li>${esc(t)}</li>`).join("")||'<li class="hint">no season notes</li>'}</ul><div class="k">Features inside (${feats.length})</div><div class="chips" style="margin:4px 0">${feats.map(f=>`<span class="chip" title="${esc(f.notes)}" onclick="showOnMap(${f.lat},${f.lon})">${esc(f.name)}</span>`).join("")}</div><div class="k">Rumours touching this region (${rum.length})</div>${rum.map(x=>`<div style="font-size:12.5px;margin:3px 0">${tierTag(x.tier)} ${esc(x.text.slice(0,200))}</div>`).join("")}<div class="hint" style="margin-top:8px">Dossier text is built-in general knowledge (Claude); coordinates approximate; nothing here is verified against federal name records until the local edition runs its GNIS check.</div>`}
function inventory(){const v=view();const c=v?constraintState(v):null;const t=$("#invType").value,idea=$("#invIdea").value,st=$("#invState").value,rad_=+$("#invR").value;let fs=S.features.filter(f=>(!t||f.ftype===t)&&(!st||f.state===st)&&(!idea||ideaHits(f,[idea]).length));if(c?.point){fs=fs.map(f=>({...f,dist_mi:+hav(c.point,[f.lat,f.lon]).toFixed(1)})).filter(f=>f.dist_mi<=rad_).sort((a,b)=>a.dist_mi-b.dist_mi)}$("#invOut").innerHTML=`<table><tr><th>name</th><th>type</th><th>state</th><th>owner</th><th>car</th><th>mi</th><th></th></tr>${fs.slice(0,80).map(f=>`<tr><td>${esc(f.name)} ${tierTag(f.tier)}${f.aliases?.length?`<div class="hint">${esc(f.aliases.join(" · "))}</div>`:""}</td><td>${f.ftype}</td><td>${f.state}</td><td>${esc(f.owner||"")}</td><td>${esc(f.car||"")}</td><td>${f.dist_mi??""}</td><td><button class="btn sm" onclick="showOnMap(${f.lat},${f.lon})">map</button></td></tr>`).join("")}</table>${!fs.length?'<div class="gap">Nothing matches in the built-in inventory — a coverage gap, not proof of absence.</div>':""}`}
function pointLookup(){const ll=parseLL($("#ptLL").value);if(!ll)return;const r=regionOf(...ll);const near=S.features.map(f=>({...f,d:hav(ll,[f.lat,f.lon])})).sort((a,b)=>a.d-b.d).slice(0,8);$("#ptOut").innerHTML=`<div class="stat"><span class="k">State</span>${stateOf(...ll)||"?"} ${eliminated().has(stateOf(...ll))?'<span class="tag" style="color:var(--bad)">eliminated</span>':""} · <span class="k">Region</span> ${r?esc(r.name):"no dossier"} · <span class="k">Fenn map</span> ${inBox(ll[0],ll[1],K.FENN_MAP_BBOX)?"inside":"outside"}</div><div style="margin-top:6px">${near.map(f=>`<span class="chip">${esc(f.name)} (${f.ftype}, ${f.d.toFixed(1)} mi)</span>`).join(" ")}</div>`}

/* ---- rules ---- */
function viewRules(){const rs=rules();$("#view").innerHTML=`<div class="panel"><div class="ph"><h3>Rules engine</h3><span class="hint">hard = red flag on candidates; soft = warning. Edit freely — more statements arrive every month.</span><span class="grow"></span><button class="btn sm" onclick="addRuleRow()">Add</button><button class="btn gold sm" onclick="saveRulesUI()">Save & re-score</button></div><table id="rulesT"><tr><th>on</th><th>statement</th><th>kind</th><th>check code</th><th>source</th><th></th></tr>${rs.map(r=>`<tr data-id="${r.id}"><td><input type="checkbox" ${r.enabled?"checked":""} class="rEn"></td><td><input type="text" value="${esc(r.text)}" class="rTx"></td><td><select class="rKind" style="width:auto"><option ${r.kind==="hard"?"selected":""}>hard</option><option ${r.kind==="soft"?"selected":""}>soft</option></select></td><td><input type="text" value="${esc(r.code||"")}" class="rCode mono"></td><td><input type="text" value="${esc(r.source||"")}" class="rSrc"></td><td><button class="btn sm bad" onclick="this.closest('tr').remove()">✕</button></td></tr>`).join("")}</table><div class="pb hint">Check codes: <span class="mono">flag:private,fee</span> (candidate flags) · <span class="mono">check:states:CO,OR</span> · <span class="mono">check:walk:S2L2:S2L3:3</span> · <span class="mono">check:fenn:75</span> · <span class="mono">check:map</span> · <span class="mono">check:none</span> (display only).</div></div>`}
function addRuleRow(){$("#rulesT").insertAdjacentHTML("beforeend",`<tr data-id=""><td><input type="checkbox" checked class="rEn"></td><td><input type="text" class="rTx" placeholder="What Posey said"></td><td><select class="rKind" style="width:auto"><option>soft</option><option>hard</option></select></td><td><input type="text" class="rCode mono" value="check:none"></td><td><input type="text" class="rSrc" placeholder="date · venue"></td><td></td></tr>`)}
function saveRulesUI(){const rows=[...document.querySelectorAll("#rulesT tr[data-id]")];S.rulesDoc={rules:rows.map(tr=>({id:tr.dataset.id||uid("r"),enabled:tr.querySelector(".rEn").checked,text:tr.querySelector(".rTx").value,kind:tr.querySelector(".rKind").value,code:tr.querySelector(".rCode").value,source:tr.querySelector(".rSrc").value})).filter(r=>r.text)};saveRules();const d=rescoreAll("rules changed");toast(`Rules saved; ${d.length} solves changed score.`);renderAll()}

/* ---- solves ---- */
function viewSolves(){const row=s=>{const sc=score(s);return `<tr><td>${s.kind==="reference"?"◇ ":""}${esc(s.name)}${s.parent_id?` <span class="hint">fork${s.fork_ref?" at "+s.fork_ref:""}</span>`:""}</td><td>${sc.lines}</td><td><b>${sc.total}</b></td><td style="color:${sc.seed_share>=40?"var(--bad)":"var(--ink2)"}">${sc.seed_share}%</td><td>${esc(seedInfo(s).label||"—")}</td><td class="hint">${esc(s.source||"")}</td><td class="row"><button class="btn sm" onclick="openSolve('${s.id}')">open</button><button class="btn sm" onclick="compare('${s.id}')">compare</button>${s.kind!=="reference"?`<button class="btn sm" onclick="renameSolve('${s.id}')">rename</button><button class="btn sm bad" onclick="delSolve('${s.id}')">delete</button>`:`<button class="btn sm ai" onclick="disagree('${s.id}')" ${sampler?"":"disabled"}>explain disagreement</button>`}</td></tr>`};const bs=blindSpots();$("#view").innerHTML=`<div class="panel"><div class="ph"><h3>Your solves</h3><span class="grow"></span><button class="btn gold sm" onclick="newSolveDialog()">New</button></div><table><tr><th>name</th><th>lines</th><th>score</th><th>seed share</th><th>seed</th><th></th><th></th></tr>${S.solves.map(row).join("")||'<tr><td class="hint" colspan=7>None yet.</td></tr>'}</table></div><div class="panel"><div class="ph"><h3>Community theory library</h3><span class="hint">read-only — community readings plus your ${S.refSolves.filter(r=>r.id.startsWith("db_")).length} Field HQ chains; fork one to work on it</span></div><table><tr><th>name</th><th>lines</th><th>score</th><th>seed share</th><th>seed</th><th>source</th><th></th></tr>${S.refSolves.map(row).join("")}</table></div><div class="panel"><div class="ph"><h3>Blind spots</h3><span class="hint">which interpretation types you keep choosing</span></div><div class="pb"><div class="chips">${bs.counts.map(c=>`<span class="chip ${c.share<8?"":"on"}">${c.label} ${c.count} (${c.share}%)</span>`).join("")}</div>${bs.underused.length?`<div class="gap" style="margin-top:8px">Under-used: ${bs.underused.map(u=>u.label).join(", ")}. Filter the next line panel to those and force yourself through them.</div>`:""}</div></div><div id="cmpOut"></div>`}
function openSolve(id){S.sid=id;S.sugg=null;S.ref=null;renderAll()}
function renameSolve(id){const s=S.solves.find(x=>x.id===id);const n=prompt("New name",s.name);if(!n)return;s.name=n;saveSolve(s);renderAll();viewSolves()}
function delSolve(id){if(!confirm("Delete this solve?"))return;S.solves=S.solves.filter(x=>x.id!==id);dropDoc("sb_solves/"+id);if(S.sid===id)S.sid=S.solves[0]?.id||null;renderAll();viewSolves()}
function compare(other){const a=view(),b=solveById(other);if(!a||!b)return;const lines=S.lines.map(l=>{const x=a.state.lines[l.ref],y=b.state.lines[l.ref];return {ref:l.ref,text:l.text,a:x,b:y,differs:!!(x||y)&&((x||{}).text!==(y||{}).text)}});const fork=(lines.find(x=>x.differs)||{}).ref;$("#cmpOut").innerHTML=`<div class="panel"><div class="ph"><h3>Compare</h3><span class="hint">${esc(a.name)} (${score(a).total}) vs ${esc(b.name)} (${score(b).total}) · first fork at <b>${fork||"—"}</b></span></div><table><tr><th>line</th><th>${esc(a.name)}</th><th>${esc(b.name)}</th></tr>${lines.map(l=>`<tr><td>${l.ref} <span class="hint">${esc(l.text)}</span></td><td class="${l.differs?"diff":""}">${l.a?catTag(l.a.category)+" "+esc(l.a.text)+' <span class="hint">sure '+l.a.conf+"</span>":"—"}</td><td class="${l.differs?"diff":""}">${l.b?catTag(l.b.category)+" "+esc(l.b.text)+' <span class="hint">sure '+l.b.conf+"</span>":"—"}</td></tr>`).join("")}</table></div>`;$("#cmpOut").scrollIntoView()}
async function disagree(other){const a=mine();if(!a)return toast("Open one of your own solves first");modal('<div class="hint">Finding the fork…</div>');const r=await aiDisagree(a,solveById(other));modal(`<h3 style="margin-top:0">Where you diverge</h3>${r.text?`<div class="ai-out">${esc(r.text)}</div>`:`<p class="gap">${esc(r.error||r.unavailable)}</p>`}`)}

/* ---- auto / reverse / feasibility ---- */
function viewAuto(){$("#view").innerHTML=`<div class="panel"><div class="ph"><h3>Automatic solve search</h3><span class="hint">beam search over literal readings of stanzas 2–4, scored on poem fit, compactness and the rules</span><span class="grow"></span><label class="hint"><input type="checkbox" id="autoAI" ${sampler?"":"disabled"}> AI re-rank</label><button class="btn gold" onclick="runAuto()">Run</button></div><div class="pb" id="autoOut"><span class="hint">Uses the current solve's seed and committed lines as fixed points. The search space is the built-in inventory plus your Field HQ sites and chains.</span></div></div>`}
async function runAuto(){const v=view();if(!v)return toast("Open a solve");$("#autoOut").innerHTML='<span class="hint">Searching…</span>';await new Promise(r=>setTimeout(r,20));const res=autoSearch(v);let ranks={};if($("#autoAI").checked&&res.length){const a=await aiRank(v,res);(a.ranked||[]).forEach((x,i)=>ranks[x.index]={pos:i+1,...x})}S._auto=res;$("#autoOut").innerHTML=res.map((x,i)=>`<div class="panel"><div class="ph"><h3>#${i+1}${ranks[i]?` · AI rank ${ranks[i].pos}`:""}</h3><span class="hint">${esc(x.region)} · ${x.placed} lines · score ${x.score}</span><span class="grow"></span><button class="btn sm gold" onclick="adopt(${i})">Open as a solve</button></div><div class="pb" style="font-size:12.5px">${Object.entries(x.lines).map(([ref,c])=>`<div><b>${ref}</b> ${esc(c.text)} <span class="hint">sure ${c.conf}</span></div>`).join("")}${ranks[i]?`<div class="ai-out" style="margin-top:6px">${esc(ranks[i].verdict)} · strongest ${esc(ranks[i].strongest_line)} · weakest ${esc(ranks[i].weakest_line)}</div>`:""}</div></div>`).join("")||'<div class="gap">No complete paths found with the current inventory.</div>'}
function adopt(i){const x=S._auto[i];const s={id:uid("s"),name:"Auto: "+x.region+" "+new Date().toLocaleTimeString(),kind:"mine",created:Date.now(),updated:Date.now(),state:{lines:JSON.parse(JSON.stringify(x.lines)),seed:{},radius:{},overrides:{},history:[]}};S.solves.unshift(s);saveSolve(s);S.sid=s.id;S.tab="line";S.ref=null;S.sugg=null;renderAll()}
function viewReverse(){$("#view").innerHTML=`<div class="panel"><div class="ph"><h3>Reverse mode</h3><span class="hint">name an endpoint; the tool works the poem backward and flags every stretch</span></div><div class="pb"><div class="row"><input type="text" id="rvName" placeholder="Candidate endpoint name" style="width:260px"><input type="text" id="rvLL" placeholder="lat, lon" style="width:180px"><label class="hint"><input type="checkbox" id="rvAI" ${sampler?"":"disabled"}> AI narrative</label><button class="btn gold" onclick="runReverse()">Work backward</button></div><div id="rvOut" style="margin-top:10px"></div></div></div>`}
async function runReverse(){const v=view();const ll=parseLL($("#rvLL").value);if(!v||!ll)return toast("Enter lat, lon");$("#rvOut").innerHTML='<span class="hint">Working backward…</span>';await new Promise(r=>setTimeout(r,20));const r=reverse(v,ll[0],ll[1],$("#rvName").value);let ai=null;if($("#rvAI").checked)ai=await aiReverse(v,r);$("#rvOut").innerHTML=`<p><b>${esc(r.verdict)}</b></p><table><tr><th>line</th><th>would have to mean</th><th>mi</th><th>verdict</th><th>alternatives</th></tr>${r.lines.map(l=>`<tr><td>${l.ref}<div class="hint">${esc(l.text)}</div></td><td>${esc(l.would_have_to_mean)}<div class="hint">${esc(l.why)}</div></td><td>${l.distance_mi??""}</td><td style="color:${l.stretch?"var(--bad)":"var(--ok)"}">${l.stretch?"stretch":"fits"}</td><td class="hint">${esc(l.alternatives.join(" · "))}</td></tr>`).join("")}</table>${ai?`<div class="ai-out" style="margin-top:10px">${esc(ai.text||ai.error||ai.unavailable)}</div>`:""}`}
function viewFeas(){const rows=feasibility();$("#view").innerHTML=`<div class="panel"><div class="ph"><h3>Whole-poem feasibility</h3><span class="hint">which regions can support a complete valid solve at all</span><span class="grow"></span><button class="btn sm ai" onclick="feasAI()" ${sampler?"":"disabled"}>Narrate (AI)</button></div><table><tr><th>region</th><th>features</th><th>surge</th><th>hole</th><th>gates</th><th>granite</th><th>bear</th><th>bride</th><th>verdict</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.region)}</b></td><td>${r.usable}/${r.features}</td>${r.checks.map(c=>`<td title="${esc(c.have.join(", "))}" style="color:${c.ok?"var(--ok)":"var(--bad)"}">${c.ok?"✓":"✗"}</td>`).join("")}<td class="${r.thin?"hint":""}">${esc(r.verdict)}</td></tr>`).join("")}</table><div class="pb hint">Built-in inventory plus your sites. A ✗ in a thin region means "not catalogued", not "does not exist".</div><div id="feasAI" class="pb"></div></div>`}
async function feasAI(){$("#feasAI").innerHTML='<span class="hint">Thinking…</span>';const r=await aiFeas(feasibility());$("#feasAI").innerHTML=`<div class="ai-out">${esc(r.text||r.error||r.unavailable)}</div>`}

/* ---- field ---- */
function viewField(){const v=view();const el=$("#view");if(!v){el.innerHTML='<div class="gap">Open a solve.</div>';return}const stops=fieldStops(v);const fd=S.findings.filter(f=>f.solve_id===v.id).sort((a,b)=>b.created-a.created);el.innerHTML=`<div class="grid2"><div class="panel"><div class="ph"><h3>Field mode</h3><span class="grow"></span><button class="btn gold sm" onclick="locate()">Use my GPS</button><button class="btn sm" onclick="fieldExport()" ${downloads?"":'disabled title="downloads not available in this view"'}>Save printable checklist</button></div><div class="pb" id="gpsOut"><span class="hint">Press "Use my GPS" on your phone (the browser will ask permission). You get distance and bearing to every pinned point, what you predicted there, and what confirms or kills the line you are standing on.</span></div></div><div class="panel"><div class="ph"><h3>Record what you found</h3></div><div class="pb"><div class="row"><select id="fdRef" style="width:auto">${S.lines.filter(l=>v.state.lines[l.ref]).map(l=>`<option>${l.ref}</option>`).join("")}</select><select id="fdVerdict" style="width:auto"><option value="confirmed">confirmed</option><option value="killed">killed</option><option value="inconclusive">inconclusive</option></select></div><textarea id="fdText" placeholder="What is actually here" style="margin-top:6px"></textarea><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn gold" onclick="saveFindingUI()" ${v.kind==="reference"?"disabled":""}>Save → feeds the score</button></div></div>${fd.map(f=>`<div class="sug"><span><b>${f.ref}</b> <span class="tag" style="color:${f.verdict==="confirmed"?"var(--ok)":f.verdict==="killed"?"var(--bad)":"var(--warn)"}">${f.verdict}</span> ${esc(f.text)}<div class="m">${new Date(f.created).toLocaleString()} ${f.lat?`<span class="mono">${(+f.lat).toFixed(4)}, ${(+f.lon).toFixed(4)}</span>`:""}</div></span></div>`).join("")}</div></div><div class="panel"><div class="ph"><h3>Stops in driving order</h3><span class="hint">nearest-neighbour from the first pin · drive time = 1.4 × straight line at 40 mph</span></div><table><tr><th>#</th><th>line</th><th>place</th><th>coords</th><th>drive</th><th>access</th><th>season</th></tr>${stops.map(s=>`<tr><td>${s.stop}</td><td>${s.ref}</td><td>${esc(s.name)}</td><td class="mono">${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</td><td>${s.drive_mi} mi · ${s.drive_min} min</td><td class="hint">${esc(s.access)} · car: ${esc(s.car)}</td><td class="hint">${esc(s.season.join(" "))}</td></tr>`).join("")||'<tr><td class="hint" colspan=7>Pin points to build a route.</td></tr>'}</table></div>`}
function locate(){if(!navigator.geolocation)return toast("No GPS in this browser");navigator.geolocation.getCurrentPosition(p=>{S.field.pos=[p.coords.latitude,p.coords.longitude];const P=pins().map(x=>({...x,d:hav(S.field.pos,[x.lat,x.lon]),b:brg(S.field.pos,[x.lat,x.lon])})).sort((a,b)=>a.d-b.d);const near=P[0];$("#gpsOut").innerHTML=`<div class="mono">you: ${S.field.pos[0].toFixed(5)}, ${S.field.pos[1].toFixed(5)} (±${Math.round(p.coords.accuracy)} m)</div>${near?`<div class="panel" style="margin:8px 0"><div class="pb"><div class="k">Nearest pin · ${near.ref}</div><div class="big">${near.d<1?Math.round(near.d*5280)+" ft":near.d.toFixed(1)+" mi"} <span style="font-size:14px;color:var(--ink2)">at ${Math.round(near.b)}°</span></div><div><b>${esc(near.text)}</b></div><div style="margin-top:6px"><span class="k">You predicted</span><div>${esc(near.rationale||"—")}</div></div><div><span class="k">Confirms</span><div>${esc(near.confirm||"The feature is here, natural, on public land, reachable without gear.")}</div></div><div><span class="k">Kills</span><div>${esc(near.kill||"Not there, private/fee, needs gear, or a man-made structure.")}</div></div></div></div>`:""}<table><tr><th>line</th><th>place</th><th>distance</th><th>bearing</th></tr>${P.map(x=>`<tr><td>${x.ref}</td><td>${esc(x.text)}</td><td>${x.d.toFixed(2)} mi</td><td>${Math.round(x.b)}°</td></tr>`).join("")}</table>`},e=>toast("GPS failed: "+e.message+" (an embedded page may not be allowed to use location — open the artifact in its own tab)"),{enableHighAccuracy:true,timeout:15000})}
function saveFindingUI(){const m=needMine();if(!m)return;const x={id:uid("fd"),solve_id:m.id,ref:$("#fdRef").value,verdict:$("#fdVerdict").value,text:$("#fdText").value,lat:S.field.pos?.[0]??null,lon:S.field.pos?.[1]??null,created:Date.now()};S.findings.push(x);saveFinding(x);const c=m.state.lines[x.ref];if(c&&(x.verdict==="confirmed"||x.verdict==="killed")){c.field_verdict=x.verdict;c.conf=x.verdict==="confirmed"?3:0;saveSolve(m)}renderAll();toast("Recorded; the line's confidence and the score updated.")}
async function fieldExport(){const v=view();const stops=fieldStops(v);const html=`<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Field checklist — ${esc(v.name)}</title><style>body{font:15px/1.45 -apple-system,Helvetica,Arial,sans-serif;margin:16px;color:#111;background:#fff}h1{font-size:22px;margin:0 0 4px}.sub{color:#555;margin-bottom:16px}.stop{border:1px solid #bbb;border-radius:8px;padding:12px 14px;margin:0 0 14px;page-break-inside:avoid}h2{font-size:17px;margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:14px}code{font-size:15px}.season{background:#fff3cd;padding:6px 8px;border-radius:4px;font-size:13px}.chk{border-top:1px dashed #bbb;padding-top:8px;margin-top:8px}</style><h1>${esc(v.name)}</h1><div class=sub>Field checklist in driving order · ${stops.length} stops · score ${score(v).total} · saved ${new Date().toISOString().slice(0,10)}</div><p><b>Before leaving:</b> download offline maps; verify each coordinate against a topo. Re-check on site: public land, no buildings, no graves, no cave, no fee, dogs allowed, a normal car gets you within a mile.</p>${stops.map(x=>`<section class=stop><h2>Stop ${x.stop} · ${x.ref} — ${esc(x.name)}</h2><div class=grid><div><b>Coordinates</b><br><code>${x.lat.toFixed(5)}, ${x.lon.toFixed(5)}</code>${x.elev?"<br>"+x.elev.toLocaleString()+" ft":""}</div><div><b>From previous stop</b><br>${x.drive_mi} mi · ~${x.drive_min} min drive</div><div><b>Access</b><br>${esc(x.access)}<br>Car: ${esc(x.car)}<br>Land: ${esc(x.owner)}</div><div><b>Hike</b><br>${esc(x.hike)}<br>Cell: unknown — assume none</div></div><p><b>Expect to find:</b> ${esc(x.expect||"—")}</p><p><b>Why here:</b> ${esc(x.why||"—")}</p><p><b>Confirms the line:</b> ${esc(x.confirm)}</p><p><b>Kills the line:</b> ${esc(x.kill)}</p>${x.season.map(t=>`<p class=season>⚠ ${esc(t)}</p>`).join("")}<p class=chk>☐ found &nbsp; ☐ not there &nbsp; ☐ inconclusive &nbsp; notes: ____________________________</p></section>`).join("")}`;try{await downloads.save({filename:(v.name.replace(/[^A-Za-z0-9]+/g,"-").toLowerCase()||"solve")+"-field-checklist.html",data:html});toast("Saved.")}catch(e){if(e&&e.code!=="declined")toast("Could not save: "+(e.message||e.code))}}

/* ---- data ---- */
function viewData(){const v=view();const log=v?(v.state.history_log||[]).slice().reverse():[];$("#view").innerHTML=`<div class="grid2"><div><div class="panel"><div class="ph"><h3>Where the data comes from</h3></div><div class="pb" style="font-size:13px"><p style="margin:0 0 6px"><b>Shared with Field HQ</b> (read live): the poem, ${S.intel.length} facts and ${S.cands.length} solves/sites. Add or edit those in Field HQ and they appear here on the next load.</p><p style="margin:0 0 6px"><b>Mapping</b>: facts of kind <i>statement</i> → Posey archive (confirmed → confirmed, likely → reported, unverified → circulating); <i>book</i> → book index; everything else → rumours at circulating or fan-analysis tier. Solves with coordinates → inventory sites; solves with a chain (${S.refSolves.filter(r=>r.id.startsWith("db_")).length}) → read-only reference solves.</p><p style="margin:0"><b>This tool's own store</b>: ${S.solves.length} solves, ${S.scratch.length} scratch entries, ${S.findings.length} findings, ${S.manualStatements.length} statements added here, rules and settings.</p></div></div><div class="panel"><div class="ph"><h3>Backups</h3></div><div class="pb row"><button class="btn" onclick="exportAll()" ${downloads?"":"disabled"}>Export everything (JSON)</button><button class="btn" onclick="rescoreAll('manual');toast('Re-scored');renderAll()">Re-score all</button><button class="btn" onclick="pastePoem()">Replace the poem</button></div></div><div class="panel"><div class="ph"><h3>Not available in the hosted edition</h3></div><div class="pb hint">GNIS downloads and verification, USGS elevation, PAD-US land ownership, OpenStreetMap roads, historical topo, forum and Mysterious Writings monitors, map tiles. All of these need a real network from the machine running the tool; they live in the local edition (solvebuilder/ on your branch, <span class="mono">python3 run.py</span>).</div></div></div><div class="panel"><div class="ph"><h3>History</h3><span class="hint">how this solve has moved</span></div><table>${log.slice(0,40).map(h=>`<tr><td class="hint">${new Date(h.ts).toLocaleString()}</td><td>${esc(h.event)}</td><td>${h.before!=null?h.before+" → ":""}${h.after??""}</td><td class="hint">${esc(String(h.detail||"").slice(0,80))}</td></tr>`).join("")||'<tr><td class="hint">Commit a line to start the log.</td></tr>'}</table></div></div>`}
async function exportAll(){const data=JSON.stringify({format:"solvebuilder/1",exportedAt:new Date().toISOString(),poem:S.poem,solves:S.solves,rules:rules(),scratch:S.scratch,findings:S.findings,statements:S.manualStatements},null,2);try{await downloads.save({filename:"solvebuilder-export.json",data});toast("Saved.")}catch(e){if(e&&e.code!=="declined")toast("Could not save.")}}

/* ---- start ---- */
if(window.claude&&typeof window.claude.use==="function")connect();else{S.ready=true;setSync("local only");boot()}

</script>
