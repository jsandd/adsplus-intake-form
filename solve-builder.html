<style>
:root{--g0:#0D1016;--g1:#141922;--g2:#1B212C;--g3:#242C39;--line:#2A3240;--line2:#3B4553;--ink:#E9EDF2;--ink2:#A5AFBD;--ink3:#6E7889;--gold:#E4B34C;--gold2:#F3CD7A;--ok:#4CC58F;--warn:#F0955A;--bad:#F26D6D;--ai:#B7A3FF;--c2:#6FB3D8;--f-d:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;--f-b:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--f-m:"Azeret Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--g0:#F2F3F6;--g1:#FFFFFF;--g2:#F6F7FA;--g3:#EBEDF2;--line:#D9DEE6;--line2:#C3CAD5;--ink:#171B22;--ink2:#4A5361;--ink3:#7A8493;--gold:#9A6E12;--gold2:#7A5608;--ok:#1F8F5F;--warn:#C2611F;--bad:#C23B3B;--ai:#6A4FD8;--c2:#2E86B5;color-scheme:light}}
:root[data-theme="light"]{--g0:#F2F3F6;--g1:#FFFFFF;--g2:#F6F7FA;--g3:#EBEDF2;--line:#D9DEE6;--line2:#C3CAD5;--ink:#171B22;--ink2:#4A5361;--ink3:#7A8493;--gold:#9A6E12;--gold2:#7A5608;--ok:#1F8F5F;--warn:#C2611F;--bad:#C23B3B;--ai:#6A4FD8;--c2:#2E86B5;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--g0);color:var(--ink);font:14px/1.45 var(--f-b)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--gold)}
h1,h2,h3{margin:0}
.top{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--g1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-family:var(--f-d);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.top .sub{font-family:var(--f-m);font-size:9.5px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
.score{display:flex;gap:14px;align-items:baseline;margin-left:auto}.score b{font-family:var(--f-d);font-weight:900;font-size:26px}.score small{color:var(--ink3);font-family:var(--f-m);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:6px 14px;background:var(--g2);border-bottom:1px solid var(--line);font-size:12px;align-items:center}
.bar .c{background:var(--g3);border-radius:4px;padding:3px 8px}.bar .c b{color:var(--gold);font-weight:600;margin-right:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--f-m)}.bar .seed{border:1px solid var(--gold)}
.grow{flex:1}
.wrap{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:calc(100vh - 100px)}
.poem{border-right:1px solid var(--line);background:var(--g1);padding:10px}
.pl{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;align-items:start}
.pl:hover{background:var(--g2)}.pl.sel{background:var(--g3);border-color:var(--gold)}
.pl .ref{font-family:var(--f-m);font-size:11px;color:var(--gold)}.pl .t{font-size:13.5px}.pl .cm{font-size:12px;color:var(--ink2);margin-top:3px}.pl .cm b{color:var(--ink)}
.stz{font-family:var(--f-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:10px 8px 4px}
.tag{display:inline-block;font-family:var(--f-m);font-size:10px;letter-spacing:.04em;padding:1px 6px;border-radius:3px;background:var(--g3);color:var(--ink2);vertical-align:middle;white-space:nowrap}
.tag.literal{background:#2f4a3a;color:#9be3b8}.tag.feature_class{background:#2f3f4a;color:#9fd0ea}.tag.direction{background:#463a2b;color:#f3c58a}.tag.wordplay{background:#4a2f46;color:#e9a3dc}.tag.naming{background:#2b3f46;color:#8fd6d6}.tag.numeric{background:#3a3a2b;color:#e6e08a}.tag.personal{background:#3a2f4a;color:#c9b1ff}.tag.structural{background:#333;color:#bbb}
:root[data-theme="light"] .tag.literal,:root[data-theme="light"] .tag.feature_class,:root[data-theme="light"] .tag.direction,:root[data-theme="light"] .tag.wordplay,:root[data-theme="light"] .tag.naming,:root[data-theme="light"] .tag.numeric,:root[data-theme="light"] .tag.personal,:root[data-theme="light"] .tag.structural{filter:brightness(.55) saturate(1.4);color:#fff}
.tier{font-family:var(--f-m);font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid;white-space:nowrap}
.tier.confirmed{color:var(--ok);border-color:var(--ok)}.tier.reported{color:var(--c2);border-color:var(--c2)}.tier.circulating{color:var(--warn);border-color:var(--warn)}.tier.fan{color:var(--ai);border-color:var(--ai)}.tier.unverified{color:var(--ink3);border-color:var(--ink3)}
.main{padding:12px 16px;min-width:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--ink2);font-size:13px}.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.panel{background:var(--g1);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.ph{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.ph h3{font-family:var(--f-d);font-size:17px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.pb{padding:10px 12px}
.btn{background:var(--g2);border:1px solid var(--line2);border-radius:5px;padding:5px 10px;font-size:12.5px}.btn:hover{background:var(--g3)}.btn.gold{background:var(--gold);color:#1a1508;border-color:var(--gold);font-weight:600}.btn.ai{border-color:var(--ai);color:var(--ai)}.btn.bad{color:var(--bad)}.btn.sm{padding:2px 7px;font-size:11.5px}.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--g0);border:1px solid var(--line2);border-radius:5px;padding:5px 8px;color:var(--ink);width:100%}textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k{font-family:var(--f-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.sug{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}.sug:first-child{border-top:0}.sug.viol{background:rgba(242,109,109,.08)}
.sug .t{font-weight:600}.sug .r{font-size:12.5px;color:var(--ink2);margin-top:2px}.sug .m{font-size:11px;color:var(--ink3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sug .flag{color:var(--bad);font-size:11px}.sup{color:var(--ok)}.con{color:var(--bad)}
.sug .acts{display:flex;flex-direction:column;gap:4px;align-items:flex-end}.sug .acts select{width:auto;padding:2px 4px;font-size:11px}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--line2);background:var(--g2);border-radius:100px;padding:2px 9px;font-size:11.5px;cursor:pointer}.chip.on{border-color:var(--gold);color:var(--gold)}
.conf{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}.conf.hard{border-left:3px solid var(--bad)}.conf.soft{border-left:3px solid var(--warn)}.conf.ov{opacity:.6}
.big{font-family:var(--f-d);font-size:30px;font-weight:900;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--ink3);font-family:var(--f-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
td.diff{background:rgba(228,179,76,.14)}
.react{border:1px solid var(--ai);background:rgba(183,163,255,.08)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--g0);padding:8px 14px;border-radius:100px;z-index:50}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40}.modal .box{background:var(--g1);border:1px solid var(--line2);border-radius:10px;padding:16px;width:min(760px,95vw);max-height:90vh;overflow:auto}
.hint{color:var(--ink3);font-size:12px}.gap{border:1px dashed var(--warn);color:var(--warn);padding:6px 10px;border-radius:6px;font-size:12.5px}
.ai-out{white-space:pre-wrap;font-size:13px;line-height:1.5;border-left:2px solid var(--ai);padding-left:10px}
.stat{background:var(--g2);border-radius:6px;padding:8px 10px}.stat .k{display:block}
.mono{font-family:var(--f-m);font-size:12px}
.sheet svg{display:block;width:100%;height:auto;background:var(--g0);border-radius:8px}
.st{stroke:var(--line2);stroke-width:.5;vector-effect:non-scaling-stroke}.st-open{fill:var(--g2)}.st-elim{fill:var(--g2);stroke:var(--bad);stroke-dasharray:2 1.5}.st-in{fill:color-mix(in srgb,var(--gold) 22%,var(--g2))}
.lbl{font-family:var(--f-d);font-weight:900;font-size:9px;fill:var(--ink3);text-anchor:middle;letter-spacing:.5px}
.local .pin{fill:var(--gold);stroke:var(--g0);stroke-width:1}.local .pin.s4{fill:var(--ok)}.local .pl{font-family:var(--f-m);font-size:9px;fill:var(--ink);paint-order:stroke;stroke:var(--g0);stroke-width:2px}
.local .ray{stroke:var(--c2);stroke-width:1;stroke-dasharray:4 3}.local .raylbl{font-family:var(--f-m);font-size:8.5px;fill:var(--c2)}.local .mile{fill:var(--ok);fill-opacity:.06;stroke:var(--ok);stroke-width:1;stroke-dasharray:3 3}.local .rt{fill:none;stroke:var(--gold);stroke-width:1.5}.local .gridl{stroke:var(--line);stroke-width:.6}.local .gl{font-family:var(--f-m);font-size:8px;fill:var(--ink3)}.local .scale{stroke:var(--ink);stroke-width:2}.local .sl{font-family:var(--f-m);font-size:8.5px;fill:var(--ink2)}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}.poem{border-right:0;border-bottom:1px solid var(--line)}.grid2,.grid3{grid-template-columns:1fr}}
</style>
<header class="top">
  <div><h1>Solve Builder</h1><div class="sub">Beyond the Map's Edge</div></div>
  <select id="solveSel" style="width:auto;max-width:320px"></select>
  <button class="btn" id="newSolve">New solve</button>
  <button class="btn" id="forkBtn" title="Fork this solve at the selected line">Fork</button>
  <button class="btn" id="undoBtn" title="Undo">↶</button><button class="btn" id="redoBtn" title="Redo">↷</button>
  <button class="btn ai" id="devilBtn">Devil's advocate</button>
  <button class="btn ai" id="interviewBtn">Interview me</button>
  <button class="btn" id="themeBtn" title="Theme">◐</button>
  <div class="score" id="score"></div>
</header>
<div class="bar" id="bar"></div>
<div class="wrap"><aside class="poem" id="poem"></aside><main class="main"><div class="tabs" id="tabs"></div><div id="view"></div></main></div>
<div id="modal"></div>
<div id="sync" class="hint" style="position:fixed;right:10px;bottom:8px;font-family:var(--f-m);font-size:10px">starting</div>

<script>
"use strict";
/* =====================================================================
   SOLVE BUILDER — hosted edition.
   Shares the Field HQ store: poem/doc · intel/* · candidates/* (read).
   Its own collections: sb_solves/* · sb_rules/doc · sb_scratch/* · sb_findings/* · sb_statements/* · sb_readings/* · sb_settings/doc
   ===================================================================== */
const K = {"REGIONS":[{"id":"bighole","name":"Big Hole & Beaverhead valleys","states":"MT","bbox":[44.95,-113.95,45.95,-112.3],"status":"hot","dossier":{"terrain":"A broad, high (6,000 ft) hay-meadow valley ringed by the Pioneer, Anaconda-Pintler, Beaverhead and Bitterroot ranges. The Big Hole River runs north then east through willow bottoms; the Beaverhead is a slower ranch-country river with Beaverhead Rock rising alone from the flats near Dillon.","indigenous":["Big Hole valley — used by the Shoshone (Lemhi) and Nez Perce as a summer camas and hunting ground; the Nez Perce called the valley area near the 1877 battle 'Iskumtselalik Pah' (place of the ground squirrels) — translation commonly cited, verify.","Beaverhead Rock — Sacagawea recognised it from its resemblance to a swimming beaver's head; the Shoshone name is not consistently recorded — verify."],"trails":["Lewis and Clark 1805: up the Beaverhead (Jefferson's 'Philosophy' and 'Wisdom' rivers named here), Camp Fortunate (now under Clark Canyon Reservoir), over Lemhi Pass.","Nez Perce 1877 flight: Big Hole battlefield, Chief Joseph Pass, on to Bannack country.","Bannack–Virginia City stage road; Corinne (UT) to Bannack freight road."],"history":"Bannack (1862 gold, first territorial capital) is a state park; placer diggings on Grasshopper Creek; Wisdom and Jackson are ranch towns; Jackson Hot Springs lodge is private.","ownership":"Beaverhead-Deerlodge NF on the ranges; BLM on the foothills; large private ranches on the valley floor; Big Hole National Battlefield (NPS, fee-free, but a battle site — excluded by the rules); Clark Canyon Reservoir (BOR, free).","community":"The dominant Montana theory: Wisdom (S1L3), the Big Hole as the Hole (S2L3), Polaris for Ursa, Beaverhead Rock as the bride. Dillon is Posey's grandfather country per the book. Objections: heavily searched, the 'bride' is 40 miles from Polaris, and Posey has not confirmed Montana.","elimination":"in play — not eliminated","searchers":"Dozens of reports on Reddit and the MW forum; at least two full published solves (Big Hole cluster; Hidden Lake BOTG trips)."}},{"id":"pioneers","name":"Pioneer Mountains","states":"MT","bbox":[45.25,-113.35,45.85,-112.75],"status":"hot","dossier":{"terrain":"Two parallel granitic ranges (East and West Pioneers) split by the Wise River–Grasshopper valley, crossed by the Pioneer Mountains Scenic Byway. Cirque lakes, talus, lodgepole; Elkhorn Hot Springs and Crystal Park (free public quartz-crystal digging on the Pioneer batholith) on the byway.","indigenous":["No widely cited native names for the byway features — a gap to investigate at the Beaverhead County museum."],"trails":["Pioneer Mountains Scenic Byway (FS 484), Wise River to Polaris; upper section closed in winter (opens ~mid May).","Bannack–Elkhorn mining wagon roads."],"history":"Elkhorn and Polaris silver/lead mines; Coolidge ghost town (Elkhorn mine) on the byway; Polaris post office named for the Polaris mine.","ownership":"Almost entirely Beaverhead-Deerlodge NF; Crystal Park is FS with a day-use fee in season (fee is a rules question); private inholdings at Elkhorn Hot Springs and Maverick Mountain.","community":"The 'Polaris' reading of 'ursa east': Polaris MT is the north-star name; Crystal Park's granite fits 'granite bold'. Objection: the byway is a well-travelled road and the park is a developed site (buildings, toilets).","elimination":"in play","searchers":"Heavily searched summer 2025–2026; Posey's Sep 2026 meet-and-greet is in Polaris (an event, not a clue)."}},{"id":"grasshopper","name":"Grasshopper & Polaris corridor","states":"MT","bbox":[45.05,-113.35,45.5,-112.9],"status":"hot","dossier":{"terrain":"Grasshopper Creek valley from Bannack up to Polaris: sage benches, cottonwood bottoms, placer tailings, the road climbing toward the Pioneers.","indigenous":["Grasshopper Creek was 'Willard's Creek' to Lewis and Clark; native name not recorded — gap."],"trails":["Bannack freight road; Lewis and Clark passed the mouth of Grasshopper (Willard's) Creek on the Beaverhead."],"history":"1862 Grasshopper Creek gold discovery founded Bannack; Polaris mine (1885) and smelter; Bannack Days each July.","ownership":"Bannack State Park (fee, buildings — excluded); BLM and private ranch along the creek; NF above.","community":"Bridges the Wisdom/Big Hole and Polaris readings; the book's 'Grasshopper Valley' chapter name is why it matters.","elimination":"in play","searchers":"Moderate; mostly as a drive-through on the way to Polaris."}},{"id":"sweetwater","name":"Sweetwater & South Pass country","states":"WY","bbox":[42.2,-109.1,42.75,-106.9],"status":"hot","dossier":{"terrain":"High sage desert along the Sweetwater River with granite domes (Independence Rock, Devil's Gate, Split Rock, the Sweetwater Rocks) rising from the plain, climbing west to the broad saddle of South Pass on the Continental Divide.","indigenous":["Sweetwater — translation of the trappers' 'Eau Sucrée'; the Shoshone name is not consistently recorded — verify.","Split Rock was a Shoshone and Arapaho landmark; oral names not recorded in GNIS."],"trails":["Oregon, California, Mormon and Pony Express trails all follow the Sweetwater: Independence Rock, Devil's Gate, Martin's Cove, Split Rock, Ice Slough, Rocky Ridge, South Pass.","Lander Cutoff and Seminoe Cutoff.","Cherokee Trail to the south."],"history":"Emigrant names carved on Independence Rock (1840s–60s); Martin's Cove handcart tragedy 1856; South Pass City and Atlantic City gold (1867); Carissa mine.","ownership":"Independence Rock is a state historic site (free, rest area); Devil's Gate and Martin's Cove are on LDS-managed land with a visitor centre (buildings — rules question); Split Rock is BLM with a highway interpretive pullout; South Pass City is a state park (fee, buildings); the Sweetwater Rocks are BLM.","community":"The TreasureNet full walkthrough: Devil's Gate = ancient gates, Split Rock = double arcs on granite, ending at South Pass. Objection: no proper-noun Hole; everything is beside a highway.","elimination":"in play","searchers":"Many; the walkthrough was widely read."}},{"id":"windriver","name":"Wind River Range & Lander front","states":"WY","bbox":[42.5,-109.9,43.7,-108.0],"status":"hot","dossier":{"terrain":"Wyoming's highest range: a granite core with glacial cirques and hundreds of tarns, flanked on the east by the Wind River Reservation and the limestone canyons of the Popo Agie (Sinks Canyon) and on the north by the Wind River Canyon through the Owl Creek Mountains to Thermopolis.","indigenous":["Popo Agie — Crow, usually glossed 'beginning of the waters' or 'gurgling river' — verify.","Washakie — Shoshone chief; Fort Washakie is the reservation seat; Sacagawea's reputed grave is there (a grave — excluded as a site).","Wind River — the Shoshone called it the 'Warm Valley' (translation commonly cited)."],"trails":["Lander Cutoff of the Oregon Trail; Union Pass (Astorians 1811); Sheridan's 1877 Sinks Canyon route."],"history":"Atlantic City–South Pass gold to the south; Sinks Canyon CCC road; Thermopolis hot springs deeded by Chief Washakie (1896, the 'gift of the waters').","ownership":"Shoshone NF (free) above Sinks Canyon State Park (free, dogs on leash); Wind River Reservation (tribal permit required — a rules question); Hot Springs State Park (free but hours 6–10 — a rules question); BLM in the Wind River Canyon; Bridger-Teton on the west slope.","community":"Sinks Canyon (a natural Hole where the river vanishes and a Rise where it surges up) is on the list of places Posey searched for Fenn; Thermopolis offers 'Wedding of the Waters' for the bride at the gates. Objection: stanza 3 is unpinned in both.","elimination":"in play","searchers":"Growing since the Fenn-footprint statement; Sinks Canyon is a known Posey Fenn location."}},{"id":"lasals","name":"La Sal Mountains & Moab","states":"UT","bbox":[38.3,-109.9,38.9,-109.0],"status":"active","dossier":{"terrain":"Red sandstone canyon country around Moab (arches, fins, the Colorado River) rising to the laccolithic La Sal peaks above 12,000 ft with aspen basins, Medicine Lakes, Warner and Oowah lakes on the north and east slopes.","indigenous":["Tukuhnikivatz — Ute, commonly glossed 'where the sun sets last' or 'where the sun lingers' — verify.","La Sal — Spanish 'the salt' (Dominguez–Escalante 1776).","Moab — biblical name given by Mormon settlers; the Ute name for the valley is not consistently recorded."],"trails":["Old Spanish Trail crossed the Colorado at Moab.","Dominguez–Escalante expedition 1776 skirted the range.","La Sal Loop Road; Geyser Pass and La Sal Pass roads (high-clearance in places)."],"history":"Uranium boom 1950s (Charlie Steen); Potash Road; Matrimony Spring roadside legend; Castle Valley.","ownership":"Manti-La Sal NF on the range (free); BLM around Moab (some fee sites); Arches NP (fee, excluded by 24/7 access); private in Castle Valley and along the river road.","community":"The user's own working solve (Matrimony Spring, Corona/Bowtie arches, Medicine Lakes). Objections: outside Fenn's 2013 map, no granite (sandstone and intrusive porphyry), no bear name among the peaks, Medicine Lakes trailhead is a developed 4WD site.","elimination":"in play — but outside the Fenn map, which Posey used as his hunt area","searchers":"Some; the region is favoured mostly by Utah locals."}},{"id":"cityofrocks","name":"City of Rocks & the Idaho–Utah border","states":"ID,UT","bbox":[41.6,-114.3,42.6,-111.0],"status":"inplay","dossier":{"terrain":"Granite spires and domes (City of Rocks, Castle Rocks) on the California Trail, the Raft River valley, and east across the Curlew and Malad valleys to Bear Lake and the Bear River Range (limestone canyons, caves).","indigenous":["Bear River — Shoshone name commonly glossed as relating to the bear; verify.","City of Rocks: Shoshone-Bannock seasonal camps; no widely cited native name for the spires."],"trails":["California Trail (Register Rock, Twin Sisters as the trail's 'gateway'), Salt Lake Alternate, Kelton Road; Oregon Trail on the Snake to the north."],"history":"Emigrant axle-grease signatures on Register Rock (1840s–50s); Almo massacre legend (disputed); Bear Lake Monster legend; Minnetonka Cave.","ownership":"City of Rocks National Reserve (NPS/Idaho parks, free day use, dogs on leash, some fees to camp); Castle Rocks State Park (fee); Caribou-Targhee and Sawtooth NF; BLM; Bear Lake shoreline largely private/state park (fee).","community":"Strong on stanza 4 (granite, twins, arches) and weak on stanzas 2–3; the 42nd parallel is the state line, feeding the '42' number theories.","elimination":"in play","searchers":"Light."}},{"id":"bearlake","name":"Bear Lake","states":"ID,UT","bbox":[41.75,-111.6,42.25,-111.1],"status":"inplay","dossier":{"terrain":"A turquoise 20-mile lake on the Idaho–Utah line, the Bear River Range (limestone) to the west with Logan Canyon, Minnetonka Cave and Bloomington Lake; the Bear River loops around the north end.","indigenous":["Bear Lake — 'Black Bear Lake' in the trappers' record (Donald Mackenzie, 1819); Shoshone name not consistently recorded."],"trails":["Oregon Trail passed north of the lake through Montpelier; 1827 fur rendezvous on the south shore."],"history":"1827 and 1828 rendezvous; Bear Lake Monster newspaper legend (1868); Paris, ID tabernacle.","ownership":"State parks on the shore (fee); Caribou-Targhee NF and Uinta-Wasatch-Cache NF in the range (free); much private shoreline.","community":"Bear name for ursa; a lake rather than a hole; little else pinned.","elimination":"in play","searchers":"Light."}},{"id":"blackhills","name":"Black Hills & Bear Lodge","states":"SD,WY","bbox":[43.5,-104.9,44.9,-103.2],"status":"fringe","dossier":{"terrain":"A granite core (Needles, Cathedral Spires, Black Elk Peak) ringed by limestone and red beds; Devils Tower (phonolite) and the Bear Lodge Mountains on the Wyoming side; Spearfish Canyon waterfalls.","indigenous":["Paha Sap const R_MI=3958.8, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
function hav(a,b){const h=Math.sin(rad(b[0]-a[0])/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(rad(b[1]-a[1])/2)**2;return 2*R_MI*Math.asin(Math.sqrt(h))}
function brg(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])),x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return (deg(Math.atan2(y,x))+360)%360}
function dest(a,b,mi){const d=mi/R_MI,la1=rad(a[0]),lo1=rad(a[1]),t=rad(b);const la2=Math.asin(Math.sin(la1)*Math.cos(d)+Math.cos(la1)*Math.sin(d)*Math.cos(t));const lo2=lo1+Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(la1),Math.cos(d)-Math.sin(la1)*Math.sin(la2));return [+deg(la2).toFixed(5),+deg(lo2).toFixed(5)]}
const back = b => (b+180)%360;
function pip(pt,poly){const x=pt[1],y=pt[0];let inside=false;for(let i=0,n=poly.length;i<n;i++){const [y1,x1]=poly[i],[y2,x2]=poly[(i+1)%n];if((y1>y)!==(y2>y)){const xi=x1+(y-y1)*(x2-x1)/(y2-y1);if(x<xi)inside=!inside}}return inside}
function stateOf(lat,lon){if(lat==null)return null;if(lat>51)return "AK";for(const [k,poly] of Object.entries(K.STATES))if(pip([lat,lon],poly))return k;return null}
const inBox=(lat,lon,b)=>b[0]<=lat&&lat<=b[2]&&b[1]<=lon&&lon<=b[3];
const boxCenter=b=>[(b[0]+b[2])/2,(b[1]+b[3])/2];
function bboxOf(pts){const la=pts.map(p=>p[0]),lo=pts.map(p=>p[1]);return [Math.min(...la),Math.min(...lo),Math.max(...la),Math.max(...lo)]}

function parsePoem(raw){const out=[];let stanza=1,n=0,blank=false;for(const line of (raw||"").split(/\r?\n/)){const t=line.trim();if(!t){if(out.length)blank=true;continue}if(blank){stanza++;n=0;blank=false}n++;out.push({ref:`S${stanza}L${n}`,stanza,n,text:t})}return out}
function refMap(){ // Field HQ line ids (l01…) → S#L#
  const m={}; const counters={}; for(const l of (S.poem?.lines||[])){const s=l.stanza||1;counters[s]=(counters[s]||0)+1;m[l.id]=`S${s}L${counters[s]}`} return m }

/* ---------------- derive layers from the shared store (the "mapping") ---------------- */
function derive(){
  const rm=refMap();
  S.lines = S.poem ? (S.poem.lines||[]).map(l=>({ref:rm[l.id],stanza:l.stanza,n:+rm[l.id].split("L")[1],text:l.text,note:l.note,status:l.status,id:l.id})) : [];
  S.statements=[]; S.rumors=[]; S.book=[];
  for(const it of S.intel){
    const kind=it.kind||"community"; const tier=(CONF_TO_TIER[kind]||CONF_TO_TIER.community)[it.conf||"unverified"]||"unverified";
    const links=(it.links||[]).map(k=>({ref:rm[k.lineId]||k.lineId,stance:k.stance||"supports",why:k.why||""}));
    const rec={id:it.id,text:it.text||"",tier,source:it.source||"",date:it.when||"",tags:it.tags||[],links,origin:"db",kind};
    if(kind==="statement"){ const low=rec.text.toLowerCase(); rec.skind=DECLINE.some(w=>low.includes(w))?"declined":"answer"; rec.venue=it.source||""; S.statements.push(rec) }
    else if(kind==="book"){ S.book.push(rec) }
    else S.rumors.push(rec);
  }
  for(const s of S.manualStatements){ S.statements.push({...s, origin:s.origin||"manual"}) }
  // features: built-in + candidate sites
  const builtin=K.F.map((f,i)=>({id:"f_"+i,name:f.name,ftype:f.ftype,lat:f.lat,lon:f.lon,elev:f.elev,state:f.state,region:f.region,owner:f.owner,access:f.access,car:f.car,flags:f.flags,aliases:f.aliases,notes:f.notes,keys:f.keys,tier:"unverified",gnis:false,source:"built-in (Claude, general knowledge) · not verified in GNIS",origin:"builtin"}));
  const sites=[];
  for(const c of S.cands){ const ll=parseLL(c.coords); if(!ll)continue; const g=c.gates||{}; const flags=[]; if(g.g_public==="fail")flags.push("private"); if(g.g_free==="fail")flags.push("fee"); if(g.g_bldg==="fail")flags.push("buildings"); if(g.g_vehicle==="fail")flags.push("high-clearance"); if(g.g_notin==="fail")flags.push("cave"); const m=/([\d,]{3,6})\s*ft/.exec(c.elev||""); sites.push({id:"db_"+c.id,name:(c.name||"").split("—")[0].trim(),ftype:"site",lat:ll[0],lon:ll[1],elev:m?+m[1].replace(/,/g,""):null,state:(c.region||"").slice(0,2),region:"",owner:"",access:"",car:"",flags,aliases:[],notes:(c.notes||"").slice(0,600),keys:[],tier:"fan",gnis:false,source:"your database: "+(c.name||""),origin:"db"}) }
  S.features=builtin.concat(sites);
  S.regions=K.REGIONS;
  // reference solves: built-in community readings + your Field HQ chains
  const refs=K.REFERENCE_SOLVES.map((rs,i)=>({id:"ref_"+i,name:rs.name,kind:"reference",source:rs.source,state:{lines:Object.fromEntries(Object.entries(rs.lines).map(([ref,c])=>[ref,{text:c.text,category:c.category,lat:c.lat??null,lon:c.lon??null,conf:c.conf||1,tier:"circulating",rationale:"community reading",source:rs.source}])),seed:{},radius:{},overrides:{}}}));
  for(const c of S.cands){ if(!c.chain)continue; const lines={}; for(const [lid,s] of Object.entries(c.chain)){ const ref=rm[lid]||lid; const ll=parseLL(s.coords); lines[ref]={text:s.place||s.reading||"",rationale:s.reading||"",category:ll?"literal":"structural",lat:ll?ll[0]:null,lon:ll?ll[1]:null,conf:+(s.conf||1),tier:"fan",verdict:(c.verdicts||{})[lid]} } if(Object.keys(lines).length) refs.push({id:"db_"+c.id,name:c.name,kind:"reference",source:"your database",notes:c.notes,kill:c.kill,test:c.test,state:{lines,seed:{},radius:{},overrides:{}}}) }
  S.refSolves=refs;
}
const allSolves = () => S.solves.concat(S.refSolves);
const solveById = id => allSolves().find(s=>s.id===id);
function rules(){ if(!S.rulesDoc){ S.rulesDoc={rules:[...K.HARD_RULES.map(([id,text,code])=>({id,text,kind:"hard",enabled:true,code,source:"treasure.quest rules"})),...K.SOFT_RULES.map(([id,text,code])=>({id,text,kind:"soft",enabled:true,code,source:"interviews / Q&A"}))]} } return S.rulesDoc.rules }
function eliminated(){ const out=new Set(); for(const r of rules()) if(r.enabled&&r.code.startsWith("check:states:")) r.code.split(":")[2].split(",").forEach(s=>out.add(s)); for(const [st,v] of Object.entries(S.settings.mapStates||{})) if(v&&v.status==="eliminated") out.add(st); return out }

async function connect(){
  try{db=await claude.use("db")}catch(e){db=null}
  try{downloads=await claude.use("downloads")}catch(e){downloads=null}
  try{sampler=await claude.use("sample")}catch(e){sampler=null}
  if(!db){S.ready=true;setSync("local only — this view has no store");boot();return}
  setSync("connecting");
  let pending=9; const done=()=>{ if(--pending<=0 && !S.ready){S.ready=true;setSync("synced");boot()} else if(S.ready){derive();renderAll()} };
  db.doc("poem/doc").onSnapshot(s=>{S.poem=s.exists?s.data():null;done()},()=>done());
  db.collection("intel").onSnapshot(s=>{S.intel=s.docs.map(d=>({id:d.id,...(d.data()||{})}));done()},()=>done());
  db.collection("candidates").onSnapshot(s=>{S.cands=s.docs.map(d=>({id:d.id,...(d.data()||{})}));done()},()=>done());
  db.collection("sb_solves").onSnapshot(s=>{S.solves=s.docs.map(d=>({id:d.id,...(d.data()||{})})).sort((a,b)=>(b.updated||0)-(a.updated||0));done()},()=>done());
  db.doc("sb_rules/doc").onSnapshot(s=>{if(s.exists)S.rulesDoc=s.data();done()},()=>done());
  db.collection("sb_scratch").onSnapshot(s=>{S.scratch=s.docs.map(d=>({id:d.id,...(d.data()||{})}));done()},()=>done());
  db.collection("sb_findings").onSnapshot(s=>{S.findings=s.docs.map(d=>({id:d.id,...(d.data()||{})}));done()},()=>done());
  db.collection("sb_statements").onSnapshot(s=>{S.manualStatements=s.docs.map(d=>({id:d.id,...(d.data()||{})}));done()},()=>done());
  db.doc("sb_settings/doc").onSnapshot(s=>{if(s.exists)S.settings=s.data();done()},()=>done());
  setTimeout(()=>{ if(!S.ready){S.ready=true;setSync("synced (partial)");boot()} },4000);
}


/* ===================== ENGINE: constraints, suggestions, rules, scoring, reasoning ===================== */
const lineByRef = ref => S.lines.find(l=>l.ref===ref);
const lineIndex = ref => S.lines.findIndex(l=>l.ref===ref);
const committed = s => S.lines.filter(l=>s.state.lines[l.ref]).map(l=>[l.ref,s.state.lines[l.ref]]);
const pinned = s => committed(s).filter(([r,c])=>c.lat!=null&&c.lon!=null);
const regionOf = (lat,lon) => S.regions.find(r=>inBox(lat,lon,r.bbox))||null;
function statementsFor(ref){ return S.statements.filter(s=>!ref||s.links.some(l=>l.ref===ref)) }

function seedInfo(s){
  const seed=s.state.seed||{}; const info={states:new Set(seed.states||[]),region:null,bbox:null,point:null,endpoint:null,label:""};
  if(seed.region){const r=S.regions.find(x=>x.id===seed.region);if(r){info.region=r.id;info.bbox=r.bbox;r.states.split(",").forEach(x=>info.states.add(x));info.label=r.name}}
  if(seed.feature&&seed.feature.lat!=null){info.point=[seed.feature.lat,seed.feature.lon];info.label=(info.label?info.label+" · ":"")+(seed.feature.name||"pinned feature")}
  if(seed.endpoint&&seed.endpoint.lat!=null){info.endpoint=[seed.endpoint.lat,seed.endpoint.lon];info.label=(info.label?info.label+" · ":"")+"endpoint "+(seed.endpoint.name||"")}
  if(info.states.size&&!info.label)info.label=[...info.states].sort().join(", ");
  return info;
}
function constraintState(s, ref){
  const idx=ref?lineIndex(ref):S.lines.length; const seed=seedInfo(s); const elim=eliminated();
  const st={states:new Set(seed.states),eliminated:[...elim].sort(),bbox:seed.bbox,point:null,point_ref:null,next_point:null,next_ref:null,bearing:null,bearing_ref:null,elev:null,owner:null,distance:0,legs:[],seed:seed.label,manmade:[]};
  const pts=[];
  S.lines.forEach((l,i)=>{const c=s.state.lines[l.ref];if(!c)return;
    if(c.lat!=null){ if(pts.length){const d=hav(pts[pts.length-1][1],[c.lat,c.lon]);st.legs.push({from:pts[pts.length-1][0],to:l.ref,mi:+d.toFixed(1),bearing:Math.round(brg(pts[pts.length-1][1],[c.lat,c.lon]))});if(i<idx)st.distance+=d}
      pts.push([l.ref,[c.lat,c.lon]]); const so=stateOf(c.lat,c.lon); if(so&&i<idx)st.states.add(so);
      if(i<idx){st.point=[c.lat,c.lon];st.point_ref=l.ref;if(c.elev)st.elev=c.elev;if(c.owner)st.owner=c.owner} else if(st.next_point==null&&i>idx){st.next_point=[c.lat,c.lon];st.next_ref=l.ref} }
    if(c.bearing!=null&&i<idx){st.bearing=c.bearing;st.bearing_ref=l.ref}
    if(c.manmade)st.manmade.push(l.ref)});
  if(st.point==null&&seed.point){st.point=seed.point;st.point_ref="seed"}
  if(st.next_point==null&&seed.endpoint){st.next_point=seed.endpoint;st.next_ref="endpoint"}
  if(st.bbox==null&&pts.length>=2){const b=bboxOf(pts.map(p=>p[1]));st.bbox=[b[0]-.5,b[1]-.6,b[2]+.5,b[3]+.6]}
  st.states=[...st.states].sort(); st.distance=+st.distance.toFixed(1); st.region=st.point?(regionOf(...st.point)||{}).name||null:null;
  return st;
}
function ruleFlags(c){
  const out=[]; const flags=new Set(c.flags||[]);
  for(const r of rules()){ if(!r.enabled)continue; const code=r.code||"";
    if(code.startsWith("flag:")||code.startsWith("check:flag:")){const want=new Set(code.split("flag:")[1].split(","));const hit=[...flags].filter(f=>want.has(f));if(hit.length)out.push({rule:r.id,text:r.text,kind:r.kind,why:hit.join(", ")})}
    else if(code.startsWith("check:states:")&&code.split(":")[2].split(",").includes(c.state))out.push({rule:r.id,text:r.text,kind:r.kind,why:c.state});
    else if(code==="check:map"&&c.lat!=null&&!inBox(c.lat,c.lon,K.FENN_MAP_BBOX))out.push({rule:r.id,text:r.text,kind:r.kind,why:"outside the Fenn-map bounding box"});
    else if(code.startsWith("check:fenn:")&&c.lat!=null){const lim=+code.split(":")[2];const d=Math.min(...K.FENN_SITES.map(f=>hav([c.lat,c.lon],[f[1],f[2]])));if(d>lim)out.push({rule:r.id,text:r.text,kind:r.kind,why:`${d.toFixed(0)} mi from the nearest documented Fenn search`})} }
  if(c.elev&&c.elev>10560)out.push({rule:"elev",text:"Very high (above 10,560 ft) — hard to reach within a mile of a car",kind:"soft",why:c.elev+" ft"});
  return out;
}
function hintTypes(text){const types=new Set(),matched=[];for(const w of cw(text)){const stem=w.replace(/s$/,"");for(const [key,ts] of Object.entries(K.LINE_HINTS)){if(w===key||stem===key||w.startsWith(key)){ts.forEach(t=>types.add(t));matched.push(key)}}}return [types,matched]}
const IDEA_WORDS={"bear":["ursa","bear"],"north star / polaris":["ursa","pole","star","north"],"wisdom":["wisdom"],"hole":["hole"],"bride / wedding":["bride","her","face"],"gold":["secrets","treasure"],"needle":["pole"],"crown":["realm","guard"],"three":["three"],"twenty":["twenty"],"silence":["silent","rests"],"shadow":["shadowed","shadow"],"light":["bright","clear","sight"],"two / pair":["double","arcs"],"time":["time","ancient","past"],"face":["face","sight","his","her"]};
function nameIdeas(text){const ws=new Set(cw(text));return Object.entries(IDEA_WORDS).filter(([i,iw])=>iw.some(w=>ws.has(w))).map(([i])=>i)}
function ideaHits(f,ideas){const names=[f.name.toLowerCase(),...(f.aliases||[]).map(a=>a.toLowerCase())];return ideas.filter(idea=>(K.NAME_PATTERNS[idea]||[]).some(p=>names.some(n=>n.includes(p))))}

function suggestions(s, ref, opts={}){
  const line=lineByRef(ref); if(!line)return {error:"no such line"};
  const st=constraintState(s,ref), seed=seedInfo(s), state=s.state;
  const radius=opts.radius??(state.radius||{})[ref]??(st.point?30:400);
  const hard=opts.hard??!!state.hard_filter, hide=opts.hide??!!state.hide_violations, elim=new Set(st.eliminated);
  const [types,hintWords]=hintTypes(line.text), ideas=nameIdeas(line.text), stmts=statementsFor(ref), lineWords=new Set(cw(line.text));
  const out=[];
  const supportFor=text=>{const toks=new Set(cw(text));const sup=[],con=[];for(const x of stmts){for(const l of x.links){if(l.ref!==ref)continue;const overlap=[...toks].some(t=>cw(x.text).includes(t));if(overlap||sup.length+con.length<2)(l.stance==="contradicts"?con:sup).push({id:x.id,text:x.text.slice(0,220),tier:x.tier,date:x.date,kind:x.skind})}}return [sup.slice(0,4),con.slice(0,4)]};
  const add=c=>{c.category=c.category||"literal";c.tier=c.tier||"unverified";c.conf=c.conf||1;c.flags=c.flags||[];c.rules=ruleFlags(c);c.hard_violation=c.rules.some(r=>r.kind==="hard");c.seed_match=false;
    if(c.lat!=null){ if(c.state==null)c.state=stateOf(c.lat,c.lon); if(st.point)c.dist_active=+hav(st.point,[c.lat,c.lon]).toFixed(1); if(st.next_point)c.dist_next=+hav(st.next_point,[c.lat,c.lon]).toFixed(1);
      if(seed.point)c.dist_seed=+hav(seed.point,[c.lat,c.lon]).toFixed(1); else if(seed.bbox)c.dist_seed=inBox(c.lat,c.lon,seed.bbox)?0:+hav(boxCenter(seed.bbox),[c.lat,c.lon]).toFixed(1);
      if(seed.states.size&&seed.states.has(c.state))c.seed_match=true; if(seed.bbox&&inBox(c.lat,c.lon,seed.bbox))c.seed_match=true; if(seed.point&&(c.dist_seed??999)<=40)c.seed_match=true; if(elim.has(c.state))c.eliminated=true }
    const [sup,con]=supportFor((c.text||"")+" "+(c.rationale||"")); c.support=sup;c.contradict=con;
    let base=(CAT_WEIGHT[c.category]||.5)*(TIER_WEIGHT[c.tier]||.4)*(0.6+0.2*c.conf);
    if(c.dist_active!=null){ if(c.dist_active<=radius)base+=0.6*(1-c.dist_active/Math.max(radius,1)); else base-=Math.min(1,(c.dist_active-radius)/100) }
    if(c.dist_next!=null&&c.dist_next<=radius)base+=0.3; if(c.seed_match)base+=0.35; base+=0.15*sup.length-0.2*con.length; base-=0.25*c.rules.filter(r=>r.kind==="soft").length; if(c.hard_violation)base-=1; if(c.eliminated)base-=2; if(c.idea_hits?.length)base+=0.2*c.idea_hits.length;
    c.score=+base.toFixed(2); out.push(c)};
  // 1 literal / naming from the inventory
  for(const f of S.features){ const hits=ideaHits(f,ideas); const typeHit=types.has(f.ftype); const keyHit=(f.keys||[]).some(k=>hintWords.includes(k)||lineWords.has(k)); if(!(hits.length||typeHit||keyHit))continue;
    const why=[]; if(hits.length)why.push("name carries "+hits.join(", ")); if(typeHit)why.push(`a ${f.ftype} — the line's words point at that class`); if(keyHit&&!hits.length)why.push("keyword match on "+(f.keys||[]).filter(k=>hintWords.includes(k)||lineWords.has(k)).join(", "));
    add({id:f.id,category:hits.length&&!typeHit?"naming":"literal",text:f.name,rationale:why.join("; ")+(f.notes?". "+f.notes:""),lat:f.lat,lon:f.lon,elev:f.elev,state:f.state,region:f.region,owner:f.owner,access:f.access,car:f.car,ftype:f.ftype,flags:f.flags,tier:f.tier,source:f.source,aliases:f.aliases,idea_hits:hits,conf:hits.length?2:1,gnis:!!f.gnis,manmade:(f.flags||[]).includes("man-made")||["monument","historic"].includes(f.ftype)}) }
  // 2 feature classes
  for(const t of [...types].sort()){ const near=S.features.filter(f=>f.ftype===t&&(!st.point||hav(st.point,[f.lat,f.lon])<=radius)&&!elim.has(f.state)); add({id:"class_"+t,category:"feature_class",text:`Any ${t}`+(st.point?` within ${Math.round(radius)} mi`:" still in play"),rationale:`${near.length} known ${t}${near.length===1?"":"s"} in the built-in inventory meet the current constraints. The full federal (GNIS) list needs the local edition of this tool.`,count:near.length,members:near.slice(0,30).map(f=>({name:f.name,lat:f.lat,lon:f.lon,id:f.id})),tier:"unverified",conf:1}) }
  // 3 direction / action
  const txt=line.text.toLowerCase(); const numval={one:1,two:2,three:3,ten:10,twenty:20,forty:40};
  for(const n of (txt.match(/\b(twenty|three|two|one|ten|forty|\d+)\b/g)||[])){const v=numval[n]??(/^\d+$/.test(n)?+n:null);if(v!=null&&v<=360){add({id:"dir_"+v,category:"direction",text:`Bearing ${v}° (and back bearing ${back(v)}°)`,rationale:`'${n}' read as a compass bearing; 'return' would make it ${back(v)}°`,bearing:v,conf:txt.includes("degree")?2:1});add({id:"dist_"+v,category:"direction",text:`Distance ${v} (miles, feet, paces or minutes)`,rationale:"the number as a distance element — Posey said a distance element exists",conf:1})}}

  if(txt.includes("shadow")||txt.includes("sight"))add({id:"act_shadow",category:"direction",text:"Use a shadow or a sightline",rationale:"shadow at a given time and date gives a bearing; 'sight' suggests a line of sight from a fixed point",conf:1});

function fieldStops(s){const pins=pinned(s);if(!pins.length)return[];const rem=[...pins];const order=[rem.shift()];while(rem.length){const last=order[order.length-1][1];rem.sort((a,b)=>hav([last.lat,last.lon],[a[1].lat,a[1].lon])-hav([last.lat,last.lon],[b[1].lat,b[1].lon]));order.push(rem.shift())}return order.map(([ref,c],i)=>{const d=i?hav([order[i-1][1].lat,order[i-1][1].lon],[c.lat,c.lon]):0;const season=K.SEASON.filter(x=>x.match.some(m=>(c.text||"").toLowerCase().includes(m.toLowerCase()))).map(x=>x.text);return {stop:i+1,ref,name:c.text,lat:c.lat,lon:c.lon,elev:c.elev,expect:c.rationale||"",why:c.note||"",drive_mi:+d.toFixed(1),drive_min:d?Math.round(d*1.4/40*60):0,access:c.access||"unknown — check the access layer",car:c.car||"unknown",owner:c.owner||"unknown",hike:lineByRef(ref).stanza===4?"under a mile if the S4 reading holds":"to the feature",season,confirm:c.confirm||"Photograph the feature; note anything paired, arched, carved or hollow.",kill:c.kill||"The feature is not there, is on private or fee land, or needs gear."}})}
function rescoreAll(reason){const deltas=[];for(const s of S.solves){const sc=score(s);const cons=contradictions(s);const prev=s.state.last_score;const prevCodes=new Set(s.state.last_conflicts||[]);const codes=cons.map(c=>c.code);const affected=[...new Set(cons.filter(c=>!prevCodes.has(c.code)).flatMap(c=>c.refs))];if(prev==null||Math.abs(prev-sc.total)>0.01||codes.join()!==[...prevCodes].sort().join()){deltas.push({name:s.name,before:prev,after:sc.total,affected,new_conflicts:cons.filter(c=>!prevCodes.has(c.code)).map(c=>c.text)})}s.state.last_score=sc.total;s.state.last_conflicts=codes.sort();s.state.history_log=(s.state.history_log||[]).concat([{ts:Date.now(),event:"rescore:"+reason,before:prev,after:sc.total}]).slice(-40);saveSolve(s)}return deltas}

const poemBlock = () => S.lines.map(l=>`${l.ref}: ${l.text}`).join("\n");
const stmtBlock = (n=45) => [...S.statements].sort((a,b)=>(["confirmed","reported","circulating","fan","unverified"].indexOf(a.tier)-["confirmed","reported","circulating","fan","unverified"].indexOf(b.tier))||(b.date||"").localeCompare(a.date||"")).slice(0,n).map(s=>`- [${s.tier}${s.date?", "+s.date:""}] ${s.text.slice(0,260)}`).join("\n");
const rulesBlock = () => rules().filter(r=>r.enabled).map(r=>`- (${r.kind}) ${r.text}`).join("\n");
function solveBlock(s){const st=constraintState(s);const seed=seedInfo(s);const cons=contradictions(s);return `SOLVE: ${s.name}\nSeed: ${seed.label||"none"}\nStates in play: ${st.states.join(", ")||"any"}; eliminated: ${st.eliminated.join(", ")}\nRoute so far: ${st.distance} mi over ${st.legs.length} legs\n`+S.lines.map(l=>{const c=s.state.lines[l.ref];return c?`${l.ref} "${l.text}" → [${c.category}, conf ${c.conf}, tier ${c.tier}] ${c.text}${c.lat!=null?` @ ${(+c.lat).toFixed(4)},${(+c.lon).toFixed(4)}`:""}${c.note?" — note: "+c.note:""}`:`${l.ref} "${l.text}" → (uncommitted)`}).join("\n")+"\nDetected conflicts:\n"+(cons.map(c=>"- "+c.text).join("\n")||"- none")}
const frame = () => "You are the reasoning partner inside a solve-building tool for Justin Posey's poem-led treasure hunt 'Beyond the Map's Edge' (American West, book published 2025). Be concrete, sceptical and geographic. Prefer named features, bearings, distances and testable claims. Never invent a Posey quotation; when unsure whether he said something, say so. Distinguish confirmed from circulating. Flag any place name that might not exist in federal records.\n\nTHE POEM:\n"+poemBlock()+"\n\nRULES AND STATEMENTS IN FORCE:\n"+rulesBlock()+"\n\nPOSEY STATEMENTS ON THE BOARD (highest reliability first):\n"+stmtBlock();
async function ask(prompt,json){ if(!sampler)return {unavailable:"Ask Claude is not available in this view. Open the page inside claude.ai."}; try{ if(json){const r=await sampler.json(prompt,{cache:false,modelTier:"default"});return r&&typeof r==="object"?r:{error:"no JSON"}} const r=await sampler(prompt,{cache:false,modelTier:"default"});return {text:r.text} }catch(e){ return {error:e&&e.text?e.text:(e&&e.code==="not_granted"?"Ask Claude was not granted for this page.":e&&e.code==="rate_limited"?"Rate-limited — wait a minute.":"Could not answer: "+(e&&e.message||e))} } }
async function aiGenerate(s,ref,n,instr){const line=lineByRef(ref);const st=constraintState(s,ref);const r=await ask(frame()+"\n\n"+solveBlock(s)+`\n\nACTIVE CONSTRAINTS FOR ${ref}: states ${st.states.join(", ")||"any"}; active point ${st.point} (${st.point_ref}); next pinned point ${st.next_point} (${st.next_ref}); bearing ${st.bearing}; elevation ${st.elev}.\n\nTASK: Give ${n} materially different readings of ${ref} "${line.text}" that respect the constraints. Spread them across: ${CATEGORIES.map(c=>c[0]).join(", ")}. For each: text (the reading), category, rationale (one sentence), place (the specific place named, or ""), lat and lon (approximate numbers or null), conf 1–3 (3 = the line literally names it), exists_in_gnis one of yes/probably/unsure/no — be honest. ${instr?"Extra instruction from the user: "+instr:""}\nReturn JSON only: {"readings":[{"text":"","category":"","rationale":"","place":"","lat":null,"lon":null,"conf":1,"exists_in_gnis":"unsure"}]}`,true);if(!r.readings)return r;return {readings:r.readings.map(x=>({...x,id:"ai_"+uid("").slice(2),tier:"unverified",origin:"ai",source:"generated by the analyst — not a source; verify",category:CATS[x.category]?x.category:(x.lat!=null?"literal":"structural"),rationale:(x.rationale||"")+(x.exists_in_gnis?` · GNIS: ${x.exists_in_gnis}`:"")}))}}
const aiDevil = s => ask(frame()+"\n\n"+solveBlock(s)+"\n\nTASK: Argue against this solve as hard as you can. Do not soften it. Cover: (1) the strongest counter-evidence, (2) the Posey statements it conflicts with (quote only from the list above), (3) where the solver reasoned backward from a conclusion instead of forward from the poem, (4) lines where something plausible sits next to the text without producing a location, (5) the single field observation that would kill it fastest. Under 400 words, plain prose with short headings.");
const aiAssumptions = s => ask(frame()+"\n\n"+solveBlock(s)+"\n\nMechanical list:\n"+assumptions(s).map(a=>`- ${a.assumption} (load ${a.load}, cost ${a.cost})`).join("\n")+'\n\nTASK: List every assumption this solve depends on, including ones the mechanical list misses. Rank by load and by cost to test (1 = map or phone call, 2 = an hour of research, 3 = a field visit). For each name the single observation that would prove it wrong. JSON only: {"assumptions":[{"assumption":"","load":"","cheapest_test":"","would_prove_wrong":"","cost":1}]}',true);
const aiInterview = s => ask(frame()+"\n\n"+solveBlock(s)+"\n\nInterpretation types used across all the solver's solves: "+JSON.stringify(blindSpots().counts)+"\nWeakest links: "+JSON.stringify(weakestLinks(s).slice(0,5))+'\n\nTASK: Interview the solver. Five pointed questions exposing what they avoid: unassigned lines between pinned ones, low-confidence lines with lines built on top, interpretation types never used, a seed doing the work. Each names its line (ref, or "all"). JSON only: {"questions":[{"question":"","why":"","ref":""}]}',true);
const aiReverse = (s,rev) => ask(frame()+"\n\n"+solveBlock(s)+"\n\nWorked backward from endpoint "+JSON.stringify(rev.endpoint)+":\n"+rev.lines.map(o=>`- ${o.ref} would have to mean: ${o.would_have_to_mean} (${o.stretch?"STRETCH":"fits"}; ${o.distance_mi} mi)`).join("\n")+"\n\nTASK: Under 300 words: what each stanza would have to mean for this endpoint to be right, which readings are a stretch and why, whether the hunch survives. Be blunt.");
const aiRank = (s,res) => ask(frame()+"\n\nAutomatic search produced:\n"+res.map((r,i)=>`[${i}] score ${r.score} · ${r.region}\n`+Object.entries(r.lines).map(([ref,c])=>`  ${ref}: ${c.text}`).join("\n")).join("\n\n")+'\n\nTASK: Re-rank by how well they satisfy the poem, the rules and Posey\'s statements. One-line verdict, strongest and weakest line each. JSON only, best first: {"ranked":[{"index":0,"verdict":"","strongest_line":"","weakest_line":""}]}',true);
const aiDisagree = (a,b) => ask(frame()+`\n\nMY SOLVE: ${a.name}\nTHEIR SOLVE: ${b.name} (${b.source||""})\n`+S.lines.map(l=>{const x=a.state.lines[l.ref],y=b.state.lines[l.ref];return (x||y)?`${l.ref} "${l.text}": MINE = ${x?x.text:"—"} | THEIRS = ${y?y.text:"—"}`:null}).filter(Boolean).join("\n")+"\n\nTASK: Find the exact line where the two first fork and explain what each side is betting on there — the assumption, not who is right. Then any later lines where they converge. Under 300 words.");
const aiReact = (s,r) => ask(frame()+"\n\n"+solveBlock(s)+"\n\nThe solver just committed "+r.ref+". Mechanical analysis: "+r.summary+"\n"+r.changes.map(c=>"- "+c.text).join("\n")+"\n\nTASK: In three or four sentences, tell the solver what this choice just did to the rest of the poem — strengthened, made nearly impossible, gaps or ordering problems. Plain speech.");
const aiFeas = rows => ask(frame()+"\n\nWhole-poem feasibility by region (built-in inventory only):\n"+JSON.stringify(rows).slice(0,12000)+"\n\nTASK: For each region one line: can a complete valid solve exist, and if not which constraint kills it. Then the two regions most worth the next hour and why. Under 300 words.");

function newSolveDialog(){const regs=S.regions.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("");const elim=eliminated();const states=Object.keys(K.STATE_NAMES).filter(k=>!elim.has(k)).map(k=>`<label style="margin-right:8px"><input type="checkbox" value="${k}" class="seedSt"> ${k}</label>`).join("");modal(`<h2 style="margin-top:0">New solve</h2><input type="text" id="nsName" placeholder="Name" value="Solve ${S.solves.length+1}"><p class="hint">How do you want to start? Every seed is optional and can be added or removed later without losing work. A seed ranks suggestions; it never deletes them unless you turn on the hard filter.</p><div class="panel"><div class="pb"><div class="k">Poem first (default)</div><div class="hint">Nothing assumed about where. Suggestions span every state still in play.</div></div></div><div class="panel"><div class="pb"><div class="k">Seed states</div>${states}</div></div><div class="panel"><div class="pb"><div class="k">Seed a region</div><select id="nsRegion"><option value="">—</option>${regs}</select></div></div><div class="panel"><div class="pb"><div class="k">Seed a single feature (pin it to a line)</div><div class="row"><input type="text" id="nsFeat" placeholder="Name"><input type="text" id="nsFeatLL" placeholder="lat, lon" style="width:180px"><select id="nsFeatRef" style="width:110px"><option value="">line…</option>${S.lines.map(l=>`<option>${l.ref}</option>`).join("")}</select></div></div></div><div class="panel"><div class="pb"><div class="k">Seed an endpoint (work backward)</div><div class="row"><input type="text" id="nsEnd" placeholder="Where you think the treasure is"><input type="text" id="nsEndLL" placeholder="lat, lon" style="width:180px"></div></div></div><div class="row" style="justify-content:flex-end"><button class="btn gold" onclick="createSolve()">Create</button></div>`)}
function readSeedForm(){const seed={};const sts=[...document.querySelectorAll(".seedSt:checked")].map(c=>c.value);if(sts.length)seed.states=sts;if($("#nsRegion").value)seed.region=$("#nsRegion").value;const fl=parseLL($("#nsFeatLL").value);if(fl)seed.feature={name:$("#nsFeat").value,lat:fl[0],lon:fl[1],ref:$("#nsFeatRef")?.value||""};const el=parseLL($("#nsEndLL").value);if(el)seed.endpoint={name:$("#nsEnd").value,lat:el[0],lon:el[1]};return seed}
function createSolve(){const seed=readSeedForm();const s={id:uid("s"),name:$("#nsName").value||"Untitled solve",kind:"mine",created:Date.now(),updated:Date.now(),state:{lines:{},seed,radius:{},overrides:{},history:[],hard_filter:false,hide_violations:false}};if(seed.feature&&seed.feature.ref){s.state.lines[seed.feature.ref]={text:seed.feature.name,category:"literal",lat:seed.feature.lat,lon:seed.feature.lon,tier:"unverified",rationale:"seeded by you",conf:2,ts:Date.now()}}S.solves.unshift(s);saveSolve(s);modal("");S.sid=s.id;S.ref=null;S.sugg=null;renderAll()}
function seedDialog(){const m=needMine();if(!m)return;const sd=m.state.seed||{};const regs=S.regions.map(r=>`<option value="${r.id}" ${sd.region===r.id?"selected":""}>${esc(r.name)}</option>`).join("");const elim=eliminated();const states=Object.keys(K.STATE_NAMES).filter(k=>!elim.has(k)).map(k=>`<label style="margin-right:8px"><input type="checkbox" value="${k}" class="seedSt" ${(sd.states||[]).includes(k)?"checked":""}> ${k}</label>`).join("");modal(`<h2 style="margin-top:0">Seed</h2><p class="hint">Changing the seed re-ranks suggestions and re-scores; your committed lines stay.</p><div class="panel"><div class="pb"><div class="k">States</div>${states}</div></div><div class="panel"><div class="pb"><div class="k">Region</div><select id="nsRegion"><option value="">—</option>${regs}</select></div></div><div class="panel"><div class="pb"><div class="k">Feature</div><div class="row"><input type="text" id="nsFeat" value="${esc(sd.feature?.name||"")}" placeholder="Name"><input type="text" id="nsFeatLL" value="${sd.feature?sd.feature.lat+", "+sd.feature.lon:""}" placeholder="lat, lon" style="width:180px"></div></div></div><div class="panel"><div class="pb"><div class="k">Endpoint</div><div class="row"><input type="text" id="nsEnd" value="${esc(sd.endpoint?.name||"")}" placeholder="Name"><input type="text" id="nsEndLL" value="${sd.endpoint?sd.endpoint.lat+", "+sd.endpoint.lon:""}" placeholder="lat, lon" style="width:180px"></div></div></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="dropSeed()">Drop seed</button><button class="btn gold" onclick="saveSeed()">Save</button></div>`)}
function saveSeed(){const m=needMine();if(!m)return;snapshot(m);m.state.seed=readSeedForm();saveSolve(m);modal("");S.sugg=null;renderAll()}
function dropSeed(){const m=needMine();if(!m)return;const before=score(m).total;snapshot(m);m.state.seed={};saveSolve(m);modal("");S.sugg=null;renderAll();const sd=seedDependence(m);toast(`Unconstrained: score ${before} → ${score(m).total}; rank ${sd.unconstrained_rank||"?"} of ${sd.of} of your solves.`)}
function seedRegion(id){const m=needMine();if(!m)return;snapshot(m);m.state.seed={...(m.state.seed||{}),region:id};saveSolve(m);S.sugg=null;renderAll()}
function setOpt(k,v){const m=needMine();if(!m)return;m.state[k]=v;saveSolve(m);if(S.ref)selectLine(S.ref);else renderAll()}
function override(code,clear){const m=needMine();if(!m)return;m.state.overrides=m.state.overrides||{};if(clear)delete m.state.overrides[code];else{const note=prompt("Why are you overriding this conflict? (kept with the solve)");if(note===null)return;m.state.overrides[code]={note,ts:Date.now()}}saveSolve(m);renderAll()}
function uncommit(ref){const m=needMine();if(!m)return;snapshot(m);delete m.state.lines[ref];saveSolve(m);S.sugg=null;renderAll()}

/* ---- line panel ---- */
function selectLine(ref){S.ref=ref;S.tab="line";const v=view();S.sugg=v?suggestions(v,ref):null;renderPoem();renderTabs();viewLine()}
function viewLine(){const v=view();const el=$("#view");if(!v){el.innerHTML='<div class="gap">Create a solve to start.</div>';return}if(!S.ref){el.innerHTML='<div class="panel"><div class="pb"><p>Click a line on the left. The panel shows every candidate interpretation, tagged by the kind of leap it asks you to make, ranked by the running constraints and your seed, with the Posey statements for and against it.</p><p class="hint">Tip: commit stanza 2 first if you have a place in mind; commit stanza 1 last — it is method, not geography.</p></div></div>';return}const g=S.sugg||(S.sugg=suggestions(v,S.ref));const c=v.state.lines[S.ref];const ro=v.kind==="reference";const all=g.suggestions;const shown=all.filter(s=>!S.catFilter||s.category===S.catFilter);const counts={};for(const s of all)counts[s.category]=(counts[s.category]||0)+1;
  el.innerHTML=`<div class="panel"><div class="ph"><h3>${S.ref}</h3><span class="grow" style="font-size:15px">${esc(g.line.text)}</span>${c?'<span class="tag">committed</span>':""}</div><div class="pb"><div class="row"><label class="hint">radius <input type="range" min="1" max="400" value="${g.radius}" style="width:140px" oninput="this.nextElementSibling.textContent=this.value" onchange="setRadius(this.value)"> <b>${Math.round(g.radius)}</b> mi</label><span class="hint">${g.constraints.point?"from "+g.constraints.point_ref:"no active point — radius applies once a line above is pinned"}</span><span class="grow"></span><span class="hint">${g.shown} shown of ${g.total}</span></div>
  <div class="row" style="margin-top:6px"><input type="text" id="aiInstr" placeholder="Ask for more readings, e.g. 'assume I am in the Pioneer Mountains' or 'only readings that make S4L2 easier'" style="flex:1"><input type="number" id="aiN" value="15" style="width:70px"><button class="btn ai" onclick="moreReadings()" ${sampler?"":'disabled title="Ask Claude is not available in this view"'}>Generate readings</button></div>
  ${c?`<div class="panel" style="margin-top:8px"><div class="pb"><div class="k">${ro?"Reference reading":"Your commit"}</div><div class="row"><span class="grow">${catTag(c.category)} <b>${esc(c.text)}</b> ${tierTag(c.tier)}</span>${ro?"":`<label class="hint">sure <select onchange="updCommit({conf:+this.value})" style="width:auto">${[0,1,2,3].map(n=>`<option ${c.conf==n?"selected":""}>${n}</option>`).join("")}</select></label><label class="hint"><input type="checkbox" ${c.locked?"checked":""} onchange="updCommit({locked:this.checked})"> lock</label><label class="hint" title="Needs you physically present?"><input type="checkbox" ${c.field?"checked":""} onchange="updCommit({field:this.checked})"> needs field</label><label class="hint" title="Implies something man-made?"><input type="checkbox" ${c.manmade?"checked":""} onchange="updCommit({manmade:this.checked})"> man-made</label>`}</div>${ro?(c.rationale?`<div class="hint" style="margin-top:4px">${esc(c.rationale)}</div>`:""):`<textarea placeholder="Notes, evidence, links…" onchange="updCommit({note:this.value})" style="margin-top:6px;min-height:50px">${esc(c.note||"")}</textarea>`}</div></div>`:""}
  ${g.statements.length?`<div class="panel" style="margin-top:8px"><div class="ph"><h3>Posey on this line</h3><span class="hint">${g.statements.length} statements</span></div>${g.statements.slice(0,8).map(s=>`<div class="sug"><span><div style="font-size:13px">${s.stance==="contradicts"?'<span class="con">✕</span>':'<span class="sup">→</span>'} ${esc(s.text)}</div><div class="m">${tierTag(s.tier)} ${s.skind==="declined"?'<span class="tag" style="color:var(--warn)">declined / punted</span>':""} ${esc(s.date||"")} ${esc(s.venue||"")}</div></span></div>`).join("")}</div>`:'<div class="gap" style="margin-top:8px">No Posey statement is matched to this line in the archive. That is a gap, not evidence.</div>'}
  ${g.ideas.length?`<div class="row" style="margin-top:8px"><span class="k">name ideas</span>${g.ideas.map(i=>`<span class="chip">${esc(i)} · ${g.idea_counts[i]||0}</span>`).join("")}</div>`:""}</div></div>
  <div class="row" style="margin:6px 0"><span class="chips"><span class="chip ${!S.catFilter?"on":""}" onclick="S.catFilter='';viewLine()">All</span>${CATEGORIES.map(([k,l])=>`<span class="chip ${S.catFilter===k?"on":""}" onclick="S.catFilter='${k}';viewLine()">${l} ${counts[k]||0}</span>`).join("")}</span></div>
  <div class="panel">${shown.map(s=>sugHTML(s,ro)).join("")||'<div class="pb hint">Nothing survives the current filters. Widen the radius or turn off the hard filter.</div>'}</div>`}
function sugHTML(s,ro){const dist=[];if(s.dist_active!=null)dist.push(`${s.dist_active} mi from ${S.sugg.constraints.point_ref}`);if(s.dist_next!=null)dist.push(`${s.dist_next} mi to ${S.sugg.constraints.next_ref}`);if(s.dist_seed!=null)dist.push(`${s.dist_seed} mi from seed`);const viol=s.hard_violation||s.eliminated;const sid=String(s.id).replace(/[^A-Za-z0-9_-]/g,"_");S._byId=S._byId||{};S._byId[sid]=s;
  return `<div class="sug ${viol?"viol":""}"><span><div class="t">${catTag(s.category)} ${esc(s.text)} ${tierTag(s.tier)} ${s.seed_match?'<span class="tag" style="color:var(--gold)">seed</span>':""} ${s.lat!=null&&!s.gnis?'<span class="tag" title="Not checked against USGS GNIS — the local edition can verify it">unverified in GNIS</span>':""}${s.origin==="ai"?'<span class="tag" style="color:var(--ai)">AI</span>':""}</div><div class="r">${esc(s.rationale||"")}${s.rarity?` <b style="color:var(--gold)">Rarity: ${esc(s.rarity)}</b>`:""}</div><div class="m">${s.lat!=null?`<span class="mono">${(+s.lat).toFixed(4)}, ${(+s.lon).toFixed(4)}</span>`:""}${s.elev?`<span>${s.elev.toLocaleString()} ft</span>`:""}${s.state?`<span>${s.state}</span>`:""}${s.owner?`<span>${esc(s.owner)}</span>`:""}${s.car?`<span>car: ${esc(s.car)}</span>`:""}${dist.map(d=>`<span>${d}</span>`).join("")}${s.support?.length?`<span class="sup">${s.support.length} supporting</span>`:""}${s.contradict?.length?`<span class="con">${s.contradict.length} against</span>`:""}${(s.rules||[]).map(r=>`<span class="flag" title="${esc(r.why)}">${r.kind==="hard"?"⛔":"⚠"} ${esc(r.text)}</span>`).join("")}${s.eliminated?'<span class="flag">⛔ eliminated state</span>':""}${s.source?`<span title="${esc(s.source)}">${esc(String(s.source).slice(0,60))}</span>`:""}${s.count!=null?`<button class="btn sm" onclick="expandClass('${sid}')">list ${s.count}</button>`:""}</div></span><span class="acts"><span class="hint">score ${s.score}</span>${ro?"":`<select id="conf_${sid}"><option value="1">sure 1</option><option value="2" ${s.conf===2?"selected":""}>sure 2</option><option value="3" ${s.conf===3?"selected":""}>sure 3</option></select><button class="btn sm gold" onclick="commitId('${sid}')">Commit</button>`}${s.lat!=null?`<button class="btn sm" onclick="showOnMap(${s.lat},${s.lon})">map</button>`:""}</span></div>`}
function expandClass(sid){const s=S._byId[sid];modal(`<h3 style="margin-top:0">Members</h3>${(s.members||[]).map(m=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="grow">${esc(m.name)}</span><span class="mono">${m.lat}, ${m.lon}</span><button class="btn sm" onclick="modal('');commitCand({id:'${m.id}',text:${JSON.stringify(m.name)},category:'literal',lat:${m.lat},lon:${m.lon},tier:'unverified',rationale:'chosen from the feature-class list'},1)">Commit</button></div>`).join("")}<p class="hint">The complete federal (GNIS) list for a class needs the local edition.</p>`)}
function setRadius(v){const m=needMine();if(!m)return;m.state.radius=m.state.radius||{};m.state.radius[S.ref]=+v;saveSolve(m);selectLine(S.ref)}
function updCommit(patch){const m=needMine();if(!m)return;Object.assign(m.state.lines[S.ref],patch);saveSolve(m);renderPoem();renderHeader()}
function commitId(sid){const s=S._byId[sid];const sel=document.getElementById("conf_"+sid);commitCand(s,sel?+sel.value:(s.conf||1))}
function commitCand(s,conf){const m=needMine();if(!m)return;const before=JSON.parse(JSON.stringify(m));snapshot(m);const cand={...s};delete cand.support;delete cand.contradict;delete cand.members;delete cand.rules;cand.conf=conf;cand.ts=Date.now();if(cand.category==="direction"&&cand.bearing==null){const mm=/(\d{1,3})°/.exec(cand.text||"");if(mm)cand.bearing=+mm[1]}m.state.lines[S.ref]=cand;saveSolve(m);const r=react(before,m,S.ref);m.state.history_log=(m.state.history_log||[]).concat([{ts:Date.now(),event:"commit "+S.ref,before:r.score_before,after:r.score_after,detail:cand.text}]).slice(-40);S.sugg=null;renderAll();showReaction(r)}
function showReaction(r){const el=document.createElement("div");el.className="panel react";el.innerHTML=`<div class="ph"><h3>What just changed</h3><span class="grow"></span><button class="btn sm ai" id="explainBtn" ${sampler?"":"disabled"}>Explain (AI)</button><button class="btn sm" onclick="this.closest('.panel').remove()">✕</button></div><div class="pb"><p style="margin:0 0 6px">${esc(r.summary)}</p>${r.changes.map(c=>`<div class="hint">${c.direction==="down"?"▼":"▲"} ${esc(c.text)}</div>`).join("")}${r.new_conflicts.map(c=>`<div style="color:var(--warn)">⚠ ${esc(c.text)}</div>`).join("")}<div id="explainOut"></div></div>`;$("#view").prepend(el);el.querySelector("#explainBtn").onclick=async()=>{el.querySelector("#explainOut").innerHTML='<div class="hint">Thinking…</div>';const a=await aiReact(view(),r);el.querySelector("#explainOut").innerHTML=`<div class="ai-out" style="margin-top:8px">${esc(a.text||a.error||a.unavailable)}</div>`}}
async function moreReadings(){const v=view();if(!v)return;const instr=$("#aiInstr").value,n=+$("#aiN").value||15;$("#view").insertAdjacentHTML("afterbegin",'<div class="hint" id="genwait">Generating readings with the current solve state as context…</div>');const r=await aiGenerate(v,S.ref,n,instr);$("#genwait")?.remove();if(!r.readings){toast(r.error||r.unavailable);return}S.saved[S.ref]=(S.saved[S.ref]||[]).concat(r.readings);S.sugg=suggestions(v,S.ref);viewLine();toast(r.readings.length+" AI readings added — tagged AI, tier unverified.")}

/* ---- map ---- */
function pins(){const v=view();if(!v)return[];return S.lines.filter(l=>v.state.lines[l.ref]&&v.state.lines[l.ref].lat!=null).map(l=>({ref:l.ref,...v.state.lines[l.ref]}))}
const PX=(lat,lon)=>[((lon+125)*10).toFixed(1),((49.6-lat)*13).toFixed(1)];
function viewMap(){const v=view();const el=$("#view");if(!v){el.innerHTML='<div class="gap">Create a solve.</div>';return}const c=constraintState(v);const P=pins();const elim=eliminated();const inplay=new Set(c.states);
  const states=Object.entries(K.STATES).map(([id,pts])=>`<path class="st ${elim.has(id)?"st-elim":inplay.has(id)?"st-in":"st-open"}" d="M${pts.map(([la,lo])=>PX(la,lo).join(" ")).join("L")}Z"><title>${K.STATE_NAMES[id]}</title></path><text class="lbl" x="${PX(pts.reduce((a,p)=>a+p[0],0)/pts.length,pts.reduce((a,p)=>a+p[1],0)/pts.length)[0]}" y="${+PX(pts.reduce((a,p)=>a+p[0],0)/pts.length,pts.reduce((a,p)=>a+p[1],0)/pts.length)[1]+3}">${id}</text>`).join("");
  const route=P.length>1?`<polyline fill="none" stroke="var(--gold)" stroke-width="1" stroke-dasharray="2 1.2" points="${P.map(p=>PX(p.lat,p.lon).join(",")).join(" ")}"/>`:"";
  const marks=P.map(p=>{const [x,y]=PX(p.lat,p.lon);return `<circle cx="${x}" cy="${y}" r="2.2" fill="var(--ok)" stroke="var(--g0)" stroke-width=".8"><title>${p.ref} ${esc(p.text)}</title></circle><text x="${+x+3}" y="${+y-2}" style="font-family:var(--f-m);font-size:4.6px;fill:var(--ink)">${p.ref}</text>`}).join("");
  const fenn=K.FENN_MAP_BBOX;const [fx1,fy1]=PX(fenn[2],fenn[1]),[fx2,fy2]=PX(fenn[0],fenn[3]);
  el.innerHTML=`<div class="panel sheet"><div class="ph"><h3>Route</h3><span class="hint">${c.legs.length} legs · ${c.distance} mi · gold dashed box = Fenn 2013 map · hatched = eliminated</span></div><svg viewBox="80 60 260 190" role="img">${states}<rect x="${fx1}" y="${fy1}" width="${fx2-fx1}" height="${fy2-fy1}" fill="none" stroke="var(--gold)" stroke-width=".6" stroke-dasharray="2 1.5"/>${route}${marks}</svg></div>${localSheet(v)}<div class="grid2"><div class="panel"><div class="ph"><h3>Legs</h3></div><table><tr><th>from</th><th>to</th><th>mi</th><th>bearing</th></tr>${c.legs.map(l=>`<tr><td>${l.from}</td><td>${l.to}</td><td>${l.mi}</td><td>${l.bearing}°</td></tr>`).join("")||'<tr><td class="hint" colspan=4>Pin two lines to see legs.</td></tr>'}</table></div><div class="panel"><div class="ph"><h3>Elevation profile</h3></div><div class="pb">${(()=>{const w=P.filter(p=>p.elev);if(w.length<2)return '<span class="hint">Appears when two or more pinned lines carry an elevation.</span>';const mn=Math.min(...w.map(x=>x.elev)),mx=Math.max(...w.map(x=>x.elev));return `<svg viewBox="0 0 400 120" style="width:100%"><polyline fill="none" stroke="var(--gold)" stroke-width="2" points="${w.map((p,i)=>`${i/(w.length-1)*380+10},${110-(p.elev-mn)/Math.max(1,mx-mn)*100}`).join(" ")}"/>${w.map((p,i)=>`<text x="${i/(w.length-1)*380+10}" y="118" font-size="9" fill="var(--ink2)" text-anchor="middle">${p.ref} ${p.elev}</text>`).join("")}</svg>`})()}</div></div></div><p class="hint">Map tiles cannot load inside an artifact, so this is a schematic. Click "map" on any candidate to see it on the local sheet below. Use the local edition for OpenStreetMap and USGS topo tiles.</p>`}
function localSheet(v,focus){const P=pins();const pts=P.map(p=>({p:[p.lat,p.lon],ref:p.ref,text:p.text,stanza:lineByRef(p.ref).stanza}));if(focus)pts.push({p:focus,ref:"",text:"selected candidate",stanza:0});if(!pts.length)return `<div class="panel"><div class="pb hint">Pin a candidate with coordinates and the local sheet draws itself: pins, the 20° and 200° rays from the stanza-3 pin, and the one-mile circle on the last pin.</div></div>`;
  const s3=pts.find(x=>x.stanza===3)||pts[0],s4=pts.filter(x=>x.stanza===4).pop()||pts[pts.length-1];const rays=[20,200].map(b=>({b,end:dest(s3.p,b,8)}));const all=pts.map(x=>x.p).concat(rays.map(r=>r.end));let lat0=Math.min(...all.map(p=>p[0])),lat1=Math.max(...all.map(p=>p[0])),lon0=Math.min(...all.map(p=>p[1])),lon1=Math.max(...all.map(p=>p[1]));const padLat=Math.max(.06,(lat1-lat0)*.18),padLon=Math.max(.08,(lon1-lon0)*.18);lat0-=padLat;lat1+=padLat;lon0-=padLon;lon1+=padLon;const W=640,H=420,cosl=Math.cos(rad((lat0+lat1)/2));const sc=Math.min(W/((lon1-lon0)*cosl),H/(lat1-lat0));const X=lo=>((lo-lon0)*cosl*sc+(W-(lon1-lon0)*cosl*sc)/2).toFixed(1),Y=la=>(H-((la-lat0)*sc)-(H-(lat1-lat0)*sc)/2).toFixed(1);const mileR=sc/69;const step=(lat1-lat0)>.6?.25:.1;let grid="";for(let la=Math.ceil(lat0/step)*step;la<lat1;la+=step)grid+=`<line class="gridl" x1="0" x2="${W}" y1="${Y(la)}" y2="${Y(la)}"/><text class="gl" x="4" y="${+Y(la)-3}">${la.toFixed(2)}</text>`;for(let lo=Math.ceil(lon0/step)*step;lo<lon1;lo+=step)grid+=`<line class="gridl" y1="0" y2="${H}" x1="${X(lo)}" x2="${X(lo)}"/><text class="gl" x="${+X(lo)+3}" y="${H-6}">${lo.toFixed(2)}</text>`;
  const rt=P.length>1?`<polyline class="rt" points="${P.map(p=>X(p.lon)+","+Y(p.lat)).join(" ")}"/>`:"";const rayH=rays.map(r=>`<line class="ray" x1="${X(s3.p[1])}" y1="${Y(s3.p[0])}" x2="${X(r.end[1])}" y2="${Y(r.end[0])}"/><text class="raylbl" x="${+X(r.end[1])+4}" y="${+Y(r.end[0])+3}">${r.b}°</text>`).join("");const pinH=pts.map(x=>`<circle class="pin ${x.stanza===4?"s4":""}" cx="${X(x.p[1])}" cy="${Y(x.p[0])}" r="5" ${x.ref?"":'style="fill:var(--c2)"'}/><text class="pl" x="${+X(x.p[1])+8}" y="${+Y(x.p[0])+4}">${x.ref?x.ref+" ":""}${esc((x.text||"").slice(0,28))}</text>`).join("");const scaleMi=mileR*5>120?1:5;
  let legs="",total=0;for(let i=1;i<P.length;i++){const d=hav([P[i-1].lat,P[i-1].lon],[P[i].lat,P[i].lon]);total+=d;legs+=`<tr><td>${P[i-1].ref} → ${P[i].ref}</td><td class="mono" style="text-align:right">${d.toFixed(1)} mi · ${Math.round(brg([P[i-1].lat,P[i-1].lon],[P[i].lat,P[i].lon]))}°</td></tr>`}const fennD=Math.min(...K.FENN_SITES.map(f=>hav(s4.p,[f[1],f[2]])));
  return `<div class="panel local"><div class="ph"><h3>Local sheet</h3><span class="hint">rays from ${s3.ref||"anchor"} · mile circle on ${s4.ref||"last pin"}</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}<circle class="mile" cx="${X(s4.p[1])}" cy="${Y(s4.p[0])}" r="${mileR.toFixed(1)}"/>${rt}${rayH}${pinH}<line class="scale" x1="${W-20-mileR*scaleMi}" x2="${W-20}" y1="${H-18}" y2="${H-18}"/><text class="sl" x="${W-20}" y="${H-24}" text-anchor="end">${scaleMi} mi</text></svg><div class="pb"><table>${legs}<tr><td><b>Route total</b></td><td class="mono" style="text-align:right"><b>${total.toFixed(1)} mi</b></td></tr><tr><td>Nearest documented Fenn-search site to the last pin</td><td class="mono" style="text-align:right;color:${fennD<=75?"var(--ok)":"var(--bad)"}">${fennD.toFixed(0)} mi</td></tr></table></div></div>`}
function showOnMap(lat,lon){S.tab="map";renderTab();const v=view();const el=$("#view");if(!v)return;el.querySelector(".local")?.remove();el.querySelector(".panel.sheet")?.insertAdjacentHTML("afterend",localSheet(v,[lat,lon]));toast(`Candidate at ${lat}, ${lon} shown in blue on the local sheet.`)}

/* ---- bearing ---- */
function viewBearing(){const v=view();const el=$("#view");if(!v){el.innerHTML='<div class="gap">Create a solve.</div>';return}const P=pins();const c=constraintState(v);el.innerHTML=`<div class="panel"><div class="ph"><h3>Bearing & distance</h3><span class="hint">project from any pinned point; back bearing included; snaps to named features in the inventory</span></div><div class="pb"><div class="row"><select id="bFrom" style="width:auto"><option value="">from…</option>${P.map(p=>`<option value="${p.lat},${p.lon}">${p.ref} ${esc(p.text)}</option>`).join("")}</select><input type="text" id="bLL" placeholder="or lat, lon" style="width:180px"><input type="number" id="bBrg" placeholder="bearing °" style="width:110px" value="${c.bearing??20}"><input type="number" id="bMi" placeholder="miles" style="width:100px" value="1"><button class="btn gold" onclick="project()">Project</button></div><div id="bOut" style="margin-top:10px"></div></div></div>`}
function project(){const from=parseLL($("#bLL").value)||($("#bFrom").value?$("#bFrom").value.split(",").map(Number):null);if(!from)return toast("Pick a start point");const b=+$("#bBrg").value,mi=+$("#bMi").value;const d=dest(from,b,mi),bk=dest(from,back(b),mi);const near=pt=>S.features.map(f=>({...f,dist_mi:+hav(pt,[f.lat,f.lon]).toFixed(2)})).sort((a,b)=>a.dist_mi-b.dist_mi).slice(0,6);const block=(title,pt,ns)=>`<div class="panel"><div class="ph"><h3>${title}</h3><span class="mono">${pt[0]}, ${pt[1]}</span><span class="grow"></span><button class="btn sm" onclick="showOnMap(${pt[0]},${pt[1]})">map</button></div><table><tr><th>nearest named feature</th><th>type</th><th>mi</th><th></th></tr>${ns.map(f=>{S._byId=S._byId||{};const sid="proj_"+f.id;S._byId[sid]={id:sid,text:f.name,lat:f.lat,lon:f.lon,elev:f.elev,ftype:f.ftype,owner:f.owner,tier:f.tier,category:"literal",rationale:`landed by projecting ${b}° for ${mi} mi`,flags:f.flags,conf:1,score:0};return `<tr><td>${esc(f.name)} ${tierTag(f.tier)}</td><td>${f.ftype}</td><td>${f.dist_mi}</td><td><select id="save_${sid}" style="width:auto;padding:1px 3px">${S.lines.map(l=>`<option ${l.ref===S.ref?"selected":""}>${l.ref}</option>`).join("")}</select> <button class="btn sm" onclick="saveCand('${sid}')">save as candidate</button></td></tr>`}).join("")}</table><div class="pb hint">Snapping to every GNIS name needs the local edition; here it snaps to the built-in inventory and your sites.</div></div>`;$("#bOut").innerHTML=`<div class="grid2">${block(`${b}° · ${mi} mi`,d,near(d))}${block(`back bearing ${back(b)}° · ${mi} mi`,bk,near(bk))}</div>`}
function saveCand(sid){const s=S._byId[sid];const sel=document.getElementById("save_"+sid);const ref=sel?sel.value:S.ref;if(!ref)return toast("Pick a line");(S.saved[ref]=S.saved[ref]||[]).push({...s,id:"saved_"+sid});toast(`Saved as a candidate for ${ref}. Open that line to commit it.`)}

/* ---- cipher ---- */
function viewCipher(){const poemWords=S.lines.flatMap(l=>l.text.split(/\s+/));const items=[...S.scratch].sort((a,b)=>(b.created||0)-(a.created||0));$("#view").innerHTML=`<div class="grid2"><div class="panel"><div class="ph"><h3>Number & cipher scratchpad</h3></div><div class="pb"><textarea id="scText" placeholder="Page numbers, the missing page, letter sums, coordinate fragments, dates…"></textarea><div class="row" style="margin-top:6px"><input type="text" id="scTags" placeholder="tags (comma separated), e.g. S3L3, 42, page-90"><button class="btn gold" onclick="saveScratchUI()">Save</button></div><div style="margin-top:10px"><div class="k">Quick tools</div><div class="row"><input type="text" id="qWord" placeholder="word or phrase" style="width:220px"><button class="btn sm" onclick="quick()">Letter sum / positions</button><input type="number" id="qN" placeholder="word #" style="width:90px"><button class="btn sm" onclick="wordN()">Word N of poem</button></div><div id="qOut" class="mono" style="margin-top:6px"></div></div></div></div><div class="panel"><div class="ph"><h3>Saved results</h3><span class="hint">${items.length}</span></div>${items.map(i=>`<div class="sug"><span><div>${esc(i.text)}</div><div class="m">${(i.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")} ${esc(i.result||"")}</div></span><span class="acts"><select id="pull_${i.id}" style="width:auto">${S.lines.map(l=>`<option ${l.ref===S.ref?"selected":""}>${l.ref}</option>`).join("")}</select><button class="btn sm" onclick="pullScratch('${i.id}')">pull into line</button><button class="btn sm bad" onclick="delScratch('${i.id}')">✕</button></span></div>`).join("")||'<div class="pb hint">Nothing saved yet.</div>'}</div></div><div class="panel"><div class="ph"><h3>Poem numbers</h3></div><div class="pb mono">${poemWords.length} words · ${S.lines.length} lines · word 42 = “${esc(poemWords[41]||"")}” · letters per line ${S.lines.map(l=>l.text.replace(/[^A-Za-z]/g,"").length).join(" / ")}</div></div>`}
function saveScratchUI(){const x={id:uid("sc"),text:$("#scText").value,tags:$("#scTags").value.split(",").map(s=>s.trim()).filter(Boolean),result:$("#qOut").textContent,created:Date.now()};if(!x.text)return;S.scratch.push(x);saveScratch(x);viewCipher()}
